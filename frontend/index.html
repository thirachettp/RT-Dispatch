            <div class="as-d"><span>รหัสพนักงาน</span><b class="mono">${p.employee_id}</b></div>
            <div class="as-d"><span>สิทธิ์</span><b>${ROLE_TH[p.role] || p.role}${
              p.is_requester ? " · ผู้ของานนี้" : p.is_crew ? " · คนขับในงานนี้" : ""}</b></div>
            <div class="as-d"><span>Cost center</span><b>${p.cost_center || "ไม่มี"}</b></div>
            <div class="as-d"><span>เบอร์ติดต่อ</span><b>${p.contact
              ? `<a href="#" class="copy-phone" data-phone="${p.contact}">${fmtPhone(p.contact)}</a>
                 <span class="copy-hint">กดเพื่อคัดลอก</span>`
              : "ไม่มี"}</b></div>
            ${p.email ? `<div class="as-d"><span>อีเมล</span><b>${p.email}</b></div>` : ""}
          </div>`
        : `<div class="empty">ไม่พบข้อมูลของ ${employeeId}</div>`}
      </div>
    </div>`);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  overlay.querySelectorAll(".copy-phone").forEach(a=>{
    a.onclick = async (e)=>{
      e.preventDefault();
      try{ await navigator.clipboard.writeText(a.dataset.phone); toast(`คัดลอกเบอร์ ${fmtPhone(a.dataset.phone)} แล้ว`); }
      catch(_){ toast(`เบอร์: ${fmtPhone(a.dataset.phone)}`); }
    };
  });
}

async function openChatSheet(taskId){
  const overlay = el(`
    <div class="sheet-overlay" data-chat-task="${taskId}">
      <div class="sheet sheet-full">
        <div class="sheet-head"><h2>แชทงาน</h2><button class="sheet-close">✕</button></div>
        <div id="chat-top"><div class="empty">กำลังโหลด...</div></div>
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-input-row">
          <input id="chat-input" placeholder="พิมพ์ข้อความ..." />
          <button class="btn amber" id="chat-send">ส่ง</button>
        </div>
      </div>
    </div>`);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };

  const top = overlay.querySelector("#chat-top");
  async function loadTask(){
    try{
      const t = await api(`/tasks/${taskId}`, {background:true});
      top.innerHTML = "";
      top.appendChild(el(chatDetailsHTML(t)));
      const actions = buildTaskDetailActions(t).replace(/<button class="btn" data-chat="[^"]*">💬 แชท<\/button>/g, "");
      if(actions.trim()){
        const bar = el(`<div class="card-actions chat-actions" data-id="${t.id}">${actions}</div>`);
        // bindCardActions looks up the task id from the nearest .card
        const wrap = el(`<div class="card chat-card" data-id="${t.id}"></div>`);
        wrap.appendChild(bar);
        top.appendChild(wrap);
        bindTaskDetailActions(wrap);
        // Whatever button is pressed here changes the job; pick up the result
        // (and the automatic chat line it produces) right away.
        wrap.addEventListener("click", (e)=>{
          if(e.target.closest("button")) setTimeout(()=>{ lastCount = -2; loadMessages(); loadTask(); }, 900);
        }, true);
      }
      top.querySelectorAll(".copy-code").forEach(a=>{
        a.onclick = async (e)=>{
          e.preventDefault();
          try{ await navigator.clipboard.writeText(a.dataset.code); toast(`คัดลอก ${a.dataset.code} แล้ว`); }
          catch(_){ toast(a.dataset.code); }
        };
      });
      top.querySelectorAll(".copy-phone").forEach(a=>{
        a.onclick = async (e)=>{
          e.preventDefault();
          const num = a.dataset.phone;
          try{ await navigator.clipboard.writeText(num); toast(`คัดลอกเบอร์ ${fmtPhone(num)} แล้ว`); }
          catch(_){ toast(`เบอร์: ${fmtPhone(num)}`); }
        };
      });
    }catch(e){ top.innerHTML = ""; top.appendChild(el(`<div class="err">${e.message}</div>`)); }
  }

  // Who is in this chat, with the details to reach them. Fetched once on open
  // rather than carried on every message — the poll runs every three seconds.
  let people = [];
  async function loadPeople(){
    try{ people = await api(`/tasks/${taskId}/people`, {background:true}); }
    catch(e){ people = []; }
  }

  let lastCount = -1;
  async function loadMessages(){
    if(document.activeElement === overlay.querySelector("#chat-input")) return; // don't yank focus while typing
    try{
      const msgs = await api(`/tasks/${taskId}/messages`, {background:true});
      const log = overlay.querySelector("#chat-log");
      if(!log) return;
      // A new automatic line means the job itself changed — refresh the
      // details above so the status and buttons are never stale.
      const newSystem = lastCount >= 0 && msgs.length > lastCount &&
        msgs.slice(lastCount).some(m=> m.kind === "system");
      if(msgs.length === lastCount) return;   // nothing new: leave the log alone
      lastCount = msgs.length;
      log.innerHTML = "";
      if(msgs.length === 0){ log.appendChild(el(`<div class="empty">ยังไม่มีข้อความ เริ่มการสนทนาได้เลย</div>`)); }
      msgs.forEach(m=>{
        if(m.kind === "system"){
          log.appendChild(el(`<div class="chat-sys"><span>${m.message}</span><em>${fmtTime(m.created_at)}</em></div>`));
          return;
        }
        const mine = m.sender_employee_id === state.employee_id;
        // The name, not the employee id — and tappable, because "who is
        // ประตู-12 asking about" is usually followed by "what is their
        // number".
        const who = mine ? "คุณ"
          : `<a href="#" class="who-link" data-who="${m.sender_employee_id}">${m.sender_name || m.sender_employee_id}</a>`
            + ` <span class="who-role">${ROLE_TH[m.sender_role] || m.sender_role}</span>`;
        log.appendChild(el(`<div class="chat-msg ${mine ? 'mine' : 'theirs'}">
          <div class="who">${who}</div>
          ${m.message}
        </div>`));
      });
      log.querySelectorAll(".who-link").forEach(a=>{
        a.onclick = (e)=>{ e.preventDefault(); openPersonSheet(a.dataset.who, people); };
      });
      log.scrollTop = log.scrollHeight;
      if(newSystem) loadTask();
    }catch(e){ /* not a participant, or task removed */ }
  }
  async function send(){
    const input = overlay.querySelector("#chat-input");
    const message = input.value.trim();
    if(!message) return;
    try{
      await api(`/tasks/${taskId}/messages`, {method:"POST", body: JSON.stringify({message})});
      input.value = "";
      input.blur();
      await loadMessages();
    }catch(e){ toast(e.message); }
  }
  overlay.querySelector("#chat-send").onclick = send;
  overlay.querySelector("#chat-input").addEventListener("keydown", (e)=>{ if(e.key==="Enter") send(); });

  await loadPeople();
  await Promise.all([loadTask(), loadMessages()]);
  if(chatPollTimer) clearInterval(chatPollTimer);
  chatPollTimer = setInterval(loadMessages, 3000);
}

function renderTeamChat(main){
  main.appendChild(el(`<div class="section-title">แชททีม (Admin + คนขับ)</div>`));
  main.appendChild(el(`<div class="field-note" style="margin-bottom:10px;">ห้องนี้เห็นเฉพาะ Admin และคนขับ พิมพ์ @ เพื่อแท็กคนใดคนหนึ่ง</div>`));
  const wrap = el(`<div class="card" style="display:flex;flex-direction:column;">
    <div class="chat-log" id="team-chat-log" style="max-height:50vh;"></div>
    <div id="team-mention-box"></div>
    <div class="chat-input-row" style="margin-top:10px;">
      <input id="team-chat-input" placeholder="พิมพ์ข้อความ... พิมพ์ @ เพื่อแท็กคน" />
      <button class="btn amber" id="team-chat-send">ส่ง</button>
    </div>
  </div>`);
  main.appendChild(wrap);
  const log = wrap.querySelector("#team-chat-log");
  if(state.teamChatMessages.length === 0){
    log.appendChild(el(`<div class="empty">ยังไม่มีข้อความ เริ่มคุยกันได้เลย</div>`));
  }
  state.teamChatMessages.forEach(m=>{
    const mine = m.sender_employee_id === state.employee_id;
    const highlighted = m.message.replace(/@(\w+)/g, '<b style="color:var(--amber);">@$1</b>');
    log.appendChild(el(`<div class="chat-msg ${mine ? 'mine' : 'theirs'}">
      <div class="who">${mine ? 'คุณ' : (m.sender_name || m.sender_employee_id) + ' (' + m.sender_role + ')'}</div>
      ${highlighted}
    </div>`));
  });
  log.scrollTop = log.scrollHeight;

  const input = wrap.querySelector("#team-chat-input");
  const mentionBox = wrap.querySelector("#team-mention-box");
  input.addEventListener("input", ()=>{
    const val = input.value;
    const m = val.match(/@(\w*)$/);
    mentionBox.innerHTML = "";
    if(!m) return;
    const q = m[1].toLowerCase();
    const matches = state.teamChatParticipants.filter(p=>
      p.employee_id.toLowerCase().includes(q) || (p.full_name||"").toLowerCase().includes(q)
    ).slice(0, 5);
    if(matches.length === 0) return;
    const box = el(`<div class="suggest-box"></div>`);
    matches.forEach(p=>{
      const item = el(`<div class="suggest-item" style="cursor:pointer;"><span>${p.full_name||p.employee_id} <span class="field-note">(${p.employee_id})</span></span></div>`);
      item.onclick = ()=>{
        input.value = val.slice(0, m.index) + "@" + p.employee_id + " ";
        mentionBox.innerHTML = "";
        input.focus();
      };
      box.appendChild(item);
    });
    mentionBox.appendChild(box);
  });

  async function send(){
    const message = input.value.trim();
    if(!message) return;
    try{
      await api("/team-chat/messages", {method:"POST", body: JSON.stringify({message})});
      input.value = "";
      mentionBox.innerHTML = "";
      await refreshAll();
    }catch(e){ toast(e.message); }
  }
  wrap.querySelector("#team-chat-send").onclick = send;
  input.addEventListener("keydown", (e)=>{ if(e.key === "Enter"){ e.preventDefault(); send(); } });
}

// ---------------- Data refresh (simple polling = "real-time enough") ----------------
// Cheap non-cryptographic hash, just to tell "same payload" from "changed".
function _sig(s){
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return h + ":" + s.length;
}

// Even with identical data, repaint occasionally so elapsed-time labels
// ("รอมา 12 นาที", "ติดงานมา 30 นาที") don't freeze on screen.
const FORCE_RENDER_AFTER_MS = 120000;

let _refreshAbort = null;
async function refreshAll(opts={}){
  // One combined request instead of ~14 separate ones. The scope tells the
  // server exactly how much to send based on which tab is open (#4: don't
  // fetch admin operation data while sitting on the dashboard, etc.), and it
  // all comes back in a single round-trip (#2), so a refresh is one network
  // hit instead of fourteen.
  let scope = "core";
  if(state.role === "DRIVER") scope = "driver";
  else if(isOps()){
    // On their own work screen a dispatcher needs the driver payload (their
    // vehicle, their jobs), not the operations one.
    scope = (state.tab === "available" && isCrew()) ? "driver"
          : (state.tab === "dashboard") ? "admin_dash" : "admin_ops";
  }
  // Only one refresh in flight at a time. A manual tap, a push-triggered
  // refresh and the background timer can all fire close together; without
  // this, a slow earlier response could land after a newer one and overwrite
  // fresh data with stale data.
  if(_refreshAbort) _refreshAbort.abort();
  const ctrl = new AbortController();
  _refreshAbort = ctrl;
  try{
    const d = await api("/app-data?scope=" + scope, {background: !opts.visible, signal: ctrl.signal});
    // Merge returned keys into state (only overwrites what the scope included,
    // so data from another tab stays cached until you go back to it).
    Object.assign(state, d);
    state.consecutiveFailures = 0;
    state.lastUpdated = new Date();
    state._payloadSig = _sig(JSON.stringify(d));
    hideConnBanner();
  }catch(e){
    // Superseded by a newer refresh — not a failure, and the newer one owns
    // the outcome. Must not count towards the failure/backoff counter.
    if(e.name === "AbortError" || ctrl.signal.aborted) return;
    state.consecutiveFailures = (state.consecutiveFailures || 0) + 1;
    if(state.consecutiveFailures >= 2) showConnBanner();
    updateRefreshBar();
    // don't re-render on a failed poll — keep showing the last good data
    return;
  }finally{
    if(_refreshAbort === ctrl) _refreshAbort = null;
  }
  try{
    // Bug fix: skip re-rendering the tab body while the user is typing into a
    // form inside it, so a poll never blanks out unsaved input. Also skip it
    // for the Admin dashboard specifically — its KPI/chart cards load
    // asynchronously and rebuilding them every cycle caused a visible flicker
    // even though the underlying numbers rarely change that often. The
    // dashboard reloads when opened, when the period changes, or via its own
    // manual/pull-to-refresh.
    const onAdminDashboard = isOps() && state.tab === "dashboard";
    // Third condition, and the important one for how the app FEELS: if the
    // payload is byte-identical to the last one we rendered, there is nothing
    // to repaint. Most polls return unchanged data, and rebuilding the whole
    // tab body anyway was both the jank and the cause of the extra requests —
    // several tab renderers fetch their own data as part of rendering, so a
    // pointless repaint also meant a pointless round-trip with the loading bar
    // switched on. A manual refresh always repaints; so does a screen that has
    // gone stale enough for its elapsed-time labels to be wrong.
    const unchanged = state._payloadSig && state._payloadSig === state._renderedSig;
    const stale = !state._lastRenderAt || (Date.now() - state._lastRenderAt) > FORCE_RENDER_AFTER_MS;
    if(!userIsTypingInMain() && !onAdminDashboard && (opts.visible || !unchanged || stale)){
      renderContent();
      state._renderedSig = state._payloadSig;
      state._lastRenderAt = Date.now();
    }
    const bell = document.getElementById("bell");
    if(bell){
      const unread = state.notifications.filter(n=>!n.is_read).length;
      bell.innerHTML = `🔔${unread ? '<span class="bell-dot"></span>' : ''}`;
    }
    updateHeaderFromState();
    updateRefreshBar();
  }catch(e){ /* render error shouldn't break the poll loop */ }
}

function updateHeaderFromState(){
  // Keeps the header's name/role/status/vehicle text in sync with state.me
  // without a full page reload — patched here (not rebuilt via renderShell,
  // which only ever runs once at bootstrap) so it reflects both the 3s poll
  // and an immediate profile save.
  const brandB = document.querySelector("#brand-btn b");
  if(brandB && state.me){
    brandB.textContent = state.me.full_name || state.employee_id;
  }
  if(state.role !== "DRIVER") return;
  const btn = document.getElementById("hdr-status-btn");
  if(btn){
    const st = state.me && state.me.driver_status;
    btn.textContent = DRIVER_STATUS_LABEL[st] || "-";
    btn.className = "driver-status-pill " + (st === "Available" ? "on" : st === "Breakdown" ? "bad" : st === "Busy" ? "busy" : "off");
  }
  const brandSmall = document.querySelector("#brand-btn small");
  if(brandSmall){
    const meVehicle = (state.vehicles || []).find(v=> v.id === (state.me && state.me.checked_in_vehicle_id));
    brandSmall.textContent = ["DRIVER", meVehicle ? meVehicle.code : null].filter(Boolean).join(" · ");
  }
}

let pollTimer = null;
async function bootstrap(){
  try{
    state.me = await api("/me");
  }catch(e){ logout(); return; }
  // /me is the source of truth for role/employee_id — trust it over the
  // localStorage copy, which can be stale, missing, or the literal string
  // "null" (e.g. saved before login completed, or cleared out of sync). If
  // we skip this, state.role can stay null even though the account loaded
  // fine, and then tabsDef[state.role] is undefined → the tab bar crashes
  // and the whole page renders blank with a "null" role pill.
  if(state.me && state.me.role){
    state.role = state.me.role;
    state.employee_id = state.me.employee_id;
    localStorage.setItem("scdc_role", state.me.role);
    localStorage.setItem("scdc_emp", state.me.employee_id);
  }
  if(!state.role){
    // No usable role even after /me — the session is broken; send them back
    // to a clean login rather than a dead blank screen.
    logout();
    return;
  }
  // Boarding a vehicle is no longer a gate at login. A driver can open the
  // app, look at the board and take a job; the vehicle is chosen at the
  // moment they actually need one, which is when they pick up work.
  //
  // For a driver who has a usual vehicle, that moment is now too: put them
  // back in it before the first render, so the common case is zero taps and
  // the screen never flashes "ยังไม่ได้เลือกรถ" on the way to the right
  // answer. Deliberately before refreshAll, never on a background poll.
  if(isCrew()) await autoBoardDefaultVehicle();
  renderShell();
  await refreshAll();
  startPolling();
  // Re-register this device for whoever just signed in, THEN decide whether a
  // banner is needed — in that order, so the banner never appears for a device
  // that the silent path just fixed.
  ensurePushRegistration().then(maybeAutoPromptNotifications); // never blocks app usage
}

// Put the driver back in their usual vehicle when they open the app. Silent
// when nothing happens — a driver with no usual vehicle, or one already in a
// vehicle, should see no sign this ran at all.
async function autoBoardDefaultVehicle(){
  try{
    const r = await api("/vehicles/auto-board", {method:"POST", background:true});
    if(!r || !r.boarded) return;
    state.me = await api("/me", {background:true});
    toast(r.taken_from
      ? `ขึ้นรถประจำ ${r.boarded} แล้ว (รับต่อจาก ${r.taken_from})`
      : `ขึ้นรถประจำ ${r.boarded} แล้ว`);
  }catch(e){
    // Not being able to auto-board is not a failure worth a message: the
    // driver picks a vehicle the usual way, exactly as before.
  }
}

// Refresh strategy.
//
// Push is the primary signal now: the service worker forwards every push to
// the open page, which refreshes immediately, so new work still lands within
// seconds of being created. The timer below is a SAFETY NET, not the main
// mechanism — it exists because Web Push is not guaranteed (iOS only delivers
// to a home-screen-installed PWA, Android battery saver can delay or drop
// messages, and a driver may simply have declined the permission). Going
// push-only would mean a missed push is a missed job, which is not an
// acceptable trade for a dispatch system.
//
// Net effect vs the old fixed 5s poll: roughly 6x fewer requests while the
// app is open, and zero while it is in the background.
const POLL_INTERVAL_MS = 30000;
// On repeated failure, back off instead of hammering a struggling server.
const POLL_BACKOFF_MS = [30000, 60000, 120000];

function nextPollDelay(){
  const fails = state.consecutiveFailures || 0;
  if(!fails) return POLL_INTERVAL_MS;
  return POLL_BACKOFF_MS[Math.min(fails - 1, POLL_BACKOFF_MS.length - 1)];
}

// Self-scheduling poll instead of setInterval: each cycle only schedules the
// next one AFTER it finishes, so slow cycles (serverless latency) never pile
// up on top of each other the way a fixed interval would.
function startPolling(){
  stopPolling();
  const tick = async ()=>{
    if(!state.token) return;
    // Never poll a backgrounded tab. A driver leaves this app open all shift;
    // polling behind a locked screen burns their battery and our quota for a
    // screen nobody is looking at. visibilitychange re-syncs on return.
    if(!document.hidden) await refreshAll();
    if(state.token) pollTimer = setTimeout(tick, nextPollDelay());
  };
  pollTimer = setTimeout(tick, nextPollDelay());
}
function stopPolling(){
  if(pollTimer){ clearTimeout(pollTimer); pollTimer = null; }
}

// Keep the "อัปเดต N นาทีที่แล้ว" label honest between refreshes. This is a
// local clock tick only — it never touches the network.
setInterval(updateRefreshBar, 10000);

// Coming back to the app is the moment stale data is most likely and most
// visible, so always re-sync straight away rather than waiting for the timer.
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) return;
  if(state.token){ refreshAll(); startPolling(); }
});
window.addEventListener("online", ()=>{
  if(state.token){ refreshAll(); startPolling(); }
});

// A push means something actually changed — refresh immediately instead of
// waiting up to 30s for the next tick. This is what lets the poll interval be
// as long as it is.
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", (e)=>{
    if(e.data && e.data.type === "scdc-refresh" && state.token) refreshAll();
  });
}

function render(){
  stopPolling();
  if(state.token){ bootstrap(); } else { renderLogin(); }
}

// Arriving by QR lands on /install, which shows the add-to-home-screen steps
// first. Checked before render() so a scan never flashes the login screen on
// the way — and it is only the entry point: the button there goes on to the
// normal flow, signed in or not.
if(location.pathname === "/install" && !isStandalone()){
  renderInstallScreen();
} else {
  if(location.pathname === "/install"){
    // Already installed: nothing to teach, so go straight in.
    try{ history.replaceState(null, "", "/"); }catch(e){}
  }
  render();
}
