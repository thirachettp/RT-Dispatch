// Each bar is one hour (today) or one day (this week / month) of jobs, stacked
// by where those jobs stand NOW — so the part of a bar that is not green is
// exactly what is still outstanding from that slot. Replaces the plain
// "ค้างงาน" number, which said how much was outstanding but never when it
// came in or whether it was piling up.
// 1, 2, 5, 10, 20, 50 ... — the familiar axis steps, so the top of the chart
// is always a number someone can read a bar against.
function niceMax(v){
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(1, v))));
  const r = v / mag;
  return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * mag;
}

const VOLUME_COLORS = {
  waiting: "var(--warn)", active: "var(--amber)", done: "var(--green)", cancelled: "#a3b1c2",
};

function renderVolumeChart(card, data){
  if(!state.volumeMetric) state.volumeMetric = "jobs";
  const metric = state.volumeMetric;
  const unit = metric === "jobs" ? "งาน" : "พาเลท";
  const keys = data.groups.map(g=> g.key);

  const toggle = el(`<div class="chip-row" style="margin-bottom:10px;">
    <button class="chip ${metric === "jobs" ? "active" : ""}" data-metric="jobs">จำนวนงาน</button>
    <button class="chip ${metric === "pallets" ? "active" : ""}" data-metric="pallets">จำนวนพาเลท</button>
  </div>`);
  toggle.querySelectorAll("[data-metric]").forEach(b=> b.onclick = ()=>{
    state.volumeMetric = b.dataset.metric;
    card.innerHTML = "";
    renderVolumeChart(card, data);
  });
  card.appendChild(toggle);

  const totals = data.totals[metric];
  const grand = keys.reduce((n,k)=> n + (totals[k]||0), 0);
  const outstanding = (totals.waiting||0) + (totals.active||0);
  card.appendChild(el(`<div class="field-note" style="margin-bottom:10px;">
    เปิดงานรวม <b>${grand}</b> ${unit} · ยังไม่เสร็จ <b style="color:var(--warn);">${outstanding}</b> ${unit}
  </div>`));

  if(!grand){
    card.appendChild(el(`<div class="empty">ยังไม่มีงานในช่วงนี้</div>`));
    return;
  }

  const n = data.buckets.length;
  const W = 340, H = 150, padT = 14, padB = 20, padL = 22, padR = 2;
  const plotH = H - padT - padB, plotW = W - padL - padR;
  const gap = n > 20 ? 1.5 : 4;
  const barW = Math.max(3, (plotW - gap * (n - 1)) / n);
  const max = Math.max(1, ...data.buckets.map(b=> keys.reduce((t,k)=> t + (b[metric][k]||0), 0)));
  // A round number at or above the tallest bar, so the axis reads as a scale
  // rather than as "whatever the biggest bar happened to be".
  const top = niceMax(max);
  const ticks = top % 2 === 0 ? [0, top/2, top] : [0, top];
  // Label every bar when there is room, otherwise every 3rd (hours) or 5th (days).
  const every = n <= 8 ? 1 : (n <= 24 ? 3 : 5);

  let svg = "";
  ticks.forEach(v=>{
    const y = padT + plotH - (v / top) * plotH;
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"></line>`;
    svg += `<text x="${padL-4}" y="${y+3}" font-size="8" fill="var(--ink-dim)" text-anchor="end">${v}</text>`;
  });
  data.buckets.forEach((b, i)=>{
    const x = padL + i * (barW + gap);
    let y = padT + plotH;
    keys.forEach(k=>{
      const v = b[metric][k] || 0;
      if(v <= 0) return;
      const h = (v / top) * plotH;
      y -= h;
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${VOLUME_COLORS[k]}"><title>${b.label} · ${TH_GROUP[k]} ${v} ${unit}</title></rect>`;
    });
    if(i % every === 0){
      svg += `<text x="${(x + barW/2).toFixed(1)}" y="${H-6}" font-size="8" fill="var(--ink-dim)" text-anchor="middle">${b.label}</text>`;
    }
  });
  const axisNote = data.period === "today" ? "เวลาที่เปิดงาน (นาฬิกา)" : "วันที่เปิดงาน";
  card.appendChild(el(`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" role="img"
    aria-label="ปริมาณงานแยกตาม${axisNote}">${svg}</svg>`));
  card.appendChild(el(`<div class="field-note" style="text-align:center;margin-top:2px;">${axisNote}</div>`));
  card.appendChild(el(`<div class="chip-row volume-legend" style="margin-top:10px;">
    ${data.groups.map(g=>`<span class="chip" style="cursor:default;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${VOLUME_COLORS[g.key]};margin-right:5px;"></span>${g.label} ${totals[g.key]||0}</span>`).join("")}
  </div>`));
}

// Advance booking ("จองล่วงหน้า") is switched off, not deleted. The picker
// and the appointment field are hidden and every new job is an immediate
// request — but a job booked BEFORE this still shows its appointment time
// everywhere it used to, and can still have that time corrected. Turning it
// back on is this one line and its twin in main.py.
const BOOKING_ENABLED = false;

const TH_GROUP = {waiting:"รอดำเนินการ", active:"กำลังดำเนินการ", done:"เสร็จสิ้น", cancelled:"ยกเลิก"};
function bindCardClickToDetail(container){
  container.querySelectorAll(".card[data-id]").forEach(card=>{
    card.style.cursor = "pointer";
    card.addEventListener("click", (e)=>{
      if(e.target.closest("button")) return;
      // Tapping a job opens its conversation, with every detail of the job at
      // the top — the chat is where status changes are announced, so it is
      // the one place that tells the whole story.
      openChatSheet(card.dataset.id);
    });
  });
  loadAuthenticatedImages(container);
}

// Task photos are served from an authenticated endpoint now (not a public
// static file), which a plain <img src="..."> can't attach a Bearer token
// to. This fetches each photo with the right header and swaps in a blob URL
// once it arrives, so the auth requirement doesn't just silently break every
// photo thumbnail.
async function loadAuthenticatedImages(container){
  const imgs = container.querySelectorAll("img[data-photo-url]");
  for(const img of imgs){
    const url = img.dataset.photoUrl;
    delete img.dataset.photoUrl; // avoid re-fetching if this runs again on the same container
    try{
      const res = await fetch(API + url, {headers: {Authorization: "Bearer " + state.token}});
      if(!res.ok) continue;
      const blob = await res.blob();
      img.src = URL.createObjectURL(blob);
    }catch(e){ /* leave it blank rather than break the rest of the page */ }
  }
}

// Operation = "What is happening now?" — live jobs, people, vehicles, exceptions.
function renderAdminOperation(main){
  // Dispatching is the admin's main daily loop, so it is the landing subtab.
  // "dispatch" was folded into "jobs". Anyone whose last-visited subtab was
  // saved as "dispatch" (or anything else no longer offered) would otherwise
  // land on a blank page, because no branch below matches it.
  const OPS_SUBTABS = ["jobs", "people", "vehicles", "breakdowns", "broadcast", "teamchat"];
  if(!OPS_SUBTABS.includes(state.subtab)) setTab(state.tab, "jobs");
  const subtabs = el(`<div class="subtabs">
    <button data-s="jobs">งาน</button>
    <button data-s="people">พนักงาน</button>
    <button data-s="vehicles">รถ</button>
    <button data-s="breakdowns">ปัญหา</button>
    <button data-s="broadcast">ประกาศ</button>
    <button data-s="teamchat">แชททีม</button>
  </div>`);
  subtabs.querySelectorAll("button").forEach(b=>{
    b.classList.toggle("active", b.dataset.s === state.subtab);
    b.onclick = ()=>{ setTab(state.tab, b.dataset.s); renderContent(); };
  });
  main.appendChild(subtabs);

  if(state.subtab === "jobs") renderOperationJobs(main);
  else if(state.subtab === "people") renderOperationPeople(main);
  else if(state.subtab === "vehicles") renderOperationVehicles(main);
  else if(state.subtab === "breakdowns") renderOperationBreakdowns(main);
  else if(state.subtab === "broadcast") renderOperationBroadcast(main);
  else if(state.subtab === "teamchat") renderTeamChat(main);
}

// ===================== Dispatch board =====================
// Built around two facts from real use: the admin hands out nearly every job
// by hand, and the two things that cost time were (a) the number of steps per
// assignment and (b) not being able to see who is free.
//
// Deliberately does NOT rank or recommend anyone. Drivers who physically
// cannot do the job (licence / zone / no vehicle) are filtered out; among
// those who can, the admin chooses. That was an explicit product decision —
// the system's job here is to remove impossible options, not to pick.

function minsSince(iso){
  if(!iso) return null;
  return Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
}

function waitBadge(mins){
  const cls = mins >= 30 ? "bad" : mins >= 15 ? "warn" : "ok";
  const txt = mins >= 60 ? `${Math.floor(mins/60)} ชม. ${mins%60} น.` : `${mins} นาที`;
  return `<span class="badge ${cls}">รอมา ${txt}</span>`;
}

async function renderDispatchBoard(main){
  main.appendChild(el(`<div class="section-title">คนขับตอนนี้</div>`));
  const driverPanel = el(`<div class="card" id="dp-drivers"><div class="empty">กำลังโหลด...</div></div>`);
  main.appendChild(driverPanel);

  const queueTitle = el(`<div class="section-title" id="dp-queue-title">คิวงานที่รอมอบหมาย</div>`);
  main.appendChild(queueTitle);
  const queueBox = el(`<div id="dp-queue"><div class="empty">กำลังโหลด...</div></div>`);
  main.appendChild(queueBox);

  // Paint the previous board first: renderContent() re-runs this on every
  // refresh cycle, and blanking to a loading state each time made the screen
  // flash and pushed the queue around under the admin's finger.
  const cached = state.dispatchBoard;
  if(cached) paintDispatch(cached, driverPanel, queueBox, queueTitle);

  let board;
  try{
    board = await api("/dispatch/board", {background: !!cached});
  }catch(e){
    if(!cached){
      driverPanel.innerHTML = "";
      driverPanel.appendChild(el(`<div class="empty">โหลดข้อมูลไม่สำเร็จ: ${e.message || ""}</div>`));
      queueBox.innerHTML = "";
    }
    return;   // keep showing the last good board
  }
  state.dispatchBoard = board;
  paintDispatch(board, driverPanel, queueBox, queueTitle);
}

function paintDispatch(board, driverPanel, queueBox, queueTitle){
  const byEmp = {};
  board.drivers.forEach(d=> byEmp[d.employee_id] = d);

  // ---- who is free, and when do the rest free up ----
  const free = board.drivers.filter(d=> d.driver_status === "Available" && d.vehicle_code);
  const busy = board.drivers.filter(d=> d.driver_status === "Busy");
  const out  = board.drivers.filter(d=> !free.includes(d) && !busy.includes(d));
  driverPanel.innerHTML = "";
  driverPanel.appendChild(el(`<div class="stat-grid" style="margin-bottom:12px;">
    <div class="stat"><div class="n">${free.length}</div><div class="l">ว่าง</div></div>
    <div class="stat"><div class="n">${busy.length}</div><div class="l">ติดงาน</div></div>
    <div class="stat"><div class="n">${out.length}</div><div class="l">ยังไม่พร้อม</div></div>
  </div>`));
  if(free.length){
    driverPanel.appendChild(el(`<div class="field-note" style="margin-bottom:6px;">ว่างพร้อมรับงาน</div>`));
    driverPanel.appendChild(el(`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
      ${free.map(d=>`<span class="badge ok">${d.full_name || d.employee_id} · ${d.vehicle_code}</span>`).join("")}
    </div>`));
  }
  if(busy.length){
    // The missing half of the answer: a status badge said "Busy" but never
    // said for how long or on what, so there was no way to judge who would
    // free up next.
    driverPanel.appendChild(el(`<div class="field-note" style="margin-bottom:6px;">ติดงานอยู่</div>`));
    driverPanel.appendChild(el(`<div style="font-size:12px;line-height:1.8;margin-bottom:12px;">
      ${busy.map(d=>{
        const m = minsSince(d.busy_since);
        const eta = d.estimated_arrival ? ` · คาดเสร็จ ${fmtClock(new Date(d.estimated_arrival))}` : "";
        return `<div style="display:flex;justify-content:space-between;gap:10px;">
          <span>${d.full_name || d.employee_id}${d.vehicle_code ? " · " + d.vehicle_code : ""}</span>
          <span style="color:var(--ink-dim);">${d.current_task_code || "-"}${m !== null ? " · " + m + " นาที" : ""}${eta}</span>
        </div>`;
      }).join("")}
    </div>`));
  }
  if(out.length){
    driverPanel.appendChild(el(`<div class="field-note">ยังไม่พร้อม: ${out.map(d=>
      `${d.full_name || d.employee_id} (${d.vehicle_code ? (DRIVER_STATUS_LABEL[d.driver_status]||d.driver_status) : "ยังไม่เช็คอินรถ"})`
    ).join(", ")}</div>`));
  }

  // ---- the queue ----
  queueTitle.textContent = `คิวงานที่รอมอบหมาย (${board.queue.length})`;
  queueBox.innerHTML = "";
  if(!board.queue.length){
    queueBox.appendChild(el(`<div class="empty">ไม่มีงานที่รอมอบหมาย</div>`));
    return;
  }

  board.queue.forEach(entry=>{
    const t = entry.task;
    const mins = minsSince(t.created_at);
    const eligible = entry.eligible.map(e=> byEmp[e]).filter(Boolean);
    const card = el(`<div class="card" data-dp-task="${t.id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div>
          <div style="font-weight:800;">${t.task_code}</div>
          <div style="font-size:12px;color:var(--ink-dim);margin-top:2px;">
            ${t.from_location} → ${t.to_location} · ${t.pallet_qty} พาเลท
          </div>
          <div style="font-size:12px;color:var(--ink-dim);">ผู้ขอ: ${t.requester_name || t.requester_employee_id || "-"}</div>
        </div>
        <div style="text-align:right;flex:none;">
          ${waitBadge(mins)}
        </div>
      </div>
      <div class="dp-pickers" style="margin-top:10px;"></div>
    </div>`);
    const pickers = card.querySelector(".dp-pickers");

    if(!eligible.length){
      // Say exactly why nobody can take it — otherwise an empty row looks
      // like a bug and the admin has no idea what to fix.
      const reasons = {};
      Object.values(entry.blocked).flat().forEach(r=> reasons[r] = (reasons[r]||0) + 1);
      const top = Object.entries(reasons).sort((a,b)=> b[1]-a[1]).slice(0,3)
        .map(([r,n])=> `${r} (${n} คน)`).join(" · ");
      pickers.appendChild(el(`<div class="field-note" style="color:var(--warn);">
        ยังไม่มีคนขับที่ทำงานนี้ได้ — ${top || "ไม่มีคนขับพร้อมใช้งาน"}
      </div>`));
      const anyway = el(`<button class="btn" style="width:100%;margin-top:8px;">เลือกเองทั้งที่ไม่ตรงเงื่อนไข</button>`);
      anyway.onclick = ()=> openAssignSheet(t.id, false);
      pickers.appendChild(anyway);
      queueBox.appendChild(card);
      return;
    }

    pickers.appendChild(el(`<div class="field-note" style="margin-bottom:6px;">
      มอบหมายให้ (${eligible.length} คนที่ทำงานนี้ได้)</div>`));
    const row = el(`<div style="display:flex;flex-wrap:wrap;gap:6px;"></div>`);
    eligible.forEach(d=>{
      // One tap = assigned. The old path was: open sheet, scroll past ETA and
      // reason fields, search, tap select, tap confirm, sheet closes.
      const b = el(`<button class="btn amber" style="flex:1 1 auto;min-width:46%;">
        ${d.full_name || d.employee_id}<br><span style="font-size:11px;opacity:.8;">${d.vehicle_code} · ${d.vehicle_type}</span>
      </button>`);
      b.onclick = ()=> dispatchAssign(t, d, b, card);
      row.appendChild(b);
    });
    pickers.appendChild(row);

    const more = el(`<button class="btn" style="width:100%;margin-top:8px;">ตัวเลือกเพิ่มเติม (ETA / เหตุผล / คนอื่น)</button>`);
    more.onclick = ()=> openAssignSheet(t.id, false);
    pickers.appendChild(more);
    queueBox.appendChild(card);
  });
}

async function dispatchAssign(task, driver, btn, card){
  const lock = `dispatch:${task.id}`;
  if(_inFlightActions.has(lock)) return;
  _inFlightActions.add(lock);
  card.querySelectorAll("button").forEach(b=> b.disabled = true);
  btn.textContent = "กำลังมอบหมาย...";
  try{
    await api(`/tasks/${task.id}/assign`, {method:"POST",
      body: JSON.stringify({driver_employee_id: driver.employee_id, force: false})});
    toast(`มอบหมาย ${task.task_code} ให้ ${driver.full_name || driver.employee_id} แล้ว`);
    // Stay on the board and keep going — the card for this job disappears and
    // the next one moves up, so a run of assignments never leaves this screen.
    card.remove();
    await refreshDispatchBoard();
  }catch(e){
    card.querySelectorAll("button").forEach(b=> b.disabled = false);
    btn.innerHTML = `${driver.full_name || driver.employee_id}<br><span style="font-size:11px;opacity:.8;">${driver.vehicle_code} · ${driver.vehicle_type}</span>`;
    toast(e.message || "มอบหมายไม่สำเร็จ");
    // Someone else almost certainly changed something — reload the board so
    // the admin isn't choosing from a stale picture.
    await refreshDispatchBoard();
  }finally{
    _inFlightActions.delete(lock);
  }
}

async function refreshDispatchBoard(){
  if(state.tab !== "operation" || state.subtab !== "dispatch") return;
  const panel = document.getElementById("dp-drivers");
  const box = document.getElementById("dp-queue");
  const title = document.getElementById("dp-queue-title");
  if(!panel || !box || !title) return;
  try{
    const board = await api("/dispatch/board", {background:true});
    state.dispatchBoard = board;
    paintDispatch(board, panel, box, title);
  }catch(e){ /* keep the last good board on screen */ }
}

// Default view: everything still in play. Finished and cancelled work is one
// tap away under "ทั้งหมด" but doesn't crowd the working list.
const OPS_DEFAULT_FILTER = {status: "active", overdue: false, q: ""};

// Task codes are compared letters-and-digits only, so "tk260922005",
// "260922-005" and "005" all find TK260922-005.
function normCode(s){ return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

function isOverdue(t, now){
  if(t.status === "Waiting") return (now - new Date(t.created_at).getTime()) > 15*60*1000;
  if(t.status === "In Progress") return t.started_at && (now - new Date(t.started_at).getTime()) > 60*60*1000;
  return false;
}

function renderOperationJobs(main){
  if(!state.opsJobFilter || state.opsJobFilter.status === "") {
    // "" was the old "show everything" default; the working list is now the default.
    state.opsJobFilter = {...OPS_DEFAULT_FILTER};
  }
  if(state.opsJobFilter.q === undefined) state.opsJobFilter.q = "";
  const f = state.opsJobFilter;

  // Who is free, and who frees up when — the first thing needed before
  // handing out work, so it sits above the queue.
  renderDriversNowPanel(main);

  const now = Date.now();
  const activeTasks = state.tasks.filter(t=> !["Completed","Cancelled"].includes(t.status));
  const waiting = state.tasks.filter(t=> t.status === "Waiting").length;
  main.appendChild(el(`<div class="stat-grid" style="margin-bottom:14px;">
    <div class="stat"><div class="n">${waiting}</div><div class="l">รอดำเนินการ</div></div>
    <div class="stat"><div class="n">${activeTasks.length - waiting}</div><div class="l">กำลังดำเนินการ</div></div>
    <div class="stat"><div class="n">${activeTasks.filter(t=> isOverdue(t, now)).length}</div><div class="l">ค้างนาน (Overdue)</div></div>
  </div>`));

  const filterBar = el(`<div class="card">
    <label>ค้นหาเลขงาน</label>
    <input id="oj-q" placeholder="เช่น TK260922-005 หรือแค่ 005" autocomplete="off" />
    <div style="margin-top:8px;">
      <div><label>สถานะ</label><select id="oj-status">
        <option value="active">ยังไม่เสร็จ (ไม่รวมเสร็จสิ้น/ยกเลิก)</option>
        <option value="all">ทั้งหมด</option>
        <option value="Waiting">รอดำเนินการ</option>
        <option value="Assigned">มอบหมายแล้ว</option>
        <option value="In Progress">กำลังทำ</option>
        <option value="Pause">ขัดข้อง</option>
        <option value="Completed">เสร็จสิ้น</option>
        <option value="Cancelled">ยกเลิก</option>
      </select></div>
      <label style="display:flex;align-items:center;gap:8px;padding:10px 0 0;">
        <input type="checkbox" id="oj-overdue" style="width:auto;" /> เฉพาะงานค้าง (Overdue)
      </label>
    </div>
  </div>`);
  main.appendChild(filterBar);
  const qInput = filterBar.querySelector("#oj-q");
  const statusSel = filterBar.querySelector("#oj-status");
  const overdueCb = filterBar.querySelector("#oj-overdue");
  qInput.value = f.q;
  statusSel.value = f.status;
  overdueCb.checked = f.overdue;

  // Everything below here is redrawn on each filter change. The filter bar
  // above is NOT, so typing in the search box never loses focus.
  const listBox = el(`<div id="oj-list"></div>`);
  main.appendChild(listBox);

  function statusMatch(t){
    if(f.status === "all") return true;
    if(f.status === "active") return !["Completed","Cancelled"].includes(t.status);
    return t.status === f.status;
  }
  function codeMatch(t){
    const q = normCode(f.q);
    return !q || normCode(t.task_code).includes(q);
  }

  function drawList(){
    listBox.innerHTML = "";
    const n = Date.now();
    let tasks = state.tasks.filter(t=> statusMatch(t) && codeMatch(t) && (!f.overdue || isOverdue(t, n)));
    // Oldest first: work should be handed out front-to-back, so the job that
    // has waited longest is the one at the top.
    tasks.sort((a,b)=> String(a.created_at||"").localeCompare(String(b.created_at||"")));
    listBox.appendChild(el(`<div class="section-title">งาน (${tasks.length}) · เก่าสุดก่อน</div>`));

    if(tasks.length === 0){
      // A task number that exists but sits outside the current status filter
      // should never look like "not found" — offer to show it.
      const elsewhere = f.q ? state.tasks.filter(t=> codeMatch(t) && !statusMatch(t)) : [];
      if(elsewhere.length){
        const hint = el(`<div class="empty">ไม่พบในตัวกรองนี้ แต่พบ ${elsewhere.length} งานในสถานะอื่น
          (${elsewhere.slice(0,3).map(t=> `${t.task_code} · ${STATUS_LABEL[t.status] || t.status}`).join(", ")})
          <br><button class="btn" style="margin-top:8px;">แสดงทุกสถานะ</button></div>`);
        hint.querySelector("button").onclick = ()=>{ f.status = "all"; statusSel.value = "all"; drawList(); };
        listBox.appendChild(hint);
      } else if(f.q){
        // Finished work older than the loaded window isn't on this screen —
        // say so, rather than implying the task doesn't exist.
        listBox.appendChild(el(`<div class="empty">ไม่พบเลขงาน "${f.q}" ในงานที่แสดงอยู่
          <div class="field-note" style="margin-top:4px;">งานที่เสร็จหรือยกเลิกไปนานกว่า 14 วันจะไม่แสดงในหน้านี้</div></div>`));
      } else {
        listBox.appendChild(el(`<div class="empty">ไม่พบงานตามตัวกรอง</div>`));
      }
      return;
    }

    tasks.forEach(t=>{
      let actions = `<button class="btn" data-chat="${t.id}">💬 แชท</button>`;
      if(t.status === "Waiting"){
        actions = `<button class="btn amber" data-assign="${t.id}">มอบหมายงาน</button>
          <button class="btn" data-sendback="${t.id}">ตีกลับ</button>${actions}`;
      } else if(["Assigned","In Progress","Pause"].includes(t.status)){
        actions = `<button class="btn blue" data-reassign="${t.id}">แก้ไขการมอบหมาย</button>
${actions}
          ${t.status !== "Assigned" ? `<button class="btn green" data-admin-complete="${t.id}">ทำเครื่องหมายเสร็จ</button>` : ""}
          <button class="btn red" data-action="cancel">ยกเลิก</button>`;
      }
      listBox.appendChild(el(taskCard(t, actions, {showRequester:true})));
    });
    listBox.querySelectorAll("[data-assign]").forEach(b=> b.onclick = ()=> openAssignSheet(b.dataset.assign, false));
    listBox.querySelectorAll("[data-reassign]").forEach(b=> b.onclick = ()=> openAssignSheet(b.dataset.reassign, true));
    listBox.querySelectorAll("[data-admin-complete]").forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm("ยืนยันทำเครื่องหมายว่างานนี้เสร็จแล้ว? ใช้สำหรับงานที่ค้างผิดปกติเท่านั้น")) return;
        try{ await api(`/tasks/${b.dataset.adminComplete}/admin-complete`, {method:"POST"}); toast("ทำเครื่องหมายเสร็จแล้ว"); await refreshAll(); }
        catch(e){ toast(e.message); }
      };
    });
    listBox.querySelectorAll("[data-sendback]").forEach(b=> b.onclick = ()=> openSendBackSheet(b.dataset.sendback));
    bindCardActions(listBox);
    bindCardClickToDetail(listBox);
  }

  qInput.addEventListener("input", ()=>{ f.q = qInput.value; drawList(); });
  statusSel.onchange = ()=>{ f.status = statusSel.value; drawList(); };
  overdueCb.onchange = ()=>{ f.overdue = overdueCb.checked; drawList(); };
  drawList();
}

function openSendBackSheet(taskId){
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>ตีกลับงานให้ผู้ขอ</h2><button class="sheet-close">✕</button></div>

// One sheet for handing work out and for changing who is on it.
//
// "มอบหมายใหม่" and "+ เพิ่มคนขับ" used to be separate buttons leading to
// separate screens that did nearly the same thing, and neither showed who was
// already on the job. Here the current crew is ticked when the sheet opens:
// ticking adds someone, unticking takes them off, and the sheet states the
// change in words before anything is sent.
async function openAssignSheet(taskId, isReassign){
  const t = findTask(taskId) || {};
  const snap = driverSnapshot();

  // Current crew, by the role they were assigned as.
  const before = new Map();
  (t.drivers || []).forEach(d=>{ if(d.vehicle_type) before.set(key(d.employee_id, d.vehicle_type), d); });
  function key(emp, type){ return emp + "|" + type; }

  // A driver appears under every type they can actually work: the vehicle
  // they are in if they have one, otherwise each licence they hold — since a
  // driver can now be assigned before boarding, and the job still has to know
  // whether it is waiting on an RT or a PE.
  const rows = [];
  snap.forEach(d=>{
    // Every type they are licensed for, not just the one they happen to be
    // sitting in. A job no longer demands a particular type — the grouping is
    // the dispatcher's way of organising the work — so restricting the list to
    // the current vehicle hid choices the server would have accepted. The row
    // says when a vehicle change would be needed, instead of leaving the
    // person out.
    d.licenses.forEach(type=>{
      const issues = [];
      const mustSwap = d.vehicleType && d.vehicleType !== type;
      if(mustSwap) issues.push(`ตอนนี้อยู่บนรถ ${d.vehicleType} ${d.vehicleCode} — ต้องเปลี่ยนรถก่อน`);
      if(d.status === "Busy" && d.task && String(d.task.id) !== String(taskId)){
        issues.push(`ติดงาน ${d.task.task_code} (${fmtDuration(d.busyMins)})`);
      } else if(!["Available","Not Checked-in","Assigned","Busy"].includes(d.status)){
        issues.push(DRIVER_STATUS_LABEL[d.status] || d.status);
      }
      if(d.queueLen) issues.push(`มี ${d.queueLen} งานในคิวแล้ว`);
      rows.push({
        emp: d.emp, name: d.name, type,
        veh: mustSwap ? null : d.vehicleCode, hasVehicle: !mustSwap && !!d.vehicleCode,
        issues, k: key(d.emp, type),
        // Whose area this job is in. A suggestion, never a restriction — the
        // dispatcher can still pick anybody on the list.
        zone: zoneMatchOf(t, d.zones),
      });
    });
  });

  // Someone who is on the job but no longer in the driver list (role changed,
  // account removed) still has to appear: otherwise the sheet quietly keeps a
  // crew member the admin can neither see nor take off.
  before.forEach((d, k)=>{
    if(rows.some(r=> r.k === k)) return;
    const [emp, type] = k.split("|");
    rows.push({
      emp, type, name: d.full_name || d.employee_id || emp,
      veh: d.vehicle_code, hasVehicle: !!d.vehicle_code,
      issues: ["ไม่อยู่ในรายชื่อคนขับแล้ว"], k,
    });
  });

  const now = new Set([...before.keys()]);
  const nameOf = (k)=> (rows.find(r=> r.k === k) || {}).name
    || (before.get(k) && (before.get(k).full_name || before.get(k).employee_id)) || k.split("|")[0];

  // One group per vehicle type in the fleet. With more than a couple of
  // types this sheet would otherwise be a long scroll of mostly-empty groups,
  // so groups with nobody available are folded shut and the ones the
  // dispatcher is working in come first.
  const GROUPS = allVehicleTypes(rows.map(r=> r.type)).map(k=> ({key: k, title: typeLabel(k)}));
  // Already on the job, then whose zone this is, then who is free, then name.
  // Zone sits above readiness on purpose: someone standing in the right aisle
  // with one job queued usually beats someone idle at the far end of the shed.
  const byReadiness = (a,b)=> (before.has(b.k) - before.has(a.k))
    || ((a.zone ? a.zone.rank : 9) - (b.zone ? b.zone.rank : 9))
    || (a.issues.length - b.issues.length) || a.name.localeCompare(b.name, "th");

  const waitMins = minutesAgo(t.created_at);
  const detail = (label, value)=> value ? `<div class="as-d"><span>${label}</span><b>${value}</b></div>` : "";
  const rowHTML = (r)=> `
    <label class="driver-pick ${now.has(r.k) ? "is-on" : ""}" data-search="${(r.name + " " + r.emp).toLowerCase()}">
      <input type="checkbox" data-k="${r.k}" data-type="${r.type}" ${now.has(r.k) ? "checked" : ""} />
      <span class="dp-body">
        <span class="dp-name">${r.name}</span>
        <span class="dp-sub">${r.hasVehicle ? `${r.type} ${r.veh}` : `${r.type} · จะเลือกรถตอนรับงาน`}${
          r.zone ? ` <span class="zone-tag ${r.zone.cls}">${r.zone.short}</span>` : ""}</span>
        ${r.issues.length ? `<span class="dp-warn">⚠ ${r.issues.join(" · ")}</span>` : ""}
      </span>
      ${before.has(r.k) ? `<span class="tag-on">ทำงานอยู่</span>` : ""}
    </label>`;

  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>${before.size ? "แก้ไขการมอบหมาย" : "มอบหมายงาน"}</h2><button class="sheet-close">✕</button></div>

        <div class="as-detail">
          <div class="as-code">${t.task_code || ""} <span class="status-chip"><span class="dot"></span>${STATUS_LABEL[t.status] || t.status || ""}</span></div>
          <div class="as-route">${t.from_location || "-"} <span class="arrow">→</span> ${t.to_location || "-"}</div>
          ${detail("จำนวนพาเลท", t.pallet_qty)}
          ${detail("สร้างคำขอเมื่อ", t.created_at ? `${fmtTime(t.created_at)} (${fmtDuration(waitMins)}ที่แล้ว)` : "")}
          ${detail("ผู้ขอ", t.requester_name || t.requester_employee_id)}
          ${detail("ติดต่อ", t.requester_contact ? fmtPhone(t.requester_contact) : "")}
          ${detail("หมายเหตุ", t.remark)}
        </div>

        <input id="as-driver-search" placeholder="ค้นหาชื่อหรือรหัสพนักงาน..." />

        ${GROUPS.map(g=>{
          const list = rows.filter(r=> r.type === g.key).sort(byReadiness);
          // Open when it matters: somebody from this type is already on the
          // job, or there is anyone to pick. An empty type stays folded so a
          // long fleet list does not bury the groups that count.
          const hasCrew = [...before.keys()].some(k=> k.endsWith("|" + g.key));
          const open = hasCrew || list.length > 0;
          return `<details class="as-group" ${open ? "open" : ""}>
            <summary class="as-group-head"><span>${g.title}</span><span class="as-count" data-count="${g.key}">ยังไม่เลือก</span></summary>
            ${list.length ? `<div class="driver-pick-list">${list.map(rowHTML).join("")}</div>`
                          : `<div class="field-note" style="padding:6px 2px;">ไม่มีคนขับที่มีใบอนุญาต ${g.key}</div>`}
          </details>`;
        }).join("")}

        <div class="as-diff none" id="as-diff">ยังไม่มีการเปลี่ยนแปลง</div>

        <details class="as-more">
          <summary>ตัวเลือกเพิ่มเติม (ETA / เหตุผล)</summary>
          <label>ETA — คาดว่าเสร็จในกี่นาที (ไม่บังคับ)</label>
          <div class="eta-quick" id="as-etaq">
            ${[10,20,30,60].map(m=>`<button type="button" data-m="${m}">${m === 60 ? "1 ชม." : m + " นาที"}</button>`).join("")}
          </div>
          <input id="as-eta" type="number" min="1" placeholder="หรือพิมพ์เอง" style="margin-top:6px;" />
          <label>เหตุผล (ไม่บังคับ)</label>
          <textarea id="as-reason" rows="2" placeholder="เช่น คนขับเดิมแจ้งรถขัดข้อง"></textarea>
        </details>

        <div id="as-eligibility"></div>
        <button class="primary" id="as-submit" disabled>ยังไม่มีการเปลี่ยนแปลง</button>
      </div>
    </div>`);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };

  const submitBtn = overlay.querySelector("#as-submit");
  const diffBox = overlay.querySelector("#as-diff");

  function counts(){
    const c = {};
    GROUPS.forEach(g=> c[g.key] = 0);
    now.forEach(k=>{ const r = rows.find(x=> x.k === k); if(r && c[r.type] !== undefined) c[r.type]++; });
    return c;
  }
  // "RT 1 คัน · CRANE 2 คัน", listing only the types actually chosen.
  function crewSummary(c){
    const parts = GROUPS.filter(g=> c[g.key]).map(g=> `${g.key} ${c[g.key]} คัน`);
    return parts.length ? parts.join(" · ") : "ยังไม่เลือกคนขับ";
  }
  function sync(){
    const c = counts();
    GROUPS.forEach(g=>{
      const tag = overlay.querySelector(`[data-count="${g.key}"]`);
      if(!tag) return;
      tag.textContent = c[g.key] ? `${c[g.key]} คัน` : "ยังไม่เลือก";
      tag.classList.toggle("on", c[g.key] > 0);
    });
    const added = [...now].filter(k=> !before.has(k));
    const removed = [...before.keys()].filter(k=> !now.has(k));
    const parts = [];
    if(added.length)   parts.push(`<span class="add">+ เพิ่ม</span> ${added.map(nameOf).join(", ")}`);
    if(removed.length) parts.push(`<span class="rem">− ถอด</span> ${removed.map(nameOf).join(", ")}`);
    if(!parts.length){
      diffBox.className = "as-diff none";
      diffBox.textContent = "ยังไม่มีการเปลี่ยนแปลง";
      submitBtn.disabled = true;
      submitBtn.textContent = "ยังไม่มีการเปลี่ยนแปลง";
      return;
    }
    diffBox.className = "as-diff";
    diffBox.innerHTML = parts.join("<br>") +
      `<br><span style="color:var(--ink-dim);">ผลลัพธ์: ${crewSummary(c)}</span>`;
    submitBtn.disabled = now.size === 0;
    submitBtn.textContent = now.size === 0
      ? "ต้องเหลือคนขับอย่างน้อย 1 คน"
      : `ยืนยัน · ${crewSummary(c)}`;
  }

  overlay.querySelectorAll("[data-k]").forEach(cb=>{
    cb.onchange = ()=>{
      // One person, one role per job: ticking them as PE unticks their RT row.
      if(cb.checked){
        const emp = cb.dataset.k.split("|")[0];
        overlay.querySelectorAll("[data-k]").forEach(other=>{
          if(other !== cb && other.dataset.k.split("|")[0] === emp && other.checked){
            other.checked = false;
            now.delete(other.dataset.k);
            other.closest(".driver-pick").classList.remove("is-on");
          }
        });
        now.add(cb.dataset.k);
      } else {
        now.delete(cb.dataset.k);
      }
      cb.closest(".driver-pick").classList.toggle("is-on", cb.checked);
      sync();
    };
  });

  overlay.querySelector("#as-driver-search").addEventListener("input", (e)=>{
    const q = e.target.value.trim().toLowerCase();
    overlay.querySelectorAll("[data-search]").forEach(r=>{
      r.style.display = r.dataset.search.includes(q) ? "" : "none";
    });
  });

  overlay.querySelector("#as-etaq").addEventListener("click", (e)=>{
    const b = e.target.closest("button"); if(!b) return;
    const wasOn = b.classList.contains("on");
    overlay.querySelectorAll("#as-etaq button").forEach(x=> x.classList.remove("on"));
    overlay.querySelector("#as-eta").value = wasOn ? "" : b.dataset.m;
    if(!wasOn) b.classList.add("on");
  });

  async function submit(force){
    if(!now.size){ toast("ต้องเหลือคนขับอย่างน้อย 1 คน"); return; }
    const crew = [...now].map(k=>{
      const [employee_id, vehicle_type] = k.split("|");
      return {employee_id, vehicle_type};
    });
    if(!force){
      const flagged = [...now].map(k=> rows.find(r=> r.k === k)).filter(r=> r && r.issues.length);
      if(flagged.length){
        const txt = flagged.map(r=> `${r.name}: ${r.issues.join(", ")}`).join("\n");
        if(!confirm(`คนขับต่อไปนี้ไม่ตรงเงื่อนไข\n\n${txt}\n\nยืนยันมอบหมายหรือไม่?`)) return;
        force = true;
      }
    }
    // Replacing the whole crew in one call is what "reassign" does; a first
    // assignment of a Waiting job is a plain assign.
    const endpoint = t.status === "Waiting" ? "assign" : "reassign";
    const body = {crew, reason: overlay.querySelector("#as-reason").value.trim(), force: !!force};
    const eta = overlay.querySelector("#as-eta").value;
    if(eta) body.estimated_minutes = parseInt(eta, 10);
    const c = counts();
    submitBtn.disabled = true;
    try{
      await api(`/tasks/${taskId}/${endpoint}`, {method:"POST", body: JSON.stringify(body)});
      closeSheet(overlay);
      toast(`${t.task_code || "งาน"} — ${crewSummary(c)}`);
      await refreshAll();
    }catch(e){
      sync();
      if(e.status === 409){
        const box = overlay.querySelector("#as-eligibility");
        box.innerHTML = "";
        box.appendChild(el(`<div class="err">${e.message}</div>`));
        const ov = el(`<button class="btn amber" style="width:100%;margin-top:8px;">ยืนยันทั้งที่ไม่ตรงเงื่อนไข</button>`);
        ov.onclick = ()=> submit(true);
        box.appendChild(ov);
      } else {
        toast(e.message);
      }
    }
  }
  submitBtn.onclick = ()=> submit(false);
  sync();
}

function renderOperationPeople(main){
  if(state.peopleFilter === undefined) state.peopleFilter = "";
  if(state.peopleRoleFilter === undefined) state.peopleRoleFilter = "";

  const onlineDrivers = state.drivers.filter(d=> d.driver_status !== "Not Checked-in").length;
  const totalDrivers = state.drivers.length;
  const summary = el(`<div class="stat-grid g2" style="margin-bottom:14px;">
    <div class="stat"><div class="n">${onlineDrivers}/${totalDrivers}</div><div class="l">คนขับออนไลน์ตอนนี้</div></div>
    <div class="stat"><div class="n">${state.allUsers.filter(u=>u.role==='USER').length}</div><div class="l">ผู้ขอใช้งาน (User)</div></div>
    <div class="stat"><div class="n">${state.allUsers.filter(u=>u.role==='DISPATCH').length}</div><div class="l">ผู้กระจายงาน</div></div>
    <div class="stat"><div class="n">${state.allUsers.filter(u=>u.role==='ADMIN').length}</div><div class="l">แอดมิน</div></div>
  </div>`);
  main.appendChild(summary);

  const searchBar = el(`<div class="card">
    <div class="grid2">
      <div><label>ค้นหา (ชื่อ / รหัสพนักงาน / อีเมล)</label><input id="op-people-search" placeholder="พิมพ์เพื่อค้นหา..." value="${state.peopleFilter}" /></div>
      <div><label>Role</label><select id="op-people-role">
        <option value="">ทั้งหมด</option>
        <option value="USER">ผู้ขอ</option>
        <option value="DRIVER">คนขับ</option>
        <option value="DISPATCH">ผู้กระจายงาน</option>
        <option value="ADMIN">แอดมิน</option>
      </select></div>
    </div>
  </div>`);
  main.appendChild(searchBar);
  const searchInput = searchBar.querySelector("#op-people-search");
  searchInput.oninput = ()=>{ state.peopleFilter = searchInput.value; renderPeopleList(); };
  const roleSelect = searchBar.querySelector("#op-people-role");
  roleSelect.value = state.peopleRoleFilter;
  roleSelect.onchange = ()=>{ state.peopleRoleFilter = roleSelect.value; renderPeopleList(); };

  const listWrap = el(`<div></div>`);
  main.appendChild(listWrap);
  const addBtn = el(`<button class="btn amber" style="width:100%;margin-top:4px;">+ เพิ่มพนักงานใหม่</button>`);
  addBtn.onclick = ()=> openCreateDriverSheet();
  main.appendChild(addBtn);

  function renderPeopleList(){
    listWrap.innerHTML = "";
    const q = state.peopleFilter.trim().toLowerCase();
    const filtered = state.allUsers.filter(u=>{
      if(state.peopleRoleFilter && u.role !== state.peopleRoleFilter) return false;
      if(!q) return true;
      return (u.full_name||"").toLowerCase().includes(q) || u.employee_id.toLowerCase().includes(q)
        || u.role.toLowerCase().includes(q) || (u.email||"").toLowerCase().includes(q);
    });
    listWrap.appendChild(el(`<div class="section-title">พนักงาน (${filtered.length}/${state.allUsers.length})</div>`));
    const list = el(`<div class="card"></div>`);
    if(filtered.length === 0) list.appendChild(el(`<div class="empty">ไม่พบพนักงานตามที่ค้นหา</div>`));
    filtered.forEach(u=>{
      const driverInfo = state.drivers.find(d=> d.id === u.id);
      const badge = CREW_ROLES.includes(u.role) && driverInfo
        ? `<span class="badge ${driverInfo.driver_status==='Available'?'ok':driverInfo.driver_status==='Breakdown'?'bad':'warn'}">${DRIVER_STATUS_LABEL[driverInfo.driver_status]||driverInfo.driver_status}</span>`
        : `<span class="badge">${u.role}</span>`;
      const expiredWarn = driverInfo && driverInfo.expired_count > 0 ? `<span class="badge bad">ใบอนุญาตหมดอายุ</span>` : "";
      list.appendChild(el(`<div class="list-row">
        <div><div class="l-main">${u.full_name || u.employee_id} <span class="field-note">(${u.employee_id} · ${u.role})</span></div>
          <div class="l-sub">${u.role==='DRIVER' ? 'สิทธิ์: '+(driverInfo && driverInfo.license_types || '-') : (u.contact||'-')}${u.email ? ' · '+u.email : ''}</div></div>
        <div style="display:flex;align-items:center;gap:6px;">${badge}${expiredWarn}<button class="btn sm" data-edit-user="${u.id}">จัดการ</button></div>
      </div>`));
    });
    listWrap.appendChild(list);
    list.querySelectorAll("[data-edit-user]").forEach(b=> b.onclick = ()=> openUserEditSheet(b.dataset.editUser));
  }
  renderPeopleList();
}

function openCreateDriverSheet(){
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>เพิ่มพนักงานใหม่ (คนขับ)</h2><button class="sheet-close">✕</button></div>

function renderOperationVehicles(main){

  main.appendChild(summary);

  const searchBar = el(`<div class="card">
    <div class="grid2">
      <div><label>ค้นหา (รหัสรถ / ประเภท)</label><input id="op-vehicle-search" placeholder="พิมพ์เพื่อค้นหา..." value="${state.vehicleFilter}" /></div>

        <option value="">ทั้งหมด</option>
        <option value="Available">ว่าง</option>
        <option value="Busy">ไม่ว่าง</option>
        <option value="Breakdown">ขัดข้อง</option>
      </select></div>
    </div>
  </div>`);
  main.appendChild(searchBar);
  const searchInput = searchBar.querySelector("#op-vehicle-search");
  searchInput.oninput = ()=>{ state.vehicleFilter = searchInput.value; renderVehicleList(); };
  const statusSelect = searchBar.querySelector("#op-vehicle-status");
  statusSelect.value = state.vehicleStatusFilter;
  statusSelect.onchange = ()=>{ state.vehicleStatusFilter = statusSelect.value; renderVehicleList(); };

  const listWrap = el(`<div></div>`);
  main.appendChild(listWrap);
  const addBtn = el(`<button class="btn amber" style="width:100%;margin-top:4px;">+ เพิ่มรถใหม่</button>`);
  addBtn.onclick = ()=> openCreateVehicleSheet();
  main.appendChild(addBtn);

  function renderVehicleList(){
    listWrap.innerHTML = "";
    const q = state.vehicleFilter.trim().toLowerCase();
    const filtered = state.vehicles.filter(v=>{
      if(state.vehicleStatusFilter && v.status !== state.vehicleStatusFilter) return false;
      if(!q) return true;
      return v.code.toLowerCase().includes(q) || v.vehicle_type.toLowerCase().includes(q) || v.status.toLowerCase().includes(q);
    });
    listWrap.appendChild(el(`<div class="section-title">รถ (${filtered.length}/${state.vehicles.length})</div>`));
    const list = el(`<div class="card"></div>`);
    if(filtered.length === 0) list.appendChild(el(`<div class="empty">ไม่พบรถตามที่ค้นหา</div>`));
    filtered.forEach(v=>{
      const badgeClass = v.status === "Available" ? "ok" : v.status === "Breakdown" ? "bad" : "warn";
      list.appendChild(el(`<div class="list-row">
        <div><div class="l-main">${v.code}</div><div class="l-sub">${v.vehicle_type}</div></div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="badge ${badgeClass}">${v.status === 'Available' ? 'ว่าง' : v.status === 'Busy' ? 'ไม่ว่าง' : v.status === 'Breakdown' ? 'ขัดข้อง' : v.status}</span>
          <button class="btn sm" data-edit-vehicle="${v.id}">แก้ไข</button>
          <button class="btn sm red" data-del-vehicle="${v.id}">ปลดระวาง</button>
        </div>
      </div>`));
    });
    listWrap.appendChild(list);
    list.querySelectorAll("[data-edit-vehicle]").forEach(b=> b.onclick = ()=> openVehicleEditSheet(b.dataset.editVehicle));
    list.querySelectorAll("[data-del-vehicle]").forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm("ปลดระวางรถคันนี้?\n\nรถจะหายจากรายการที่เลือกได้ แต่ประวัติงานที่เคยใช้รถคันนี้ยังอยู่ครบ")) return;
        try{ await api(`/vehicles/${b.dataset.delVehicle}`, {method:"DELETE"}); toast("ปลดระวางรถแล้ว"); await refreshAll(); }
        catch(e){ toast(e.message); }
      };
    });
  }
  renderVehicleList();
}

function openUserEditSheet(userId){

  if(!u) return;
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>${u.full_name || u.employee_id}</h2><button class="sheet-close">✕</button></div>

        <div class="card" style="padding:12px 14px;">
          <div class="as-d"><span>รหัสพนักงาน</span><b>${u.employee_id}</b></div>
          <div class="as-d"><span>ชื่อ-นามสกุล</span><b>${u.full_name || "-"}</b></div>
          <div class="as-d"><span>อีเมล</span><b>${u.email || "-"}</b></div>
          <div class="as-d"><span>เบอร์ติดต่อ</span><b>${u.contact ? fmtPhone(u.contact) : "-"}</b></div>

          <div class="field-note" style="margin-top:6px;">ดูได้อย่างเดียว — เจ้าของบัญชีแก้ไขเองในเมนูโปรไฟล์</div>
        </div>

        <div class="section-title">สิทธิ์และบัญชี</div>
        <label>สิทธิ์การใช้งาน (Role)</label>
        <select id="ue-role" ${canManageUser(u) ? "" : "disabled"}>
          ${(() => {
            // Always show their current role, even one this person cannot
            // grant, so the dropdown never misreports who someone is.
            const opts = rolesICanGrant().slice();
            if(!opts.includes(u.role)) opts.unshift(u.role);
            return opts.map(r=>`<option value="${r}" ${r===u.role?"selected":""}>${ROLE_TH[r] || r} (${r})</option>`).join("");
          })()}
        </select>
        ${canManageUser(u) ? "" : `<div class="field-note" style="color:var(--warn);margin-top:6px;line-height:1.6;">
          บัญชีนี้เป็นแอดมิน เฉพาะแอดมินเท่านั้นที่เปลี่ยนสิทธิ์ รีเซ็ตรหัสผ่าน หรือลบบัญชีนี้ได้
        </div>`}
        <button class="primary" id="ue-submit" ${canManageUser(u) ? "" : "disabled"}>บันทึกสิทธิ์</button>
        <div class="grid2" style="margin-top:10px;">
          <button class="btn amber" id="ue-reset-pw" style="width:100%;" ${canManageUser(u) ? "" : "disabled"}>รีเซ็ตรหัสผ่าน</button>
          <button class="btn red" id="ue-delete" style="width:100%;" ${canManageUser(u) ? "" : "disabled"}>ลบผู้ใช้นี้</button>
        </div>
        <div id="ue-zone-section" style="margin-top:20px;${CREW_ROLES.includes(u.role)?'':'display:none;'}">
          <div class="section-title" style="margin-top:0;">โซนประจำ</div>
          <div id="ue-zone-host"><div class="card"><div class="empty">กำลังโหลด...</div></div></div>
        </div>
        <div id="ue-license-section" style="margin-top:20px;${CREW_ROLES.includes(u.role)?'':'display:none;'}">
          <div class="section-title" style="margin-top:0;">ใบอนุญาตขับรถ</div>
          <div id="ue-license-list" class="card"><div class="empty">กำลังโหลด...</div></div>
          <div class="card">
            <div class="grid2">
              <div><label>ประเภทรถ</label><select id="ul-type">${state.vehicleTypes.map(vt=>`<option value="${vt.type_key}">${vt.type_name_th}</option>`).join("")}</select></div>
              <div><label>วันหมดอายุ</label><input id="ul-expiry" type="date" /></div>
            </div>
            <label style="display:flex;align-items:center;gap:8px;margin-top:10px;">
              <input type="checkbox" id="ul-permanent" style="width:auto;" checked /> ถาวร (ไม่มีวันหมดอายุ)
            </label>
            <div>
              <label for="ul-default">รถประจำ (ไม่บังคับ)</label>
              <select id="ul-default"></select>
              <div class="field-note" style="margin-top:6px;line-height:1.6;">
                ตั้งแล้วคนขับจะขึ้นรถคันนี้ให้อัตโนมัติทุกครั้งที่เปิดแอพ ไม่ต้องเลือกรถเอง
                เปลี่ยนรถเองได้ตลอดจากหน้าหลัก
              </div>
            </div>
            <button class="btn amber" id="ul-submit" style="width:100%;margin-top:10px;">เพิ่ม/แก้ไขใบอนุญาต</button>
          </div>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };

  overlay.querySelector("#ue-role").onchange = (e)=>{
    const crewNow = CREW_ROLES.includes(e.target.value);
    overlay.querySelector("#ue-license-section").style.display = crewNow ? "block" : "none";
    overlay.querySelector("#ue-zone-section").style.display = crewNow ? "block" : "none";
  };
  overlay.querySelector("#ul-permanent").onchange = (e)=>{
    overlay.querySelector("#ul-expiry").disabled = e.target.checked;
  };
  overlay.querySelector("#ul-expiry").disabled = true;

  async function loadLicenses(){
    const box = overlay.querySelector("#ue-license-list");
    if(!box) return;
    try{
      const licenses = await api(`/admin/users/${userId}/licenses`);
      box.innerHTML = "";
      if(licenses.length === 0){ box.appendChild(el(`<div class="empty">ยังไม่มีใบอนุญาต</div>`)); return; }
      licenses.forEach(l=>{
        const expired = l.expiry_date && l.expiry_date < new Date().toISOString().slice(0,10);
        const dv = (state.vehicles || []).find(v=> v.id === l.default_vehicle_id);
        box.appendChild(el(`<div class="list-row">
          <span>${l.vehicle_type} ${l.expiry_date ? '· หมดอายุ '+l.expiry_date : '· ถาวร'}
            ${dv ? `· รถประจำ <b>${dv.code}</b>` : '· ไม่มีรถประจำ'}
            ${expired ? '<span class="badge bad">หมดอายุแล้ว</span>' : ''}</span>
          <button class="btn sm red" data-del-license="${l.vehicle_type}">ลบ</button>
        </div>`));
      });
      box.querySelectorAll("[data-del-license]").forEach(b=>{
        b.onclick = async ()=>{
          if(!confirm("ยืนยันลบใบอนุญาตนี้?")) return;
          try{ await api(`/admin/users/${userId}/licenses/${b.dataset.delLicense}`, {method:"DELETE"}); toast("ลบใบอนุญาตแล้ว"); await loadLicenses(); await refreshAll(); }
          catch(e){ toast(e.message); }
        };
      });
    }catch(e){ box.innerHTML=""; box.appendChild(el(`<div class="empty">โหลดไม่สำเร็จ</div>`)); }
  }
  // Home zones, edited here exactly as the person edits them in their own
  // profile — same component, so the rules cannot drift between the two.
  async function loadZones(){
    const host = overlay.querySelector("#ue-zone-host");
    try{
      const current = await api(`/admin/users/${u.id}/zones`, {background:true});
      host.innerHTML = "";
      const editor = buildHomeZoneEditor(current);
      host.appendChild(editor.card);
      const save = el(`<button class="primary" style="width:100%;margin-top:10px;"
        ${canManageUser(u) ? "" : "disabled"}>บันทึกโซนประจำ</button>`);
      save.onclick = async ()=>{
        save.disabled = true;
        try{
          await api(`/admin/users/${u.id}/zones`, {method:"PUT", body: JSON.stringify(editor.read())});
          toast("บันทึกโซนประจำแล้ว");
          await refreshAll();
        }catch(e){ toast(e.message); }
        finally{ save.disabled = false; }
      };
      host.appendChild(save);
    }catch(e){
      host.innerHTML = "";
      host.appendChild(el(`<div class="card"><div class="empty">โหลดโซนประจำไม่สำเร็จ</div></div>`));
    }
  }
  if(CREW_ROLES.includes(u.role)){ loadLicenses(); loadZones(); }

  // Only vehicles of the chosen type can be someone's usual vehicle, so the
  // list follows the type picker instead of offering the whole fleet and
  // failing on save.
  const typeSel = overlay.querySelector("#ul-type");
  const defSel = overlay.querySelector("#ul-default");
  function fillDefaultVehicles(){
    if(!defSel) return;
    const type = typeSel.value;
    const fleet = (state.vehicles || []).filter(v=> v.vehicle_type === type && !v.retired_at);
    defSel.innerHTML = `<option value="">— ไม่มีรถประจำ —</option>` +
      fleet.map(v=>`<option value="${v.code}">${v.code}</option>`).join("");
    if(!fleet.length) defSel.innerHTML = `<option value="">— ยังไม่มีรถประเภทนี้ในระบบ —</option>`;
  }
  if(typeSel && defSel){ typeSel.addEventListener("change", fillDefaultVehicles); fillDefaultVehicles(); }

  overlay.querySelector("#ul-submit").onclick = async ()=>{
    const permanent = overlay.querySelector("#ul-permanent").checked;
    try{
      await api(`/admin/users/${userId}/licenses`, {method:"POST", body: JSON.stringify({
        vehicle_type: typeSel.value,
        expiry_date: permanent ? null : overlay.querySelector("#ul-expiry").value,
        default_vehicle_code: defSel ? (defSel.value || null) : null,
      })});
      toast("บันทึกใบอนุญาตแล้ว");
      await loadLicenses();
      await refreshAll();
    }catch(e){ toast(e.message); }
  };

  overlay.querySelector("#ue-submit").onclick = async ()=>{
    try{
      // Role is the only thing an admin changes here; personal details are
      // the account owner's to edit, and the server refuses them too.
      await api(`/admin/users/${userId}`, {method:"PUT", body: JSON.stringify({
        role: overlay.querySelector("#ue-role").value,
      })});
      toast("บันทึกสิทธิ์แล้ว");
      closeSheet(overlay);
      await refreshAll();
    }catch(e){ toast(e.message); }
  };

  overlay.querySelector("#ue-reset-pw").onclick = async ()=>{
    if(!confirm(`ยืนยันรีเซ็ตรหัสผ่านของ ${u.full_name || u.employee_id}? บัญชีนี้จะถูกออกจากระบบทันที และต้องตั้งรหัสผ่านใหม่ตอนล็อกอินครั้งถัดไป`)) return;
    try{
      await api(`/admin/users/${userId}/reset-password`, {method:"POST"});
      toast("รีเซ็ตรหัสผ่านแล้ว — แจ้งพนักงานให้ล็อกอินใหม่เพื่อตั้งรหัสผ่าน");
    }catch(e){ toast(e.message); }
  };

  overlay.querySelector("#ue-delete").onclick = async ()=>{
    if(!confirm(`ยืนยันลบผู้ใช้ ${u.full_name || u.employee_id}? บัญชีจะเข้าระบบไม่ได้อีก (ประวัติงาน/แชทเดิมยังเก็บไว้ตามปกติ)`)) return;
    try{
      await api(`/admin/users/${userId}`, {method:"DELETE"});
      toast("ลบผู้ใช้แล้ว");
      closeSheet(overlay);
      await refreshAll();
    }catch(e){ toast(e.message); }
  };
}

const ADMIN_SETTINGS_SUBTABS = ["system", "zones", "vehicletypes", "audit"];

// Editing a zone in place. The key is shown but locked: tasks store it as
// plain text and four zones have their own picker keyed on it, so changing it
// would orphan history and silently drop the custom picker.
function openZoneEditSheet(zoneKey){
  const z = (state.zones || []).find(x=> x.zone_key === zoneKey);
  if(!z) return;
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>แก้ไขโซน</h2><button class="sheet-close">✕</button></div>
        <div class="card" style="padding:12px 14px;">
          <div class="as-d"><span>รหัสโซน</span><b class="mono">${z.zone_key}</b></div>
          <div class="field-note" style="margin-top:6px;line-height:1.6;">
            รหัสโซนแก้ไม่ได้ เพราะงานทุกงานที่เคยสร้างอ้างอิงรหัสนี้อยู่
            ถ้าเปลี่ยน ประวัติงานเก่าจะอ่านไม่ออก — แก้ที่ชื่อโซนด้านล่างได้เลย
          </div>
        </div>
        <label for="ze-name">ชื่อโซน (ไทย)</label>
        <input id="ze-name" value="${z.zone_name_th}" />
        <label for="ze-pattern">รูปแบบรหัส (regular expression)</label>
        <input id="ze-pattern" class="mono" value="${z.code_pattern}" />
        <label for="ze-example">ตัวอย่างรหัสที่ถูกต้อง</label>
        <input id="ze-example" value="${z.example_code || ''}" />
        <div class="field-note">ระบบจะเช็คว่าตัวอย่างนี้ผ่านรูปแบบที่ตั้งไว้ ก่อนบันทึก</div>
        <label style="display:flex;align-items:center;gap:8px;margin-top:12px;">
          <input type="checkbox" id="ze-multi" style="width:auto;" ${z.allow_multiple ? "checked" : ""} /> เลือกได้หลายจุดในงานเดียว
        </label>
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="ze-free" style="width:auto;" ${z.free_text ? "checked" : ""} /> พิมพ์อิสระ (ไม่ตรวจรูปแบบ)
        </label>
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="ze-origin" style="width:auto;" ${z.origin_only ? "checked" : ""} /> เลือกได้เฉพาะจุดต้นทาง
        </label>
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="ze-noloc" style="width:auto;" ${z.no_location ? "checked" : ""} /> ไม่ต้องระบุตำแหน่ง (กดโซนแล้วบันทึกเลย)
        </label>
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="ze-active" style="width:auto;" ${z.active ? "checked" : ""} /> เปิดใช้งาน (ให้เลือกได้ตอนสร้างงาน)
        </label>
        <button class="primary" id="ze-submit">บันทึก</button>
        <button class="btn red" id="ze-off" style="width:100%;margin-top:8px;">ปิดใช้งานโซนนี้</button>
        <div class="field-note" style="margin-top:6px;line-height:1.6;">
          ปิดใช้งานแล้วโซนจะหายจากเมนูเลือกจุด แต่ประวัติงานที่เคยใช้โซนนี้ยังอ่านออกครบ
          (โซนที่ไม่มีงานไหนอ้างอิงเลย ระบบจะลบทิ้งให้จริง)
        </div>
      </div>
    </div>`);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  overlay.querySelector("#ze-submit").onclick = async ()=>{
    try{
      await api(`/zones/${zoneKey}`, {method:"PUT", body: JSON.stringify({
        zone_name_th: overlay.querySelector("#ze-name").value,
        code_pattern: overlay.querySelector("#ze-pattern").value,
        example_code: overlay.querySelector("#ze-example").value,
        allow_multiple: overlay.querySelector("#ze-multi").checked,
        free_text: overlay.querySelector("#ze-free").checked,
        origin_only: overlay.querySelector("#ze-origin").checked,
        no_location: overlay.querySelector("#ze-noloc").checked,
        active: overlay.querySelector("#ze-active").checked,
      })});
      toast("บันทึกโซนแล้ว");
      closeSheet(overlay);
      await refreshAll();
    }catch(e){ toast(e.message); }
  };
  overlay.querySelector("#ze-off").onclick = async ()=>{
    if(!confirm(`ปิดใช้งานโซน ${z.zone_name_th}?\n\nจะหายจากเมนูเลือกจุด แต่ประวัติงานเก่ายังอยู่ครบ`)) return;
    try{
      const r = await api(`/zones/${zoneKey}`, {method:"DELETE"});
      toast(r.deleted ? "ลบโซนแล้ว (ไม่มีงานไหนอ้างอิง)" : `ปิดใช้งานแล้ว (มี ${r.task_count} งานอ้างอิงอยู่)`);
      closeSheet(overlay);
      await refreshAll();
    }catch(e){ toast(e.message); }
  };
}

function renderAdminSettings(main){
  // "matrix" used to be one of these. Someone whose last-used subtab was that
  // one has it in localStorage, so without this they would come back to a
  // blank page after the update.
  if(!ADMIN_SETTINGS_SUBTABS.includes(state.subtab)) setTab(state.tab, "system");
  const subtabs = el(`<div class="subtabs">
    <button data-s="system">ตั้งค่าระบบ</button>
    <button data-s="zones">โซน</button>
    <button data-s="vehicletypes">ประเภทรถ</button>
    <button data-s="audit">บันทึกตรวจสอบ</button>
  </div>`);
  subtabs.querySelectorAll("button").forEach(b=>{
    b.classList.toggle("active", b.dataset.s === state.subtab);
    b.onclick = ()=>{ setTab(state.tab, b.dataset.s); renderContent(); };
  });
  main.appendChild(subtabs);

  if(state.subtab === "system"){
    // Everything an admin can change without a redeploy: the registration
    // invite codes and the rack location layout. The layout lives here rather
    // than in code because the warehouse defines its own ranges, and new
    // aisles appear over time.
    const box = el(`<div class="card"><div class="empty">กำลังโหลด...</div></div>`);
    main.appendChild(box);
    (async ()=>{
      let cfg;
      try{ cfg = await api("/admin/config", {background:true}); }
      catch(e){ box.innerHTML = ""; box.appendChild(el(`<div class="err">${e.message}</div>`)); return; }
      // A response without `values` would otherwise throw halfway through
      // building the form and leave the whole settings page blank.
      const v = (cfg && cfg.values) || {};
      box.innerHTML = "";

      // Invite codes used to be two fixed fields here, which left any vehicle
      // type added later with no way to hand out its own licence. Each type
      // now carries its own code, edited on the ประเภทรถ page.
      box.appendChild(el(`<div class="field-note" style="margin-top:0;margin-bottom:8px;line-height:1.6;">
        รหัสเชิญสมัครเป็นคนขับย้ายไปอยู่ที่ <b>จัดการระบบ → ประเภทรถ</b> แล้ว
        เพราะแต่ละประเภทรถมีรหัสของตัวเอง</div>`));

      box.appendChild(el(`<div class="section-title" style="margin-top:0;">รูปแบบรหัสตำแหน่งชั้นวาง</div>`));
      box.appendChild(el(`<div class="field-note" style="margin-bottom:8px;">
        รหัสมี 7 ตัว: Aisle 3 ตัว + Bay 2 หลัก + Level 1 ตัว + Slot 1 หลัก (เช่น ABA03A2)<br>
        ช่วงที่กรอกด้านล่างคือช่วงที่ระบบจะยอมรับ</div>`));
      const ranges = [
        ["Aisle", "rack_aisle_from", "rack_aisle_to", "AAA", "ABH"],
        ["Bay", "rack_bay_from", "rack_bay_to", "01", "40"],
        ["Level", "rack_level_from", "rack_level_to", "A", "G"],
        ["Slot", "rack_slot_from", "rack_slot_to", "1", "5"],
      ];
      ranges.forEach(([label, kf, kt, ef, et])=>{
        box.appendChild(el(`<div><label>${label}</label>
          <div class="grid2">
            <div><input id="cfg-${kf}" value="${v[kf] || ""}" placeholder="ตั้งแต่ ${ef}" /></div>
            <div><input id="cfg-${kt}" value="${v[kt] || ""}" placeholder="ถึง ${et}" /></div>
          </div></div>`));
      });

      box.appendChild(el(`<label>ตัวอักษรตัวแรกของ Aisle → ประเภทชั้นวาง</label>`));
      box.appendChild(el(`<div class="field-note" style="margin-bottom:6px;">
        รูปแบบ <b>A=DOUBLE_DEEP,B=SELECTIVE_RACK</b> — เพิ่มตัวอักษรใหม่ได้เรื่อยๆ คั่นด้วยจุลภาค</div>`));
      box.appendChild(el(`<input id="cfg-rack_prefix_map" value="${v.rack_prefix_map || ""}" />`));

      // Try a code against the CURRENT saved settings before committing to
      // them — a layout that rejects real locations would stop every request
      // from being created.
      box.appendChild(el(`<div class="section-title">ทดสอบรหัสตำแหน่ง</div>`));
      const testRow = el(`<div class="grid2">
        <div><input id="cfg-test" placeholder="เช่น ABA03A2" /></div>
        <div><button class="btn" id="cfg-test-btn" style="width:100%;">ตรวจสอบ</button></div>
      </div>`);
      box.appendChild(testRow);
      const testOut = el(`<div id="cfg-test-out" style="margin-top:6px;"></div>`);
      box.appendChild(testOut);
      testRow.querySelector("#cfg-test-btn").onclick = async ()=>{
        const code = box.querySelector("#cfg-test").value.trim();
        if(!code) return;
        try{
          const res = await api(`/rack/validate?code=${encodeURIComponent(code)}`, {background:true});
          testOut.innerHTML = "";
          testOut.appendChild(el(res.ok
            ? `<div class="field-note" style="color:var(--green);">✅ ใช้ได้ — Aisle ${res.parsed.aisle} · Bay ${res.parsed.bay} · Level ${res.parsed.level} · Slot ${res.parsed.slot} · ${res.parsed.zone_key}</div>`
            : `<div class="err">${res.error}</div>`));
        }catch(e){ toast(e.message); }
      };

      const saveBtn = el(`<button class="primary" style="width:100%;margin-top:14px;">บันทึกการตั้งค่า</button>`);
      saveBtn.onclick = async ()=>{
        const need = ["#cfg-rack_prefix_map",
                      ...ranges.flatMap(([, kf, kt])=> [`#cfg-${kf}`, `#cfg-${kt}`])];
        const missing = need.filter(sel=> !box.querySelector(sel));
        if(missing.length){ toast("หน้าตั้งค่าโหลดไม่ครบ กรุณารีเฟรชแล้วลองใหม่"); return; }
        const values = {rack_prefix_map: box.querySelector("#cfg-rack_prefix_map").value.trim()};
        ranges.forEach(([, kf, kt])=>{
          values[kf] = box.querySelector(`#cfg-${kf}`).value.trim();
          values[kt] = box.querySelector(`#cfg-${kt}`).value.trim();
        });
        saveBtn.disabled = true;
        try{
          await api("/admin/config", {method:"PUT", body: JSON.stringify({values})});
          toast("บันทึกการตั้งค่าแล้ว");
        }catch(e){ toast(e.message); }
        finally{ saveBtn.disabled = false; }
      };
      box.appendChild(saveBtn);

      // Phone and email only became login identifiers in this build, so any
      // pre-existing account sharing one is now ambiguous. Surface it instead
      // of letting someone discover it when they can't log in.
      const dupPhone = cfg.duplicates.phone || [], dupEmail = cfg.duplicates.email || [];
      if(dupPhone.length || dupEmail.length){
        const warn = el(`<div class="card" style="margin-top:14px;">
          <div class="section-title" style="margin-top:0;color:var(--warn);">⚠️ ข้อมูลซ้ำที่ต้องแก้</div>
          <div class="field-note" style="margin-bottom:8px;">
            เบอร์โทรและอีเมลใช้ล็อกอินได้แล้ว บัญชีที่ใช้ซ้ำกันจะทำให้ระบบไม่รู้ว่าควรเข้าเป็นใคร
            กรุณาแก้ให้เหลือบัญชีละหนึ่งค่า</div>
          ${[...dupPhone.map(d=>["เบอร์", d]), ...dupEmail.map(d=>["อีเมล", d])].map(([kind, d])=>
            `<div style="font-size:12px;line-height:1.8;margin-bottom:6px;">
              <b>${kind} ${d.value}</b> — ใช้ร่วมกัน ${d.count} บัญชี:
              ${d.users.map(u=>`${u.full_name || ""} (${u.employee_id})`).join(", ")}
            </div>`).join("")}
        </div>`);
        main.appendChild(warn);
      }

      // Where this deployment runs and how far it is from the database.
      try{
        const d = await api("/admin/diagnostics", {background:true});
        main.appendChild(el(`<div class="card" style="margin-top:14px;">
          <div class="section-title" style="margin-top:0;">สถานะระบบ</div>
          <div style="font-size:12px;line-height:1.9;">
            <div style="display:flex;justify-content:space-between;"><span style="color:var(--ink-dim);">เวอร์ชัน</span><span>${d.version}</span></div>
            <div style="display:flex;justify-content:space-between;"><span style="color:var(--ink-dim);">Region ที่ประมวลผล</span><span>${d.function_region || "-"}</span></div>
            <div style="display:flex;justify-content:space-between;"><span style="color:var(--ink-dim);">ฐานข้อมูล</span><span>${d.database_host || d.database_backend}</span></div>
            <div style="display:flex;justify-content:space-between;"><span style="color:var(--ink-dim);">เวลาต่อฐานข้อมูล</span><span>${d.connect_ms} ms</span></div>
            <div style="display:flex;justify-content:space-between;"><span style="color:var(--ink-dim);">เวลา query</span><span>${d.query_ms} ms</span></div>
            <div style="display:flex;justify-content:space-between;font-weight:700;"><span>รวม</span><span>${d.total_ms} ms — ${d.verdict}</span></div>
            <div style="display:flex;justify-content:space-between;gap:10px;margin-top:6px;"><span style="color:var(--ink-dim);">แจ้งเตือน iPhone</span>
              <span style="text-align:right;">${d.vapid_subject_ios_ok ? "✅ พร้อม" : "❌ ใช้ไม่ได้ — ต้องตั้ง VAPID_SUBJECT"}<br>
              <span class="field-note">${d.vapid_subject} (${d.vapid_subject_source})</span></span></div>
          </div>
        </div>`));
      }catch(e){ /* diagnostics are informational only */ }
    })();
  } else if(state.subtab === "zones"){
    main.appendChild(el(`<div class="section-title">โซนทั้งหมด</div>`));
    main.appendChild(el(`<div class="field-note" style="margin-bottom:10px;">ไม่ต้องสร้างรหัสตำแหน่งทีละอัน — กำหนดแค่รูปแบบ (pattern) ของโซน ระบบจะตรวจสอบรหัสที่พิมพ์เข้ามาอัตโนมัติ</div>`));
    const list = el(`<div class="card"></div>`);
    const zonesSorted = (state.zones || []).slice()
      .sort((a,b)=> (a.sort_order - b.sort_order) || (a.id - b.id));
    zonesSorted.forEach((z, i)=>{
      const tags = [
        z.allow_multiple ? "เลือกได้หลายจุด" : "",
        z.free_text ? "พิมพ์อิสระ" : "",
        z.origin_only ? "ต้นทางเท่านั้น" : "",
        z.no_location ? "ไม่ต้องระบุจุด" : "",
      ].filter(Boolean).join(" · ");
      list.appendChild(el(`<div class="zone-row${z.active ? "" : " is-off"}">
        <div class="zone-head">
          <div>
            <div class="l-main">${z.zone_name_th}
              <span class="field-note">(${z.zone_key})</span>
              ${z.active ? "" : `<span class="badge">ปิดใช้งาน</span>`}</div>
            <div class="l-sub mono">${z.no_location ? "—" : z.code_pattern}${tags ? " · " + tags : ""}</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="btn sm" data-zone-up="${z.zone_key}" ${i === 0 ? "disabled" : ""} title="เลื่อนขึ้น">↑</button>
            <button class="btn sm" data-zone-down="${z.zone_key}" ${i === zonesSorted.length - 1 ? "disabled" : ""} title="เลื่อนลง">↓</button>
            <button class="btn sm amber" data-zone-edit="${z.zone_key}">แก้ไข</button>
          </div>
        </div>
      </div>`));
    });
    main.appendChild(list);
    list.querySelectorAll("[data-zone-edit]").forEach(b=>{
      b.onclick = ()=> openZoneEditSheet(b.dataset.zoneEdit);
    });
    // Reordering by swapping sort_order with the neighbour, so the list the
    // requester sees can be put in the order they actually walk the warehouse.
    const move = async (key, dir)=>{
      const i = zonesSorted.findIndex(z=> z.zone_key === key);
      const j = i + dir;
      if(i < 0 || j < 0 || j >= zonesSorted.length) return;
      const a = zonesSorted[i], bz = zonesSorted[j];
      try{
        await api(`/zones/${a.zone_key}`, {method:"PUT", body: JSON.stringify({sort_order: bz.sort_order})});
        await api(`/zones/${bz.zone_key}`, {method:"PUT", body: JSON.stringify({sort_order: a.sort_order})});
        await refreshAll();
      }catch(e){ toast(e.message); }
    };
    list.querySelectorAll("[data-zone-up]").forEach(b=> b.onclick = ()=> move(b.dataset.zoneUp, -1));
    list.querySelectorAll("[data-zone-down]").forEach(b=> b.onclick = ()=> move(b.dataset.zoneDown, 1));
    main.appendChild(el(`<div class="section-title">เพิ่มโซนใหม่</div>`));
    const form = el(`<div class="card">
      <div class="grid2">
        <div><label>รหัสโซน (ภาษาอังกฤษ, ไม่ซ้ำ)</label><input id="zn-key" placeholder="เช่น COLD_STORAGE" /></div>
        <div><label>ชื่อโซน (ไทย)</label><input id="zn-name" placeholder="เช่น ห้องเย็น" /></div>
      </div>
      <label>Pattern (regular expression)</label>
      <input id="zn-pattern" placeholder="เช่น ^COLD-[1-9]$" class="mono" />
      <div class="field-note">ตัวอย่าง: ^COLD-[1-9]$ จะยอมรับ COLD-1 ถึง COLD-9 เท่านั้น</div>
      <label>ตัวอย่างรหัสที่ถูกต้อง</label>
      <input id="zn-example" placeholder="เช่น COLD-3" />
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;">
        <input type="checkbox" id="zn-multi" style="width:auto;" /> เลือกได้หลายจุดในงานเดียว
      </label>
      <label style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="zn-free" style="width:auto;" /> พิมพ์อิสระ (ไม่ตรวจรูปแบบ)
      </label>
      <label style="display:flex;align-items:center;gap:8px;">

function buildTaskDetailActions(t){
  const isChat = `<button class="btn" data-chat="${t.id}">💬 แชท</button>`;
  const dupBtn = `<button class="btn" data-duplicate="${t.id}">สร้างงานจากงานนี้</button>`;
  if(state.role === "USER"){
    if(t.status === "Waiting") return `<button class="btn" data-edit="${t.id}">แก้ไข</button>${isChat}<button class="btn red" data-action="cancel">ยกเลิก</button>${dupBtn}`;
    if(t.status === "Assigned") return `${isChat}<button class="btn red" data-action="cancel">ยกเลิก</button>${dupBtn}`;
    // The requester can clear a problem and confirm the job is done — they are
    // usually the one who can see whether the goods arrived.
    if(t.status === "Pause") return `<button class="btn amber" data-resolve="${t.id}">แก้ไขเหตุขัดข้อง</button><button class="btn green" data-req-complete="${t.id}">ยืนยันงานเสร็จ</button>${isChat}`;
    // A hold-up is as often the requester's to report as the driver's.
    if(t.status === "In Progress") return `<button class="btn green" data-req-complete="${t.id}">ยืนยันงานเสร็จ</button><button class="btn" data-pause="${t.id}">แจ้งปัญหา</button>${isChat}`;
    if(t.status === "Completed" && !t.rating) return `<button class="btn amber" data-rate="${t.id}">ให้คะแนน</button>${isChat}${dupBtn}`;
    return isChat + dupBtn;
  }
  // A dispatcher who also drives needs the driver's buttons on their own work
  // screen and the dispatcher's buttons everywhere else — the same job, two
  // different hats.
  if(state.role === "DRIVER" || (isCrew() && state.tab === "available")){
    const mine = (t.drivers||[]).some(d=> d.employee_id === state.employee_id);
    const amPrimary = t.driver_employee_id === state.employee_id;
    const leaveBtn = ["Assigned","In Progress","Pause"].includes(t.status) ? `<button class="btn red" data-leave="${t.id}">ออกจากงาน</button>` : "";
    if(mine){
      if(t.status === "Assigned" && amPrimary) return `<button class="btn green" data-action="start">เริ่มงาน</button>${isChat}${leaveBtn}`;
      if(t.status === "In Progress") return `<button class="btn green" data-action="complete">เสร็จงาน</button><button class="btn" data-pause="${t.id}">หยุดชั่วคราว</button>${isChat}${leaveBtn}`;
      if(t.status === "Pause") return `<button class="btn amber" data-action="resume">ทำงานต่อ</button>${isChat}${leaveBtn}`;
      return `${isChat}${leaveBtn}`;
    }
    if(t.status === "Waiting") return `<button class="btn amber" data-self-assign="${t.id}">รับงานนี้</button>`;
    if(["Assigned","In Progress","Pause"].includes(t.status)) return `<button class="btn green" data-join="${t.id}">เข้าร่วม</button><button class="btn blue" data-take-over="${t.id}">รับช่วงแทน</button>`;
    return "";
  }
  if(isOps()){
    if(t.status === "Waiting") return `<button class="btn amber" data-assign="${t.id}">มอบหมายงาน</button>`;
    if(["Assigned","In Progress","Pause"].includes(t.status)) return `<button class="btn blue" data-reassign="${t.id}">แก้ไขการมอบหมาย</button>${isChat}${t.status !== "Assigned" ? `<button class="btn green" data-admin-complete="${t.id}">ทำเครื่องหมายเสร็จ</button>` : ""}<button class="btn red" data-action="cancel">ยกเลิก</button>`;
    return isChat;
  }
  return "";
}

async function openTaskDetailSheet(taskId){
  let t;
  try{ t = await api(`/tasks/${taskId}`); }catch(e){ toast(e.message); return; }
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">

      </div>

  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  const holder = overlay.querySelector("#td-card");
  holder.appendChild(el(taskCard(t, buildTaskDetailActions(t), {showRequester: state.role !== "USER"})));
  bindTaskDetailActions(holder);
  loadAuthenticatedImages(holder);
  // Any card action that mutates state closes this detail sheet on success via refreshAll's
  // normal re-render; simplest is to just close it after a successful mutation.
  holder.querySelectorAll("[data-action],[data-edit],[data-photo],[data-accept],[data-pause],[data-self-assign],[data-take-over],[data-join],[data-leave],[data-assign],[data-reassign],[data-admin-complete],[data-priority],[data-chat],[data-rate]").forEach(b=>{
    const orig = b.onclick;
    b.onclick = (e)=>{ closeSheet(overlay); if(orig) orig(e); };
  });
}

function relTime(iso){
  const d = new Date(iso);
  const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
  if(diffMin < 1) return "เมื่อสักครู่";
  if(diffMin < 60) return `${diffMin} นาทีที่แล้ว`;
  const diffHr = Math.floor(diffMin / 60);
  if(diffHr < 24) return `${diffHr} ชั่วโมงที่แล้ว`;
  return fmtTime(iso);
}
function notifDayGroup(iso){
  const d = new Date(iso);
  const now = new Date();
  const sameDay = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
  if(sameDay(d, now)) return "วันนี้";
  if(sameDay(d, yesterday)) return "เมื่อวาน";
  return "ก่อนหน้านี้";
}
function notifIcon(n){
  if(n.kind === "chat") return {cls:"chat", emoji:"💬"};
  if(n.kind === "team_chat") return {cls:"chat", emoji:"👥"};
  if(n.message && n.message.startsWith("[Admin]")) return {cls:"admin", emoji:"📢"};
  if(n.message && n.message.includes("ได้รับการแก้ไขแล้ว")) return {cls:"warn", emoji:"⚠️"};
  return {cls:"task", emoji:"📦"};
}

function openNotifications(){
  const hasUnread = state.notifications.some(n=>!n.is_read);
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head">
          <h2>การแจ้งเตือน</h2>
          <div style="display:flex;align-items:center;gap:14px;">
            ${hasUnread ? `<button id="notif-read-all" style="background:none;border:none;color:var(--amber);font-size:12px;font-weight:600;cursor:pointer;padding:0;">อ่านทั้งหมด</button>` : ""}
            <button class="sheet-close">✕</button>
          </div>
        </div>
        <div id="notif-list"></div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  const list = overlay.querySelector("#notif-list");
  if(state.notifications.length === 0){ list.appendChild(el(`<div class="empty">ยังไม่มีการแจ้งเตือน</div>`)); }

  let lastGroup = null;
  state.notifications.forEach(n=>{
    const group = notifDayGroup(n.created_at);
    if(group !== lastGroup){
      list.appendChild(el(`<div class="section-title" style="margin:14px 0 6px;">${group}</div>`));
      lastGroup = group;
    }
    const icon = notifIcon(n);
    const item = el(`<div class="notif-row ${n.is_read ? '' : 'unread'}">
      <div class="notif-icon ${icon.cls}">${icon.emoji}</div>
      <div class="notif-body">
        <div class="notif-msg">${n.message}</div>
        <div class="notif-time">${relTime(n.created_at)}</div>
      </div>
    </div>`);
    // Clicking a notification always navigates to what it's about (task detail,
    // or the task's chat) — read-state is just tracked alongside, not a gate on navigation.
    item.onclick = async ()=>{
      if(!n.is_read){ try{ await api(`/notifications/${n.id}/read`, {method:"POST"}); n.is_read=1; }catch(e){} }
      closeSheet(overlay);
      if(!n.task_id) return;
      if(n.kind === "chat"){ openChatSheet(n.task_id); }
      else{ openTaskDetailSheet(n.task_id); }
    };
    list.appendChild(item);
  });

  const readAllBtn = overlay.querySelector("#notif-read-all");
  if(readAllBtn){
    readAllBtn.onclick = async ()=>{
      const unread = state.notifications.filter(n=>!n.is_read);
      try{
        await Promise.all(unread.map(n=> api(`/notifications/${n.id}/read`, {method:"POST"}).catch(()=>{})));
        unread.forEach(n=> n.is_read = 1);
        overlay.remove();
        openNotifications();
      }catch(e){ toast(e.message); }
    };
  }
}
