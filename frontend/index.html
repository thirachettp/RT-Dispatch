function taskCard(t, actionsHtml, opts={}){
  const cls = statusClass(t.status);
  const showRequester = opts.showRequester;
  // The list card answers "what is on this job", not "who" — so it counts
  // vehicles by type. Names belong in the job's own screen, where there is
  // room for them and the reader is looking at one job rather than scanning.
  const counts = t.driver_counts || {};
  // With many vehicle types in the fleet, spelling out every one would run off
  // the card, so past three it folds into a total the detail screen expands.
  const present = allVehicleTypes(Object.keys(counts)).filter(k=> counts[k]);
  const totalUnits = present.reduce((n, k)=> n + counts[k], 0);
  const crewLabel = !present.length ? null
    : present.length <= 3 ? present.map(k=> `${k} ${counts[k]} คัน`).join(" · ")
    : `${present.length} ประเภท · ${totalUnits} คัน`;

  const facts = [
    cardFact(ICO.box, "พาเลท", t.pallet_qty),
    t.request_type === "Booking" && t.scheduled_at
      ? cardFact(ICO.cal, "นัดหมาย", fmtTime(t.scheduled_at))
      : "",
    cardFact(ICO.clock, "วันที่/เวลา", fmtTime(t.created_at)),
    crewLabel ? cardFact(ICO.truck, "รถที่รับงาน", crewLabel) : "",
    showRequester ? cardFact(ICO.user, "ผู้ขอ", t.requester_name || t.requester_employee_id || "-") : "",
    showRequester ? cardFact(ICO.phone, "ติดต่อ", fmtPhone(t.requester_contact)) : "",
    t.rating ? cardFact(ICO.star, "คะแนน", "★".repeat(t.rating) + "☆".repeat(5 - t.rating)) : "",
  ].filter(Boolean).join("");

  return `
    <div class="card ${cls}" data-id="${t.id}">
      <div class="card-top">
        <span class="task-code mono"><span class="tc-ico">${ICO.box}</span>${t.task_code}</span>
        ${opts.zoneTag ? `<span class="zone-tag ${opts.zoneTag.cls}">${opts.zoneTag.label}</span>` : ""}
        ${opts.queuePos
          ? `<span class="queue-chip">คิวที่ ${opts.queuePos}</span>`
          : `<span class="status-chip"><span class="dot"></span>${STATUS_LABEL[t.status] || t.status}</span>`}
      </div>
      ${t.status === "Waiting" && t.queue_position
        ? `<div class="wait-line">รออยู่ลำดับที่ <b>${t.queue_position}</b>${
             t.queue_total > 1 ? ` จาก ${t.queue_total} คำขอที่รออยู่` : ""}</div>`
        : ""}
      ${t.blocked_reason ? `<div class="blocked-banner">⚠️ ถูกตีกลับ: ${t.blocked_reason}</div>` : ""}
      ${pauseBannerHTML(t)}
      <div class="route">${t.from_location}<span class="arrow">→</span>${t.to_location}
</div>
      <div class="fact-strip">${facts}</div>
      ${t.photo_url ? `<img class="thumb" data-photo-url="${t.photo_url}" />` : ""}
      ${actionsHtml ? `<div class="card-actions">${actionsHtml}</div>` : ""}
    </div>`;
}

// ---------------- Optimistic task actions ----------------
// Applies the expected result to local state and re-renders BEFORE the request
// completes, then reconciles against the server. On a warehouse mobile
// connection this is the difference between a button that feels instant and
// one that feels broken.
const _inFlightActions = new Set();

function findTask(id){ return (state.tasks || []).find(t => String(t.id) === String(id)); }

// Server-side rejections that mean "someone else got there first". These are
// normal in a shared queue, not errors the driver did anything wrong — so they
// get a plain explanation rather than a scary failure message.
function isRaceLoss(err){
  return err && (err.status === 409 || err.status === 400);
}

async function taskAction({id, key, run, patch, successMsg, btn}){
  const lock = `${id}:${key}`;
  if(_inFlightActions.has(lock)) return;   // double-tap / impatient re-tap guard
  _inFlightActions.add(lock);

  const target = findTask(id);
  // Shallow snapshot for rollback. Patches must return NEW arrays rather than
  // mutating in place, or this snapshot would be rolled back into itself.
  const snapshot = target ? {...target} : null;
  let btnLabel = null;
  if(target && patch){
    Object.assign(target, patch(target));
    renderContent();
  } else if(btn){
    // No safe prediction for this action's outcome, so give feedback on the
    // button itself instead of guessing at the card's new state.
    btnLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "กำลังส่ง...";
  }

  try{
    await run();
    toast(successMsg || "สำเร็จ");
    await refreshAll();
  }catch(err){
    if(snapshot){
      const current = findTask(id);
      if(current) Object.assign(current, snapshot);
      renderContent();
    }
    toast(isRaceLoss(err) ? (err.message || "ทำรายการไม่สำเร็จ")
                          : (err.message || "เชื่อมต่อไม่ได้ กรุณาลองใหม่"));
    // Whatever went wrong, our picture of this task is now suspect — the usual
    // cause is that someone else changed it. Pull the truth back down.
    await refreshAll();
  }finally{
    _inFlightActions.delete(lock);
    if(btn && btnLabel !== null){ btn.disabled = false; btn.textContent = btnLabel; }
  }
}

// What each action is expected to do, so the UI can show it immediately.
// Deliberately only covers actions whose result is unambiguous; join and
// take-over depend on server-side eligibility checks, so they show button-level
// feedback instead of a predicted card state.
const OPTIMISTIC_PATCH = {
  "start":    () => ({status: "In Progress"}),
  "complete": () => ({status: "Completed"}),
  "resume":   () => ({status: "In Progress"}),
  "cancel":   () => ({status: "Cancelled"}),
  // Assignment starts the work — there is no accept tap any more, so the card
  // should land on In Progress immediately rather than flashing "Assigned".
  "self-assign": (t) => ({
    status: "In Progress",
    started_at: new Date().toISOString(),
    accepted_at: new Date().toISOString(),
    driver_employee_id: state.employee_id,
    driver_name: (state.me && state.me.full_name) || state.employee_id,
    drivers: [...(t.drivers || []), {
      employee_id: state.employee_id,
      full_name: (state.me && state.me.full_name) || state.employee_id,
      vehicle_code: null,
    }],
  }),
};

function bindCardActions(container){
  container.querySelectorAll("[data-duplicate]").forEach(b=> b.onclick = async (e)=>{
    e.stopPropagation();
    try{
      const t = await api(`/tasks/${b.dataset.duplicate}`);
      const sheetOverlay = b.closest(".sheet-overlay");
      if(sheetOverlay) closeSheet(sheetOverlay);
      openCreateTask(t);
    }catch(err){ toast(err.message); }
  });
  container.querySelectorAll("[data-action]").forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const id = btn.closest(".card").dataset.id;
      const action = btn.dataset.action;
      let url = `/tasks/${id}/${action}`;
      if(action === "cancel"){
        if(!confirm("ยืนยันยกเลิกงานนี้ใช่หรือไม่? การกระทำนี้ย้อนกลับไม่ได้")) return;
        const reason = prompt("เหตุผลในการยกเลิก (ถ้ามี):");
        if(reason === null) return; // user pressed Cancel on the prompt itself
        url = `/tasks/${id}/cancel?reason=${encodeURIComponent(reason)}`;
      }
      await taskAction({
        id, key: action, btn,
        patch: OPTIMISTIC_PATCH[action],
        run: ()=> api(url, {method:"POST"}),
        successMsg: "อัปเดตแล้ว",
      });
    };
  });
  container.querySelectorAll("[data-chat]").forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); openChatSheet(btn.dataset.chat); };
  });
}

// ---------------- USER ----------------
function renderUserTab(main){
  if(state.tab === "tasks"){
    const active = state.tasks.filter(t=>!["Completed","Cancelled"].includes(t.status));
    main.appendChild(el(`<div class="section-title">งานที่กำลังดำเนินการ (${active.length})</div>`));
    if(active.length === 0){ main.appendChild(el(`<div class="empty">ยังไม่มีงาน กดปุ่ม + เพื่อสร้างงานใหม่</div>`)); }
    active.forEach(t=>{
      let actions = `<button class="btn" data-chat="${t.id}">💬 แชท</button>`;
      if(t.status === "Waiting"){
        actions = `<button class="btn" data-edit="${t.id}">แก้ไข</button>
          ${t.blocked_reason ? `<button class="btn amber" data-resubmit="${t.id}">ส่งใหม่</button>` : ""}
          ${actions}
          <button class="btn red" data-action="cancel">ยกเลิก</button>`;
      } else if(t.status === "Assigned"){
        actions = `${actions}<button class="btn red" data-action="cancel">ยกเลิก</button>`;
      }
      main.appendChild(el(taskCard(t, actions)));
    });
    bindCardActions(main);
    main.querySelectorAll("[data-edit]").forEach(b=> b.onclick = ()=> openEditTask(b.dataset.edit));
    main.querySelectorAll("[data-photo]").forEach(b=> b.onclick = ()=> openPhotoUpload(b.dataset.photo));
    main.querySelectorAll("[data-resubmit]").forEach(b=>{
      b.onclick = async ()=>{
        try{ await api(`/tasks/${b.dataset.resubmit}/resubmit`, {method:"POST"}); toast("ส่งงานใหม่แล้ว"); await refreshAll(); }
        catch(e){ toast(e.message); }
      };
    });
    bindCardClickToDetail(main);

    const awaitingReview = state.tasks.filter(t=> t.status === "Completed" && !t.rating);
    main.appendChild(el(`<div class="section-title">งานที่รอรีวิว (${awaitingReview.length})</div>`));
    const reviewWrap = el(`<div></div>`);
    main.appendChild(reviewWrap);
    if(awaitingReview.length === 0){
      reviewWrap.appendChild(el(`<div class="empty">ไม่มีงานที่รอให้คะแนน</div>`));
    } else {
      awaitingReview.forEach(t=>{
        const actions = `<button class="btn amber" data-rate="${t.id}">ให้คะแนน</button><button class="btn" data-chat="${t.id}">💬 แชท</button>`;
        reviewWrap.appendChild(el(taskCard(t, actions)));
      });
    }
    bindCardActions(reviewWrap);
    reviewWrap.querySelectorAll("[data-rate]").forEach(b=> b.onclick = ()=> openRatingSheet(b.dataset.rate));
    bindCardClickToDetail(reviewWrap);
  } else if(state.tab === "history"){
    const done = state.tasks.filter(t=>["Completed","Cancelled"].includes(t.status));
    main.appendChild(el(`<div class="section-title">ประวัติ (${done.length})</div>`));
    if(done.length === 0) main.appendChild(el(`<div class="empty">ยังไม่มีงานที่เสร็จสิ้น</div>`));
    done.forEach(t=>{
      let actions = `<button class="btn" data-chat="${t.id}">💬 แชท</button>`;
      if(t.status === "Completed"){
        actions = (t.rating ? `<span style="font-size:14px;">${"★".repeat(t.rating)}${"☆".repeat(5-t.rating)}</span>` : `<button class="btn amber" data-rate="${t.id}">ให้คะแนน</button>`) + actions;
      }
      main.appendChild(el(taskCard(t, actions)));
    });
    bindCardActions(main);
    main.querySelectorAll("[data-rate]").forEach(b=> b.onclick = ()=> openRatingSheet(b.dataset.rate));
    bindCardClickToDetail(main);
  } else if(state.tab === "profile"){
    renderProfile(main);
  }
}

function openRatingSheet(taskId){
  let selected = 0;
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>ให้คะแนนงานนี้</h2><button class="sheet-close">✕</button></div>
        <div id="rt-stars" class="star-row">
          ${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-n="${n}" aria-label="${n} ดาว">☆</button>`).join("")}
        </div>
        <div id="rt-comment-wrap" style="display:none;">
          <label>ช่วยบอกเราหน่อยว่าเกิดอะไรขึ้น</label>
          <textarea id="rt-comment" rows="2" placeholder="เช่น รอนาน, ของเสียหาย, สื่อสารไม่เข้าใจ"></textarea>
        </div>
        <button class="primary" id="rt-submit">ส่งคะแนน</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  const starsEl = overlay.querySelector("#rt-stars");
  const commentWrap = overlay.querySelector("#rt-comment-wrap");
  // Each star is its own button. The old version was one text node and worked
  // out which star you meant from where your finger landed across the whole
  // box — including its letter-spacing and the empty space either side of the
  // centred text — so taps regularly landed one star off.
  function drawStars(){
    starsEl.querySelectorAll(".star").forEach(b=>{
      const n = Number(b.dataset.n);
      b.textContent = n <= selected ? "★" : "☆";
      b.classList.toggle("on", n <= selected);
      b.setAttribute("aria-pressed", n <= selected ? "true" : "false");
    });
    commentWrap.style.display = selected > 0 ? "block" : "none";
  }
  starsEl.querySelectorAll(".star").forEach(b=>{
    b.onclick = ()=>{ selected = Number(b.dataset.n); drawStars(); };
  });
  overlay.querySelector("#rt-submit").onclick = async ()=>{
    if(selected < 1){ toast("กรุณาเลือกจำนวนดาว"); return; }
    try{
      await api(`/tasks/${taskId}/rating`, {method:"POST", body: JSON.stringify({
        rating: selected, comment: overlay.querySelector("#rt-comment").value.trim() || null,
      })});
      closeSheet(overlay);
      toast("ขอบคุณสำหรับคะแนน");
      await refreshAll();
    }catch(e){ toast(e.message); }
  };
}

function locationPatternRegex(zone){
  try{ return new RegExp(zone.code_pattern, "i"); }catch(e){ return /.*/; }
}

// Renders a zone-select + zone-specific sub-picker into `container`.
// The 6 known zone_keys get a hand-built picker matching their real layout;
// any other zone (added later by Admin) falls back to a generic
// pattern-validated text field, with chip-based multi-add if allow_multiple.
function buildLocationPicker(container, zones, initial){
  let currentZone = (initial && zones.find(z=> z.zone_key === initial.zone)) || zones[0];
  let chips = [];
  let singleValue = "";
  if(initial && currentZone){
    if(currentZone.allow_multiple) chips = (initial.value || "").split(",").filter(Boolean);
    else singleValue = initial.value || "";
  }

  container.innerHTML = "";
  const wrap = el(`<div>
    <select class="zp-zone"></select>
    <div class="zp-body" style="margin-top:8px;"></div>
    <div class="zp-err field-note" style="color:var(--red);"></div>
  </div>`);
  container.appendChild(wrap);
  const zoneSel = wrap.querySelector(".zp-zone");
  zones.forEach(z=> zoneSel.appendChild(el(`<option value="${z.zone_key}" ${currentZone.zone_key===z.zone_key?"selected":""}>${z.zone_name_th}</option>`)));

  container.getLocationValue = ()=> ({ zone: currentZone.zone_key, value: currentZone.allow_multiple ? chips.join(",") : singleValue });

  function renderBody(){
    const body = wrap.querySelector(".zp-body");
    body.innerHTML = "";
    wrap.querySelector(".zp-err").textContent = "";
    const zk = currentZone.zone_key;
    if(zk === "CONCRETE_YARD"){
      const sel = el("<select></select>");
      for(let i=1;i<=7;i++) sel.appendChild(new Option("ลานปูน-"+i, i));
      const m = singleValue.match(/-(\d+)$/);
      if(m) sel.value = m[1];
      const upd = ()=>{ singleValue = "ลานปูน-"+sel.value; };
      sel.onchange = upd; upd();
      body.appendChild(sel);
    } else if(zk === "GATE"){
      // One job can call at several doors, so this builds up a list. There is
      // no separate "add" button: the sheet's own confirm button renames
      // itself to "เพิ่มจุดนี้" while a number is sitting in the box, so there
      // is one button to look for instead of two that do nearly the same job.
      const row = el(`<div><input type="number" min="1" max="85" placeholder="เลข 1-85" /></div>`);
      const hint = el(`<div class="field-note"></div>`);
      const chipRow = el(`<div class="chip-row" style="margin-top:8px;"></div>`);
      function drawChips(){
        chipRow.innerHTML = "";
        chips.forEach((c,i)=>{
          const chip = el(`<span class="chip active" style="cursor:default;">${c} <span style="cursor:pointer;margin-left:4px;">✕</span></span>`);
          chip.querySelector("span").onclick = ()=>{
            chips.splice(i,1); drawChips();
            if(container.onPendingChange) container.onPendingChange();
          };
          chipRow.appendChild(chip);
        });
      }
      const gateInput = row.querySelector("input");
      container.addPendingEntry = ()=>{
        const n = parseInt(gateInput.value||0);
        if(n<1||n>85){ wrap.querySelector(".zp-err").textContent = "กรอกเลข 1-85"; return "invalid"; }
        const v = "ประตู-"+n;
        if(chips.includes(v)){ wrap.querySelector(".zp-err").textContent = "ประตูนี้ถูกเพิ่มไปแล้ว"; return "dup"; }
        chips.push(v);
        wrap.querySelector(".zp-err").textContent = "";
        gateInput.value = ""; hint.textContent = ""; drawChips();
        if(container.onPendingChange) container.onPendingChange();
        return "ok";
      };
      gateInput.addEventListener("input", ()=>{
        const raw = gateInput.value.trim();
        const n = parseInt(raw||0);
        hint.textContent = !raw ? "" : (n>=1 && n<=85) ? (n<=58 ? "ขาเข้า (In)" : "ขาออก (Out)") : "กรอกเลข 1-85";
        if(container.onPendingChange) container.onPendingChange();
      });
      gateInput.addEventListener("keydown", (ev)=>{
        if(ev.key === "Enter"){ ev.preventDefault(); container.addPendingEntry(); }
      });
      drawChips();
      body.appendChild(row); body.appendChild(hint); body.appendChild(chipRow);
    } else if(currentZone.no_location){
      // The zone is the whole answer — the sort yard, a pallet pick-up. Used
      // to be a branch hard-coded on SORT_YARD; it is a zone flag now, so an
      // admin can give a new zone the same behaviour without a deploy.
      singleValue = currentZone.zone_name_th;
      body.appendChild(el(`<div class="field-note">จุดเดียว ไม่ต้องระบุตำแหน่งเพิ่ม</div>`));
    } else if(zk === "MEZZANINE"){
      const s1 = el("<select></select>");
      for(let i=1;i<=4;i++) s1.appendChild(new Option("ชั้น "+i, i));
      const s2 = el(`<select style="margin-top:8px;"><option value="ซ้าย (Cross dock)">ซ้าย (Cross dock)</option><option value="ขวา (Double Deep)">ขวา (Double Deep)</option></select>`);
      const fm = singleValue.match(/^Mezzanine-(\d)-(.+)$/);
      if(fm){ s1.value = fm[1]; s2.value = fm[2]; }
      const upd = ()=>{ singleValue = "Mezzanine-"+s1.value+"-"+s2.value; };
      s1.onchange = upd; s2.onchange = upd; upd();
      body.appendChild(s1); body.appendChild(s2);
    } else if(currentZone.free_text){
      // Free-text zones (e.g. "พาเลทเปล่า") skip pattern validation entirely —
      // any non-empty description is accepted, so no ✕/toUpperCase gymnastics.
      if(currentZone.allow_multiple){
        const row = el(`<div><input placeholder="พิมพ์รายละเอียด" /></div>`);
        const chipRow = el(`<div class="chip-row" style="margin-top:8px;"></div>`);
        function drawChips(){
          chipRow.innerHTML = "";
          chips.forEach((c,i)=>{
            const chip = el(`<span class="chip active" style="cursor:default;">${c} <span style="cursor:pointer;margin-left:4px;">✕</span></span>`);
            chip.querySelector("span").onclick = ()=>{
              chips.splice(i,1); drawChips();
              if(container.onPendingChange) container.onPendingChange();
            };
            chipRow.appendChild(chip);
          });
        }
        const ftInput = row.querySelector("input");
        container.addPendingEntry = ()=>{
          const v = ftInput.value.trim();
          if(!v) return "empty";
          if(chips.includes(v)){ wrap.querySelector(".zp-err").textContent = "รายการนี้ถูกเพิ่มไปแล้ว"; return "dup"; }
          chips.push(v);
          wrap.querySelector(".zp-err").textContent = "";
          ftInput.value = ""; drawChips();
          if(container.onPendingChange) container.onPendingChange();
          return "ok";
        };
        ftInput.addEventListener("input", ()=>{ if(container.onPendingChange) container.onPendingChange(); });
        ftInput.addEventListener("keydown", (ev)=>{
          if(ev.key === "Enter"){ ev.preventDefault(); container.addPendingEntry(); }
        });
        drawChips();
        body.appendChild(row); body.appendChild(chipRow);
      } else {
        const inp = el(`<textarea rows="2" placeholder="${currentZone.example_code ? 'เช่น ' + currentZone.example_code : 'พิมพ์รายละเอียด'}">${singleValue}</textarea>`);
        inp.oninput = ()=>{ singleValue = inp.value.trim(); };
        body.appendChild(inp);
      }
    } else if(currentZone.allow_multiple){
      // No separate "add" button: the sheet's own confirm button does both
      // jobs and renames itself, so there is one button to look for instead
      // of two that do nearly the same thing.
      const row = el(`<div style="display:flex;gap:8px;"><input placeholder="${currentZone.example_code ? 'เช่น ' + currentZone.example_code + ' ' : ''}(วางจาก Excel ได้)" /></div>`);
      const chipRow = el(`<div class="chip-row"></div>`);
      function drawChips(){
        chipRow.innerHTML = "";
        chips.forEach((c,i)=>{
          const chip = el(`<span class="chip active" style="cursor:default;">${c} <span style="cursor:pointer;margin-left:4px;">✕</span></span>`);
          chip.querySelector("span").onclick = ()=>{ chips.splice(i,1); drawChips(); };
          chipRow.appendChild(chip);
        });
      }
      function tryAdd(v){
        if(!locationPatternRegex(currentZone).test(v)) return "invalid";
        if(chips.includes(v)) return "dup";
        chips.push(v);
        return "ok";
      }
      // Exposed so the sheet's confirm button can add the pending entry.
      container.addPendingEntry = ()=>{
        const inp = row.querySelector("input");
        const v = inp.value.trim().toUpperCase();
        if(!v) return "empty";
        const result = tryAdd(v);
        if(result === "invalid"){ wrap.querySelector(".zp-err").textContent = "รูปแบบไม่ถูกต้อง ตัวอย่าง: "+currentZone.example_code; return "invalid"; }
        if(result === "dup"){ wrap.querySelector(".zp-err").textContent = "รายการนี้ถูกเพิ่มไปแล้ว"; return "dup"; }
        wrap.querySelector(".zp-err").textContent = "";
        inp.value = ""; drawChips();
        if(container.onPendingChange) container.onPendingChange();
        return "ok";
      };
      row.querySelector("input").addEventListener("input", ()=>{ if(container.onPendingChange) container.onPendingChange(); });
      row.querySelector("input").addEventListener("keydown", (ev)=>{
        if(ev.key === "Enter"){ ev.preventDefault(); container.addPendingEntry(); }
      });
      // Support pasting a list copied from Excel (newline/tab/comma separated).
      row.querySelector("input").addEventListener("paste", (e)=>{
        const text = (e.clipboardData || window.clipboardData).getData("text");
        if(!text || !/[\n\r\t,]/.test(text)) return; // single value: let default paste behavior handle it
        e.preventDefault();
        const tokens = text.split(/[\n\r\t,]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
        let added=0, dup=0, invalid=0;
        tokens.forEach(v=>{
          const r = tryAdd(v);
          if(r==="ok") added++; else if(r==="dup") dup++; else invalid++;
        });
        drawChips();
        const msgs = [];
        if(added) msgs.push(`เพิ่ม ${added} รายการ`);
        if(dup) msgs.push(`ข้ามรายการซ้ำ ${dup}`);
        if(invalid) msgs.push(`รูปแบบผิด ${invalid} รายการ`);
        wrap.querySelector(".zp-err").textContent = msgs.join(" · ");
        wrap.querySelector(".zp-err").style.color = invalid || dup ? "var(--amber)" : "var(--green)";
      });
      drawChips();
      body.appendChild(row); body.appendChild(chipRow);
    } else {
      const inp = el(`<input placeholder="${currentZone.example_code ? 'เช่น ' + currentZone.example_code : ''}" value="${singleValue}" />`);
      inp.oninput = ()=>{ singleValue = inp.value.trim().toUpperCase(); };
      body.appendChild(inp);
    }
  }
  zoneSel.onchange = ()=>{
    currentZone = zones.find(z=> z.zone_key === zoneSel.value);
    chips = []; singleValue = "";
    container.addPendingEntry = null;   // rebuilt below only for multi-entry zones
    renderBody();
    if(container.onPendingChange) container.onPendingChange();
  };
  renderBody();
}

// Zones that may be a job's destination. Empty pallets are collected, never
// delivered, so offering the zone there only produced a refusal on submit.
function destinationZones(zones){
  return (zones || []).filter(z=> !z.origin_only);
}

function displayZoneValue(zones, val){
  if(!val || !val.value) return null;
  const z = zones.find(x=> x.zone_key === val.zone);
  return `${z ? z.zone_name_th : val.zone}: ${val.value}`;
}

function openLocationPickerPopup(title, zones, initial, onConfirm){
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>${title}</h2><button class="sheet-close">✕</button></div>
        <div id="lp-picker-wrap"></div>
        <button class="primary" id="lp-confirm">ยืนยันจุดนี้</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  const wrap = overlay.querySelector("#lp-picker-wrap");
  const confirmBtn = overlay.querySelector("#lp-confirm");

  function syncConfirmLabel(){
    const inp = wrap.querySelector("input");
    const pending = wrap.addPendingEntry && inp && inp.value.trim();
    confirmBtn.textContent = pending ? "เพิ่มจุดนี้" : "ยืนยันจุดนี้";
    confirmBtn.classList.toggle("adding", !!pending);
  }
  wrap.onPendingChange = syncConfirmLabel;

  buildLocationPicker(wrap, zones, initial);
  syncConfirmLabel();

  confirmBtn.onclick = ()=>{
    // Something typed but not yet added: the tap means "add it".
    const inp = wrap.querySelector("input");
    if(wrap.addPendingEntry && inp && inp.value.trim()){
      wrap.addPendingEntry();
      syncConfirmLabel();
      return;
    }
    const val = wrap.getLocationValue && wrap.getLocationValue();
    if(!val || !val.value){ toast("กรุณาระบุตำแหน่งให้ครบ"); return; }
    onConfirm(val);
    closeSheet(overlay);
  };
}

function openCreateTask(prefill){
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>สร้างงานใหม่</h2><button class="sheet-close">✕</button></div>
        ${BOOKING_ENABLED ? `
        <label>ประเภทคำขอ</label>
        <select id="ct-type"><option value="Request Now">ขอทันที</option><option value="Booking">จองล่วงหน้า</option></select>
        <div id="ct-booking-wrap" style="display:none;">
          <label>วันเวลาที่ต้องการ</label>
          <input id="ct-scheduled" type="datetime-local" />
        </div>` : ""}
        <label>BU</label>
        <select id="ct-bu">${BU_LIST.map(b=>`<option value="${b}">${b}</option>`).join("")}</select>
        <label for="ct-cc">Cost center ของงานนี้ (5 หลัก)</label>
        <input id="ct-cc" maxlength="5" inputmode="numeric"
               value="${(state.me && state.me.cost_center) || ''}"
               placeholder="เช่น 12345" />
        <div class="field-note">${(state.me && state.me.cost_center)
          ? "เติมจากโปรไฟล์ของคุณให้แล้ว แก้ได้ถ้างานนี้ลงบัญชีหน่วยอื่น"
          : "บัญชีของคุณไม่มี cost center กรุณาระบุของหน่วยที่จะลงบัญชีงานนี้"}</div>
        <div id="ct-driver-avail" class="field-note" style="margin-top:8px;">กำลังเช็คจำนวนคนขับว่าง...</div>
        <div class="grid2">
          <div>
            <label>จุดต้นทาง</label>
            <button type="button" class="btn" id="ct-from-btn" style="width:100%;text-align:left;">เลือกจุดต้นทาง</button>
          </div>
          <div>
            <label>จุดปลายทาง</label>
            <button type="button" class="btn" id="ct-to-btn" style="width:100%;text-align:left;">เลือกจุดปลายทาง</button>
          </div>
        </div>
        <label style="margin-top:14px;">จำนวนพาเลท</label>
        <input id="ct-pallet" type="number" min="1" step="1" placeholder="จำนวนพาเลท" />

        <label>หมายเหตุ</label>
        <textarea id="ct-remark" rows="2" placeholder="ไม่บังคับ"></textarea>
        <button class="primary" id="ct-submit">ส่งคำขอ</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  if(BOOKING_ENABLED){
    overlay.querySelector("#ct-type").onchange = (e)=>{
      overlay.querySelector("#ct-booking-wrap").style.display = e.target.value === "Booking" ? "block" : "none";
    };
  }

  // Let a User see at a glance whether a driver is likely free before they
  // even submit — the actual "might take a while" warning still comes back
  // from the server after creating, since driver status can change in the
  // few seconds it takes to fill out the rest of the form.
  api("/drivers/availability-summary").then(s=>{
    const box = overlay.querySelector("#ct-driver-avail");
    box.textContent = `คนขับว่างตอนนี้ ${s.available} คน (ไม่ว่าง ${s.busy} · ทั้งหมด ${s.total} คน)`;
    if(s.available === 0) box.style.color = "var(--warn)";
  }).catch(()=>{ overlay.querySelector("#ct-driver-avail").textContent = ""; });

  let fromValue = null, toValue = null, zonesCache = null;
  async function ensureZones(){ if(!zonesCache) zonesCache = await api("/zones"); return zonesCache; }
  const fromBtn = overlay.querySelector("#ct-from-btn");
  const toBtn = overlay.querySelector("#ct-to-btn");
  fromBtn.onclick = async ()=>{
    const zones = await ensureZones();
    openLocationPickerPopup("จุดต้นทาง", zones, fromValue, (val)=>{
      fromValue = val;
      fromBtn.textContent = displayZoneValue(zones, val);
    });
  };
  toBtn.onclick = async ()=>{
    const zones = await ensureZones();
    openLocationPickerPopup("จุดปลายทาง", destinationZones(zones), toValue, (val)=>{
      toValue = val;
      toBtn.textContent = displayZoneValue(zones, val);
    });
  };

  // Pre-fill from an earlier task ("create from a previous task") — same
  // sheet, just seeded with that task's values so the person only has to
  // change what's different this time.
  if(prefill){
    overlay.querySelector("#ct-bu").value = prefill.bu || BU_LIST[0];
    overlay.querySelector("#ct-remark").value = prefill.remark || "";
    document.getElementById("ct-pallet").value = prefill.pallet_qty || "";
    ensureZones().then(zones=>{
      fromValue = {zone: prefill.from_zone, value: prefill.from_location};
      toValue = {zone: prefill.to_zone, value: prefill.to_location};
      fromBtn.textContent = displayZoneValue(zones, fromValue);
      toBtn.textContent = displayZoneValue(zones, toValue);
    });
  }

  overlay.querySelector("#ct-submit").onclick = async ()=>{
    // With booking switched off these two controls are not in the sheet at
    // all, so read them defensively — every job is simply an immediate one.
    const typeEl = overlay.querySelector("#ct-type");
    const schedEl = overlay.querySelector("#ct-scheduled");
    const reqType = typeEl ? typeEl.value : "Request Now";
    const scheduled = schedEl ? schedEl.value : "";
    if(reqType === "Booking" && !scheduled){ toast("กรุณาระบุวันเวลานัดหมาย"); return; }
    // Checked in the order the fields appear, so the message always points at
    // the first thing still missing as you read down the sheet.
    const costCenter = overlay.querySelector("#ct-cc").value.trim();
    if(!/^\d{5}$/.test(costCenter)){ toast("cost center ต้องเป็นตัวเลข 5 หลัก"); return; }
    if(!fromValue || !fromValue.value){ toast("กรุณาเลือกจุดต้นทาง"); return; }
    if(!toValue || !toValue.value){ toast("กรุณาเลือกจุดปลายทาง"); return; }
    // The field now starts empty, so an empty one is a real mistake rather
    // than someone clearing a default — say so instead of silently sending 1.
    const palletQty = parseInt(overlay.querySelector("#ct-pallet").value, 10);
    if(!palletQty || palletQty < 1){ toast("กรุณาระบุจำนวนพาเลท"); return; }
    try{
      const result = await api("/tasks", {method:"POST", body: JSON.stringify({
        request_type: reqType,
        scheduled_at: reqType === "Booking" ? scheduled : null,
        bu: overlay.querySelector("#ct-bu").value,
        cost_center: costCenter,
        from_zone: fromValue.zone, from_location: fromValue.value,
        to_zone: toValue.zone, to_location: toValue.value,
        pallet_qty: palletQty,
        remark: overlay.querySelector("#ct-remark").value,
      })});
      closeSheet(overlay);
      toast(result.warning ? `สร้างงานสำเร็จ — ${result.warning}` : "สร้างงานสำเร็จ");
      await refreshAll();
    }catch(e){ toast(e.message); }
  };

function openEditTask(taskId){
  const t = state.tasks.find(x=> String(x.id) === String(taskId));
  if(!t) return;
  const isBooking = t.request_type === "Booking";
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>แก้ไขงาน ${t.task_code}</h2><button class="sheet-close">✕</button></div>
        <div class="field-note">แก้ไขได้เฉพาะขณะสถานะ "รอดำเนินการ" เท่านั้น</div>
        ${isBooking ? `<label>วันเวลานัดหมาย</label><input id="et-scheduled" type="datetime-local" value="${(t.scheduled_at||'').slice(0,16)}" />` : ""}
        <div class="grid2">
          <div>
            <label>จุดต้นทาง</label>
            <button type="button" class="btn" id="et-from-btn" style="width:100%;text-align:left;">กำลังโหลด...</button>
          </div>
          <div>
            <label>จุดปลายทาง</label>
            <button type="button" class="btn" id="et-to-btn" style="width:100%;text-align:left;">กำลังโหลด...</button>
          </div>
        </div>
        <label style="margin-top:14px;">จำนวนพาเลท</label>
        <input id="et-pallet" type="number" min="1" step="1" value="${t.pallet_qty}" />

        <label>หมายเหตุ</label>
        <textarea id="et-remark" rows="2">${t.remark || ''}</textarea>
        <button class="primary" id="et-submit">บันทึกการแก้ไข</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };

  let fromValue = {zone: t.from_zone, value: t.from_location};
  let toValue = {zone: t.to_zone, value: t.to_location};
  let zonesCache = null;
  const fromBtn = overlay.querySelector("#et-from-btn");
  const toBtn = overlay.querySelector("#et-to-btn");
  async function ensureZones(){ if(!zonesCache) zonesCache = await api("/zones"); return zonesCache; }
  (async ()=>{
    try{
      const zones = await ensureZones();
      fromBtn.textContent = displayZoneValue(zones, fromValue) || "เลือกจุดต้นทาง";
      toBtn.textContent = displayZoneValue(zones, toValue) || "เลือกจุดปลายทาง";
    }catch(e){ toast(e.message); }
  })();
  fromBtn.onclick = async ()=>{
    const zones = await ensureZones();
    openLocationPickerPopup("จุดต้นทาง", zones, fromValue, (val)=>{
      fromValue = val;
      fromBtn.textContent = displayZoneValue(zones, val);
    });
  };
  toBtn.onclick = async ()=>{
    const zones = await ensureZones();
    openLocationPickerPopup("จุดปลายทาง", destinationZones(zones), toValue, (val)=>{
      toValue = val;
      toBtn.textContent = displayZoneValue(zones, val);
    });
  };

  overlay.querySelector("#et-submit").onclick = async ()=>{
    if(!fromValue || !fromValue.value){ toast("กรุณาเลือกจุดต้นทาง"); return; }
    if(!toValue || !toValue.value){ toast("กรุณาเลือกจุดปลายทาง"); return; }
    try{
      const body = {
        from_zone: fromValue.zone, from_location: fromValue.value,
        to_zone: toValue.zone, to_location: toValue.value,
        pallet_qty: parseInt(overlay.querySelector("#et-pallet").value),
        remark: overlay.querySelector("#et-remark").value,
      };
      if(isBooking){ body.scheduled_at = overlay.querySelector("#et-scheduled").value; }
      await api(`/tasks/${taskId}`, {method:"PUT", body: JSON.stringify(body)});
      closeSheet(overlay);
      toast("บันทึกแล้ว");
      await refreshAll();
    }catch(e){ toast(e.message); }
  };
}

// Signing in on a phone and a shared tablet at the same time is normal in the
// warehouse, so this is the one place that shows how many devices hold the
// account — and the way to shut them all out if one goes missing.
async function renderSessionsSection(card){
  let rows;
  try{
    rows = await api("/auth/sessions", {background:true});
  }catch(e){
    card.innerHTML = "";
    card.appendChild(el(`<div class="err">${e.message}</div>`));
    return;
  }
  card.innerHTML = "";
  card.appendChild(el(`<div class="field-note" style="margin-bottom:10px;line-height:1.6;">
    เข้าสู่ระบบพร้อมกันได้หลายเครื่อง ไม่ถูกเตะออกเหมือนเดิม
    ถ้าเครื่องไหนหายหรือเคยให้คนอื่นยืมใช้ ให้กดออกจากระบบทุกเครื่อง แล้วเข้าใหม่เฉพาะเครื่องที่ใช้อยู่
  </div>`));
  rows.forEach(r=>{
    card.appendChild(el(`<div class="as-d">
      <span>${r.device}${r.current ? ` <span class="badge ok">เครื่องนี้</span>` : ""}</span>
      <b>${fmtTime(r.created_at)}</b>
    </div>`));
  });
  if(rows.length > 1){
    const btn = el(`<button class="btn red" style="width:100%;margin-top:12px;">ออกจากระบบทุกเครื่อง (${rows.length})</button>`);
    btn.onclick = async ()=>{
      if(!confirm(`ออกจากระบบทั้ง ${rows.length} เครื่อง รวมเครื่องนี้ด้วย ใช่หรือไม่?`)) return;
      try{
        await api("/auth/logout-all", {method:"POST"});
        toast("ออกจากระบบทุกเครื่องแล้ว");
        logout();
      }catch(e){ toast(e.message); }
    };
    card.appendChild(btn);
  }
}

// Every failure mode below used to surface as the same silence. Each state is
// now named explicitly, with the specific next step for that state, because
// "notifications don't work" is otherwise undebuggable from the driver's side.
function pushDiagnosticsHTML(status){
  const rows = [
    ["ติดตั้งลงหน้าจอโฮม", isStandalone() ? "✅ ใช่" : (isIOS() ? "❌ ยัง (จำเป็นบน iPhone)" : "— ไม่จำเป็น")],
    ["สิทธิ์แจ้งเตือน", ("Notification" in window)
      ? ({granted:"✅ อนุญาตแล้ว", denied:"❌ ถูกปฏิเสธ", default:"⚠️ ยังไม่ได้ถาม"}[Notification.permission] || Notification.permission)
      : "❌ เบราว์เซอร์ไม่รองรับ"],
    ["ลงทะเบียนกับเซิร์ฟเวอร์", status && status.subscribed ? "✅ แล้ว" : "❌ ยัง"],
    ["เซิร์ฟเวอร์พร้อมส่ง", status && status.available ? "✅ พร้อม" : "❌ ไม่พร้อม"],
  ];
  return `<div style="font-size:12px;line-height:1.9;margin-bottom:10px;">
    ${rows.map(([k,v])=>`<div style="display:flex;justify-content:space-between;gap:10px;">
      <span style="color:var(--ink-dim);">${k}</span><span>${v}</span></div>`).join("")}
  </div>`;
}

async function renderPushSection(pushCard){
  pushCard.innerHTML = "";
  if(!pushSupported()){
    pushCard.appendChild(el(`<div class="field-note">เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือนแบบ Push</div>`));
    if(isIOS()){
      pushCard.appendChild(el(`<div class="field-note">บน iPhone ต้องใช้ Safari และต้อง "เพิ่มลงในหน้าจอโฮม" ก่อน แล้วเปิดแอปจากไอคอนนั้น</div>`));
    }
    return;
  }
  if(location.protocol !== "https:" && location.hostname !== "localhost"){
    pushCard.appendChild(el(`<div class="field-note">ต้องเปิดผ่าน HTTPS ถึงจะเปิดแจ้งเตือนได้ (ตอนนี้เปิดผ่าน HTTP ธรรมดา) — ถ้าเครื่อง Server ตั้งค่า HTTPS ไว้แล้ว ลองเข้าผ่านลิงก์ https:// แทน</div>`));
    return;
  }
  let status;
  try{ status = await api("/push/status", {background:true}); }catch(e){ status = {available:false, subscribed:false}; }

  pushCard.appendChild(el(pushDiagnosticsHTML(status)));

  if(!status.available){
    pushCard.appendChild(el(`<div class="field-note">เซิร์ฟเวอร์ยังไม่ได้ตั้งค่า Web Push</div>`));
    return;
  }
  // iOS: a Safari tab can never subscribe. Say so plainly instead of showing a
  // button that is guaranteed to fail.
  if(isIOS() && !isStandalone()){
    pushCard.appendChild(el(`<div class="field-note" style="color:var(--warn);">
      บน iPhone ต้อง "เพิ่มลงในหน้าจอโฮม" ก่อน แล้ว<b>เปิดแอปจากไอคอนบนหน้าจอโฮม</b> จึงจะเปิดแจ้งเตือนได้<br>
      (สิทธิ์ที่เคยกดอนุญาตใน Safari จะไม่ถูกนำมาใช้ ต้องกดอนุญาตใหม่ในแอปที่ติดตั้งแล้ว)
    </div>`));
    return;
  }
  const perm = Notification.permission;
  if(perm === "denied"){
    pushCard.appendChild(el(`<div class="field-note">คุณเคยปฏิเสธการแจ้งเตือนไว้ — ต้องไปเปิดเองในตั้งค่าเครื่อง/เบราว์เซอร์ (Settings → Notifications) แล้วกลับมาเปิดใหม่ที่นี่</div>`));
    return;
  }
  const btn = el(`<button class="btn ${status.subscribed ? 'red' : 'amber'}" style="width:100%;">
    ${status.subscribed ? 'ปิดการแจ้งเตือน' : 'เปิดการแจ้งเตือน'}
  </button>`);
  pushCard.appendChild(el(`<div class="field-note" style="margin-bottom:10px;">รับแจ้งเตือนแม้ปิดแอปอยู่ (มือถือ iOS ต้อง "เพิ่มลงหน้าจอโฮม" ก่อนถึงจะใช้ได้)</div>`));
  pushCard.appendChild(btn);
  const resultBox = el(`<div id="push-test-result" style="margin-top:10px;"></div>`);
  if(status.subscribed){
    // Subscribing successfully is not proof that delivery works — an expired
    // VAPID signature or a revoked subscription both look identical from here
    // until an actual send is attempted.
    const testBtn = el(`<button class="btn" style="width:100%;margin-top:8px;">ทดสอบส่งแจ้งเตือน</button>`);
    testBtn.onclick = ()=> testPushAndShowResult(resultBox);
    pushCard.appendChild(testBtn);
  }
  pushCard.appendChild(resultBox);
  btn.onclick = async ()=>{
    resultBox.innerHTML = "";
    try{
      if(status.subscribed){
        await unsubscribeFromPush();
        localStorage.setItem(NOTIF_PROMPTED_KEY, "true"); // don't auto-prompt again after an explicit opt-out
        await renderPushSection(pushCard);
        toast("ปิดการแจ้งเตือนแล้ว");
      } else {
        await subscribeToPush();
        await renderPushSection(pushCard);
        await testPushAndShowResult(document.getElementById("push-test-result"));
      }
    }catch(e){ toast(e.message || "ไม่สำเร็จ"); }
  };
}

// Sends a real test push right after subscribing and shows the honest result
// inline — "enabled" alone doesn't prove delivery actually works, and the
// BadJwtToken issue this app has hit before would otherwise stay invisible
// until someone noticed they never got a real notification.
async function testPushAndShowResult(container){
  if(!container) return;
  container.innerHTML = `<div class="field-note">กำลังทดสอบส่งการแจ้งเตือน...</div>`;
  try{
    await api("/push/test", {method:"POST"});
    container.innerHTML = `<div class="field-note" style="color:var(--green);">✅ ทดสอบสำเร็จ! คุณควรเห็นการแจ้งเตือนขึ้นมาแล้ว (เช็คที่แถบแจ้งเตือนของเครื่อง/เบราว์เซอร์)</div>`;
  }catch(e){
    container.innerHTML = `<div class="field-note" style="color:var(--red);">⚠️ เปิดใช้งานแล้ว แต่ทดสอบส่งไม่สำเร็จ: ${e.message}</div>`;
  }
}

function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c=> c.charCodeAt(0)));
}

async function subscribeToPush(){
  const reg = await navigator.serviceWorker.ready;
  const perm = await Notification.requestPermission();
  if(perm !== "granted") throw new Error("ไม่ได้รับอนุญาตให้แจ้งเตือน");
  const { publicKey } = await api("/push/vapid-public-key");
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(publicKey),
  });
  const json = sub.toJSON();
  await api("/push/subscribe", {method:"POST", body: JSON.stringify({endpoint: json.endpoint, keys: json.keys})});
}

// Runs on every sign-in. Two things used to go wrong without it, both silent:
//
//   1. A shared phone or tablet. The subscription is stored against whoever
//      turned notifications on, and signing out never touched it — so the
//      device kept receiving the previous person's notifications, and the
//      person now holding it received none.
//   2. A browser that dropped the subscription but kept the permission. The
//      banner never appeared (permission was no longer "default") and Profile
//      just showed "เปิดการแจ้งเตือน" with no hint anything was wrong.
//
// Nothing here can show a prompt: it only runs once permission is already
// granted, so it is safe on iOS, where a prompt outside a tap is refused.
async function ensurePushRegistration(){
  if(!pushSupported()) return false;
  if(location.protocol !== "https:" && location.hostname !== "localhost") return false;
  if(Notification.permission !== "granted") return false;
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      const { publicKey } = await api("/push/vapid-public-key");
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });
    }
    const json = sub.toJSON();
    // The server moves the row onto the current user, so the device follows
    // whoever is signed in rather than whoever first enabled it.
    await api("/push/subscribe", {method:"POST", body: JSON.stringify({endpoint: json.endpoint, keys: json.keys})});
    return true;
  }catch(e){ return false; }
}

async function unsubscribeFromPush(){
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if(sub){
    await api("/push/unsubscribe", {method:"POST", body: JSON.stringify({endpoint: sub.endpoint})});
    await sub.unsubscribe();
  }
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("/service-worker.js").catch(()=>{ /* non-fatal */ });
  });
}

// ---------------- DRIVER ----------------
function renderDriverTab(main){
  if(state.tab === "available"){
    const isMine = (t)=> (t.drivers||[]).some(d=> d.employee_id === state.employee_id);
    const myRow = (t)=> (t.drivers||[]).find(d=> d.employee_id === state.employee_id);
    const all = state.tasks.filter(t=> isMine(t) && !["Completed","Cancelled"].includes(t.status));
    // A dispatcher can hand over a batch of jobs at once. Exactly one is the
    // job in hand; the rest wait in the queue and start by themselves as each
    // one finishes, so this screen has to say plainly which is which.
    const mine = all.filter(t=> { const r = myRow(t); return !r || r.working_on_it !== false; });
    const queued = all.filter(t=> { const r = myRow(t); return r && r.working_on_it === false; });
    const meVehicle = state.vehicles.find(v=> v.id === (state.me && state.me.checked_in_vehicle_id));

    // ---------------- 1. งานของฉันวันนี้ ----------------
    main.appendChild(el(`<div class="section-title" style="margin-top:0;">งานของฉันวันนี้</div>`));

    const statsCard = el(`<div class="card" id="today-stats-card" style="cursor:pointer;">
      <div class="stat-grid" id="today-stats-grid"><div class="empty">กำลังโหลด...</div></div>
      <div class="field-note" style="margin-top:6px;">แตะเพื่อดูประวัติทั้งหมด ›</div>
    </div>`);
    main.appendChild(statsCard);
    statsCard.onclick = ()=>{ setTab("history"); renderContent(); };
    (async ()=>{
      try{
        const s = await api("/drivers/me/stats?period=day", {background:true});
        const g = statsCard.querySelector("#today-stats-grid");
        if(g) g.outerHTML = `<div class="stat-grid" id="today-stats-grid">
          <div class="stat"><div class="n">${s.task_count}</div><div class="l">งานเสร็จวันนี้</div></div>
          <div class="stat"><div class="n">${s.pallet_total}</div><div class="l">พาเลทวันนี้</div></div>
        </div>`;
      }catch(e){ /* stats are informational */ }
    })();

    // A job handed to this driver before they boarded anything. They cannot
    // work it until they pick a vehicle, so this sits above the job itself
    // and says which type to board — the system already knows.
    const awaiting = mine.filter(t=> (t.drivers||[]).some(
      d=> d.employee_id === state.employee_id && d.awaiting_vehicle));
    if(awaiting.length){
      const want = [...new Set(awaiting.map(t=>{
        const me = (t.drivers||[]).find(d=> d.employee_id === state.employee_id);
        return me && me.vehicle_type;
      }).filter(Boolean))];
      const prompt = el(`<div class="card" style="border:1px solid var(--warn);background:var(--warn-dim);">
        <div style="font-weight:800;margin-bottom:4px;color:var(--warn);">⚠️ เลือกรถก่อนเริ่มงาน</div>
        <div class="field-note" style="color:var(--warn);line-height:1.6;">
          คุณได้รับงาน ${awaiting.map(t=> t.task_code).join(", ")} แล้ว
          ${want.length ? `— ต้องใช้รถประเภท <b>${want.join(" และ ")}</b>` : ""}<br>
          เลือกรถแล้วระบบจะผูกเข้ากับงานให้อัตโนมัติ
        </div>
        <button class="btn amber" id="pick-veh" style="width:100%;margin-top:10px;">เลือกรถตอนนี้</button>
      </div>`);
      prompt.querySelector("#pick-veh").onclick = ()=> openVehicleCheckSheet();
      main.appendChild(prompt);
    }

    if(mine.length){
      mine.forEach(t=>{
        const amPrimary = t.driver_employee_id === state.employee_id;
        const meRow = (t.drivers||[]).find(d=> d.employee_id === state.employee_id);
        const needsVehicle = meRow && meRow.awaiting_vehicle;
        let actions = `<button class="btn" data-chat="${t.id}">💬 แชท</button>`;
        if(needsVehicle){
          actions = `<button class="btn amber" data-pick-vehicle="1">เลือกรถเพื่อเริ่มงาน</button>` + actions;
        } else if(t.status === "Assigned" && amPrimary){
          actions = `<button class="btn green" data-action="start">เริ่มงาน</button>` + actions;
        } else if(t.status === "In Progress"){
          actions = `<button class="btn green" data-action="complete">เสร็จงาน</button>
            <button class="btn" data-pause="${t.id}">แจ้งปัญหา</button>` + actions;
        } else if(t.status === "Pause"){
          actions = `<button class="btn amber" data-action="resume">แก้ไขเหตุขัดข้อง</button>` + actions;
        }
        if(["Assigned","In Progress","Pause"].includes(t.status)) actions += `<button class="btn red" data-leave="${t.id}">ออกจากงาน</button>`;
        main.appendChild(el(taskCard(t, actions)));
      });
      bindCardActions(main);
      main.querySelectorAll("[data-pause]").forEach(b=> b.onclick = ()=> openPauseSheet(b.dataset.pause));
      main.querySelectorAll("[data-pick-vehicle]").forEach(b=> b.onclick = (ev)=>{ ev.stopPropagation(); openVehicleCheckSheet(); });
      main.querySelectorAll("[data-leave]").forEach(b=>{
        b.onclick = async (ev)=>{
          ev.stopPropagation();
          if(!confirm("ยืนยันออกจากงานนี้ใช่หรือไม่?")) return;
          await taskAction({
            id: b.dataset.leave, key: "leave", btn: b,
            run: ()=> api(`/tasks/${b.dataset.leave}/leave`, {method:"POST"}),
            successMsg: "ออกจากงานแล้ว",
          });
        };
      });
    } else {
      main.appendChild(el(`<div class="empty">ยังไม่มีงานที่กำลังทำอยู่</div>`));
    }

    // ---------------- 1b. คิวงานของฉัน ----------------
    // Shown only when there is something in it. The driver does not have to
    // act on any of this: each job starts on its own as the previous one
    // finishes. The button is for the case where they happen to be next to a
    // different bay and would rather take that one first.
    if(queued.length){
      main.appendChild(el(`<div class="section-title">คิวงานของฉัน (${queued.length})</div>`));
      main.appendChild(el(`<div class="field-note" style="margin-bottom:10px;line-height:1.6;">
        งานพวกนี้เป็นของคุณแล้ว ทำงานที่กำลังทำอยู่ให้เสร็จ แล้วงานถัดไปจะเริ่มเองโดยไม่ต้องกดอะไร
        ถ้าอยู่ใกล้งานไหนอยู่แล้ว กด "ทำงานนี้ก่อน" ได้เลย
      </div>`));
      queued.forEach((t, i)=>{
        const actions = `<button class="btn amber" data-make-active="${t.id}">ทำงานนี้ก่อน</button>
          <button class="btn" data-chat="${t.id}">💬 แชท</button>`;
        const card = el(taskCard(t, actions, {queuePos: i + 1}));
        main.appendChild(card);
      });
      main.querySelectorAll("[data-make-active]").forEach(b=> b.onclick = async (ev)=>{
        ev.stopPropagation();
        await taskAction({
          id: b.dataset.makeActive, key: "make-active", btn: b,
          run: ()=> api(`/tasks/${b.dataset.makeActive}/make-active`, {method:"POST"}),
          successMsg: "สลับมาทำงานนี้แล้ว",
        });
      });
    }

    // ---------------- 2. สถานะและรถที่ขับ ----------------
    main.appendChild(el(`<div class="section-title">สถานะและรถที่ขับ</div>`));
    const st = state.me && state.me.driver_status;
    const stClass = st === "Available" ? "on" : st === "Breakdown" ? "bad" : st === "Busy" ? "busy" : "off";
    const pillRow = el(`<div class="card" style="display:flex;gap:10px;align-items:center;">
      <button class="driver-status-pill ${stClass}" id="status-pill-btn" style="cursor:pointer;font-size:13px;padding:9px 14px;background:var(--panel-2);">
        ● ${DRIVER_STATUS_LABEL[st] || '-'}
      </button>
      <button class="btn" id="vehicle-pill-btn" style="flex:1;">
        🚗 ${meVehicle ? `${meVehicle.vehicle_type} ${meVehicle.code}` : 'แตะเพื่อเลือกรถ'}
      </button>
    </div>`);
    main.appendChild(pillRow);
    pillRow.querySelector("#status-pill-btn").onclick = ()=> openDriverStatusSheet();
    pillRow.querySelector("#vehicle-pill-btn").onclick = ()=> openVehicleCheckSheet();

    // ---------------- 3. งานที่รับได้ ----------------
    // Within the same zone it is still oldest-first — a queue of unclaimed work
    // is served front to back. The home zone only decides which queue comes
    // first: their own area, then the areas they help out in, then everyone
    // else's. Someone with no home zone sees exactly what they saw before.
    const zones = myZones();
    const hasZones = !!(zones.primary || (zones.secondary || []).length);
    const matchOf = new Map();
    const waiting = state.tasks.filter(t=> t.status === "Waiting");
    waiting.forEach(t=> matchOf.set(t.id, zoneMatchOf(t, zones)));
    if(state.zoneOnly === undefined){
      try{ state.zoneOnly = localStorage.getItem("scdc_zone_only") === "1"; }catch(e){ state.zoneOnly = false; }
    }
    const inMyZones = waiting.filter(t=> matchOf.get(t.id));
    const avail = (state.zoneOnly && hasZones ? inMyZones : waiting)
      .slice()
      .sort((a,b)=> ((matchOf.get(a.id) || {rank:9}).rank - (matchOf.get(b.id) || {rank:9}).rank)
                 || String(a.created_at||"").localeCompare(String(b.created_at||"")));
    main.appendChild(el(`<div class="section-title">งานที่รับได้ (${avail.length})</div>`));
    main.appendChild(el(`<div class="field-note" style="margin-bottom:10px;">${
      meVehicle ? `กดรับงานได้ทันทีด้วยรถ ${meVehicle.code}` : "กดรับงานแล้วเลือกรถได้เลย"
    }</div>`));
    if(hasZones){
      // Never a hard filter by default: a zone whose one driver is off sick
      // must not become a zone whose jobs nobody can see.
      const zoneBar = el(`<label class="card" id="zone-only-row"
        style="display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;">
        <input type="checkbox" id="zone-only" style="width:auto;" ${state.zoneOnly ? "checked" : ""} />
        <span style="flex:1;">
          <b style="font-size:13px;">เฉพาะโซนของฉัน</b>
          <div class="field-note" style="margin-top:2px;">
            ${zones.primary ? `โซนหลัก ${zoneName(zones.primary)}` : "ยังไม่ได้ตั้งโซนหลัก"}${
              (zones.secondary||[]).length ? ` · รอง ${(zones.secondary).map(zoneName).join(", ")}` : ""}
            — มีงานในโซนคุณ ${inMyZones.length} งาน จากทั้งหมด ${waiting.length}
          </div>
        </span>
      </label>`);
      zoneBar.querySelector("#zone-only").onchange = (e)=>{
        state.zoneOnly = e.target.checked;
        try{ localStorage.setItem("scdc_zone_only", state.zoneOnly ? "1" : "0"); }catch(err){}
        renderContent();
      };
      main.appendChild(zoneBar);
    }
    if(!avail.length) main.appendChild(el(`<div class="empty">${
      state.zoneOnly && hasZones && waiting.length
        ? `ไม่มีงานในโซนของคุณตอนนี้ — ยังมีอีก ${waiting.length} งานในโซนอื่น เอาเครื่องหมายถูกออกเพื่อดู`
        : "ยังไม่มีงานว่างในขณะนี้"}</div>`));
    avail.forEach(t=>{
      main.appendChild(el(taskCard(t, `<button class="btn amber" data-self-assign="${t.id}">รับงานนี้</button>`,
        {showRequester:true, zoneTag: matchOf.get(t.id)})));
    });
    main.querySelectorAll("[data-self-assign]").forEach(b=> b.onclick = (ev)=>{
      ev.stopPropagation(); claimTask(b.dataset.selfAssign, "self-assign");
    });

    // ---------------- 4. งานที่คนอื่นกำลังทำ ----------------
    const others = state.tasks.filter(t=> ["Assigned","In Progress","Pause"].includes(t.status)
      && !isMine(t) && (t.drivers||[]).length > 0);
    main.appendChild(el(`<div class="section-title">งานที่คนอื่นกำลังทำ (${others.length})</div>`));
    main.appendChild(el(`<div class="field-note" style="margin-bottom:10px;">"เข้าร่วม" = ช่วยทำไปพร้อมกัน</div>`));
    if(!others.length) main.appendChild(el(`<div class="empty">ไม่มีงานของคนอื่นในขณะนี้</div>`));
    others.forEach(t=>{
      main.appendChild(el(taskCard(t, `<button class="btn green" data-join="${t.id}">เข้าร่วม</button>`, {showRequester:true})));
    });
    main.querySelectorAll("[data-join]").forEach(b=> b.onclick = (ev)=>{
      ev.stopPropagation(); claimTask(b.dataset.join, "join");
    });

    bindCardClickToDetail(main);

    // ---------------- 5. แจ้งปัญหา/ขัดข้อง ----------------
    main.appendChild(el(`<div class="section-title">แจ้งปัญหา/ขัดข้อง</div>`));
    const bd = el(`<div class="card">
      <button class="btn red" id="bd-self" style="width:100%;">แจ้งปัญหาของตัวเอง</button>
      <div class="grid2" style="margin-top:10px;">
        <div><label>รหัสรถ</label><input id="bd-vehicle" placeholder="เช่น WH-14" /></div>
        <div><label>&nbsp;</label><button class="btn red" id="bd-vehicle-submit" style="width:100%;">แจ้งปัญหารถ</button></div>
      </div>
      <label>รายละเอียด</label><textarea id="bd-desc" rows="2" placeholder="เกิดอะไรขึ้น?"></textarea>
    </div>`);
    bd.querySelector("#bd-self").onclick = async ()=>{
      try{
        await api("/breakdowns", {method:"POST", body: JSON.stringify({target_type:"driver", description: bd.querySelector("#bd-desc").value})});
        toast("แจ้งปัญหาแล้ว"); await refreshAll();
      }catch(e){ toast(e.message); }
    };
    bd.querySelector("#bd-vehicle-submit").onclick = async ()=>{
      try{
        await api("/breakdowns", {method:"POST", body: JSON.stringify({
          target_type:"vehicle", vehicle_code: bd.querySelector("#bd-vehicle").value.trim(),
          description: bd.querySelector("#bd-desc").value})});
        toast("แจ้งปัญหาแล้ว"); await refreshAll();
      }catch(e){ toast(e.message); }
    };
    main.appendChild(bd);
  } else if(state.tab === "history"){
    renderDriverHistory(main);
  } else if(state.tab === "teamchat"){
    renderTeamChat(main);
  } else if(state.tab === "profile"){
    renderProfile(main);
  }
}

// Taking a job when you have no vehicle: board one first, then claim. The
// check-in itself binds the vehicle to anything already assigned, so this is
// the one prompt a driver sees instead of a separate "check in" chore.
function claimTask(taskId, mode){
  const hasVehicle = !!(state.me && state.me.checked_in_vehicle_id);
  if(hasVehicle) return openBatterySheet(taskId, mode);
  openVehicleCheckSheet({
    reason: "เลือกรถก่อนรับงานนี้",
    afterCheckIn: ()=> openBatterySheet(taskId, mode),
  });
}

function openVehicleCheckSheet(opts={}){
  const meVehicle = state.vehicles.find(v=> v.id === (state.me && state.me.checked_in_vehicle_id));
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>เช็คอิน / เช็คเอาท์รถ</h2><button class="sheet-close">✕</button></div>
        <div class="field-note" style="margin-bottom:10px;">${
          opts.reason ? opts.reason
          : meVehicle ? 'รถปัจจุบัน: <b>'+meVehicle.code+'</b>'
          : 'ยังไม่ได้เลือกรถ'}</div>
        <label>เลือกรถ (แสดงเฉพาะรถที่คุณมีใบอนุญาตและยังว่าง)</label>
        <div id="vc-picker"><div class="empty">กำลังโหลด...</div></div>
        <div class="grid2" style="margin-top:10px;">
          <button class="btn amber" id="vc-checkin">เช็คอิน</button>
          <button class="btn red" id="vc-checkout" ${meVehicle ? '' : 'disabled'}>เช็คเอาท์</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  let picked = null;
  (async ()=>{
    const host = overlay.querySelector("#vc-picker");
    try{
      const choices = await api("/vehicles/available-for-checkin", {background:true});
      host.innerHTML = "";
      // The vehicle they're in already stays pickable at the top.
      const list = choices.slice();
      if(meVehicle && !list.some(v=> v.code === meVehicle.code)) list.unshift(meVehicle);
      if(!list.length){ host.appendChild(el(`<div class="empty">${emptyVehicleMessage()}</div>`)); return; }
      mountVehiclePicker(host, list, code=> { picked = code; }, {currentCode: meVehicle && meVehicle.code});
    }catch(e){ host.innerHTML = ""; host.appendChild(el(`<div class="err">${e.message}</div>`)); }
  })();
  overlay.querySelector("#vc-checkin").onclick = async ()=>{
    const vehicle_code = picked;
    if(!vehicle_code){ toast("กรุณาเลือกรถ"); return; }
    try{
      await api("/vehicles/check-in", {method:"POST", body: JSON.stringify({
        vehicle_code,
      })});
      closeSheet(overlay);
      toast(`เลือกรถ ${vehicle_code} แล้ว`);
      await refreshAll();
      // Carry straight on to whatever the driver was trying to do, so picking
      // a vehicle never becomes a detour they have to find their way back from.
      if(opts.afterCheckIn) opts.afterCheckIn();
    }catch(e){ toast(e.message); }
  };
  overlay.querySelector("#vc-checkout").onclick = async ()=>{
    try{
      await api("/vehicles/check-out", {method:"POST"});
      closeSheet(overlay);
      toast("เช็คเอาท์แล้ว");
      await refreshAll();
    }catch(e){ toast(e.message); }
  };
}

  function goToTask(taskId){ closeSheet(overlay); openTaskDetailSheet(taskId); }
  function goToPerson(userId){
    closeSheet(overlay);
    setTab("operation", "people"); renderContent();
    openUserEditSheet(userId);
  }
  function goToVehicle(vehicleId){
    closeSheet(overlay);
    setTab("operation", "vehicles"); renderContent();
    openVehicleEditSheet(vehicleId);
  }

  function runSearch(){
    const q = input.value.trim().toLowerCase();
    results.innerHTML = "";
    if(!q){ return; }
    const taskMatches = state.tasks.filter(t=>
      t.task_code.toLowerCase().includes(q) ||
      (t.from_location||"").toLowerCase().includes(q) ||
      (t.to_location||"").toLowerCase().includes(q)
    ).slice(0, 8);
    const peopleMatches = state.allUsers.filter(u=>
      u.employee_id.toLowerCase().includes(q) || (u.full_name||"").toLowerCase().includes(q)
    ).slice(0, 8);
    const vehicleMatches = state.vehicles.filter(v=> v.code.toLowerCase().includes(q)).slice(0, 8);

    if(taskMatches.length === 0 && peopleMatches.length === 0 && vehicleMatches.length === 0){
      results.appendChild(el(`<div class="empty">ไม่พบผลลัพธ์</div>`));
      return;
    }
    if(taskMatches.length){
      results.appendChild(el(`<div class="section-title">งาน</div>`));
      const card = el(`<div class="card"></div>`);
      taskMatches.forEach(t=>{
        const row = el(`<div class="list-row" style="cursor:pointer;"><span class="mono">${t.task_code}</span><span class="field-note">${t.from_location} → ${t.to_location} · ${STATUS_LABEL[t.status]||t.status}</span></div>`);
        row.onclick = ()=> goToTask(t.id);
        card.appendChild(row);
      });
      results.appendChild(card);
    }
    if(peopleMatches.length){
      results.appendChild(el(`<div class="section-title">พนักงาน</div>`));
      const card = el(`<div class="card"></div>`);
      peopleMatches.forEach(u=>{
        const row = el(`<div class="list-row" style="cursor:pointer;"><span>${u.full_name || u.employee_id}</span><span class="field-note">${u.employee_id} · ${u.role}</span></div>`);
        row.onclick = ()=> goToPerson(u.id);
        card.appendChild(row);
      });
      results.appendChild(card);
    }
    if(vehicleMatches.length){
      results.appendChild(el(`<div class="section-title">รถ</div>`));
      const card = el(`<div class="card"></div>`);
      vehicleMatches.forEach(v=>{
        const row = el(`<div class="list-row" style="cursor:pointer;"><span class="mono">${v.code}</span><span class="field-note">${v.vehicle_type} · ${v.status}</span></div>`);
        row.onclick = ()=> goToVehicle(v.id);
        card.appendChild(row);
      });
      results.appendChild(card);
    }
  }
  input.addEventListener("input", runSearch);
}

function openBatterySheet(taskId, mode){
  const title = mode === "self-assign" ? "รับงานด้วยตัวเอง" : mode === "take-over" ? "รับช่วงงานนี้"
    : mode === "join" ? "เข้าร่วมงานนี้" : "ยืนยัน";
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>${title}</h2><button class="sheet-close">✕</button></div>
        <div class="field-note">จะใช้รถคันที่คุณเช็คอินไว้โดยอัตโนมัติ</div>
        <button class="primary" id="bt-submit">ยืนยัน</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector(".sheet-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  overlay.querySelector("#bt-submit").onclick = async ()=>{
    const endpoint = mode === "self-assign" ? `/tasks/${taskId}/self-assign`
      : mode === "take-over" ? `/tasks/${taskId}/take-over`
      : mode === "join" ? `/tasks/${taskId}/join` : `/tasks/${taskId}/accept`;
    // Close the sheet first: the driver has committed, and leaving it up while
    // the network call runs is what made this feel slow. taskAction then shows
    // the result on the card underneath, and rolls it back if the server says
    // no (most often because another driver claimed it a moment earlier).
    closeSheet(overlay);
    await taskAction({
      id: taskId,
      key: mode,
      patch: OPTIMISTIC_PATCH[mode],
      run: ()=> api(endpoint, {method:"POST", body: JSON.stringify({})}),
      successMsg: mode === "self-assign" ? "รับงานแล้ว" : "สำเร็จ",
    });
  };
}

async function downloadExport(period){
