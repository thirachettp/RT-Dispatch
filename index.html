        ${Object.keys(CHART_COLORS).map(k=>`<span class="chip" style="cursor:default;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${CHART_COLORS[k]};margin-right:5px;"></span>${TASK_STAT_LABEL[k]}</span>`).join("")}
      </div>`);
      chartCard.appendChild(legend);
    }catch(e){ chartCard.innerHTML = ""; chartCard.appendChild(el(`<div class="empty">โหลดกราฟไม่สำเร็จ</div>`)); }
    state.dashLastUpdated = new Date();
    const label = document.getElementById("dash-updated-at");
    if(label) label.textContent = "อัปเดตล่าสุด " + fmtClock(state.dashLastUpdated);
  }

  refreshRow.querySelector("#dash-refresh-btn").onclick = ()=> loadDashboard();
  // Exposed so the shell's single pull-to-refresh handler can drive the
  // dashboard's own loader without re-binding listeners on every render.
  loadDashboardNow = loadDashboard;
  await loadDashboard();
}

async function downloadExport(period){
  try{
    const res = await fetch(API + `/dashboard/export?period=${period}`, {headers:{Authorization:"Bearer "+state.token}});
    if(!res.ok) throw new Error("ดาวน์โหลดไม่สำเร็จ");
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `scdc_export_${period}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ toast(e.message); }
}

function buildStackedBarChart(series){
  const W = 320, H = 160, padL = 4, padB = 18, padT = 6, barGap = 8;
  const n = series.length;
  const barW = (W - padL*2 - barGap*(n-1)) / n;
  const statuses = Object.keys(CHART_COLORS);
  const maxTotal = Math.max(1, ...series.map(d=> statuses.reduce((s,k)=> s + (d[k]||0), 0)));
  const usableH = H - padT - padB;
  let bars = "";
  series.forEach((d, i)=>{
    const x = padL + i * (barW + barGap);
    let yCursor = H - padB;
    statuses.forEach(st=>{
      const v = d[st] || 0;
      if(v <= 0) return;
      const h = (v / maxTotal) * usableH;
      yCursor -= h;
      bars += `<rect x="${x}" y="${yCursor}" width="${barW}" height="${h}" fill="${CHART_COLORS[st]}" rx="2"></rect>`;
    });
    const label = d.date.slice(5).replace("-","/");
    bars += `<text x="${x + barW/2}" y="${H-4}" font-size="9" fill="var(--ink-dim)" text-anchor="middle">${label}</text>`;
  });
  const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${bars}</svg>`;
  return el(`<div>${svg}</div>`);
}

function bindCardClickToDetail(container){
  container.querySelectorAll(".card[data-id]").forEach(card=>{
    card.style.cursor = "pointer";
    card.addEventListener("click", (e)=>{
      if(e.target.closest("button")) return;
      openTaskDetailSheet(card.dataset.id);
    });
  });
  loadAuthenticatedImages(container);
}

// Task photos are served from an authenticated endpoint now (not a public
// static file), which a plain <img src="..."> can't attach a Bearer token
// to. This fetches each photo with the right header and swaps in a blob URL
// once it arrives, so the auth requirement doesn't just silently break every
// photo thumbnail.
async function loadAuthenticatedImages(container){
  const imgs = container.querySelectorAll("img[data-photo-url]");
  for(const img of imgs){
    const url = img.dataset.photoUrl;
    delete img.dataset.photoUrl; // avoid re-fetching if this runs again on the same container
    try{
      const res = await fetch(API + url, {headers: {Authorization: "Bearer " + state.token}});
      if(!res.ok) continue;
      const blob = await res.blob();
      img.src = URL.createObjectURL(blob);
    }catch(e){ /* leave it blank rather than break the rest of the page */ }
  }
}

// ===================== Dispatch board =====================
// Built around two facts from real use: the admin hands out nearly every job
// by hand, and the two things that cost time were (a) the number of steps per
// assignment and (b) not being able to see who is free.
//
// Deliberately does NOT rank or recommend anyone. Drivers who physically
// cannot do the job (licence / zone / no vehicle) are filtered out; among
// those who can, the admin chooses. That was an explicit product decision —
// the system's job here is to remove impossible options, not to pick.

function minsSince(iso){
  if(!iso) return null;
  return Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
}

function waitBadge(mins){
  const cls = mins >= 30 ? "bad" : mins >= 15 ? "warn" : "ok";
  const txt = mins >= 60 ? `${Math.floor(mins/60)} ชม. ${mins%60} น.` : `${mins} นาที`;
  return `<span class="badge ${cls}">รอมา ${txt}</span>`;
}

async function renderDispatchBoard(main){
  main.appendChild(el(`<div class="section-title">คนขับตอนนี้</div>`));
  const driverPanel = el(`<div class="card" id="dp-drivers"><div class="empty">กำลังโหลด...</div></div>`);
  main.appendChild(driverPanel);

  const queueTitle = el(`<div class="section-title" id="dp-queue-title">คิวงานที่รอมอบหมาย</div>`);
  main.appendChild(queueTitle);
  const queueBox = el(`<div id="dp-queue"><div class="empty">กำลังโหลด...</div></div>`);
  main.appendChild(queueBox);

  // Paint the previous board first: renderContent() re-runs this on every
  // refresh cycle, and blanking to a loading state each time made the screen
  // flash and pushed the queue around under the admin's finger.
  const cached = state.dispatchBoard;
  if(cached) paintDispatch(cached, driverPanel, queueBox, queueTitle);

  let board;
  try{
    board = await api("/dispatch/board", {background: !!cached});
  }catch(e){
    if(!cached){
      driverPanel.innerHTML = "";
      driverPanel.appendChild(el(`<div class="empty">โหลดข้อมูลไม่สำเร็จ: ${e.message || ""}</div>`));
      queueBox.innerHTML = "";
    }
    return;   // keep showing the last good board
  }
  state.dispatchBoard = board;
  paintDispatch(board, driverPanel, queueBox, queueTitle);
}

function paintDispatch(board, driverPanel, queueBox, queueTitle){
  const byEmp = {};
  board.drivers.forEach(d=> byEmp[d.employee_id] = d);

  // ---- who is free, and when do the rest free up ----
  const free = board.drivers.filter(d=> d.driver_status === "Available" && d.vehicle_code);
  const busy = board.drivers.filter(d=> d.driver_status === "Busy");
  const out  = board.drivers.filter(d=> !free.includes(d) && !busy.includes(d));
  driverPanel.innerHTML = "";
  driverPanel.appendChild(el(`<div class="stat-grid" style="margin-bottom:12px;">
    <div class="stat"><div class="n">${free.length}</div><div class="l">ว่าง</div></div>
    <div class="stat"><div class="n">${busy.length}</div><div class="l">ติดงาน</div></div>
    <div class="stat"><div class="n">${out.length}</div><div class="l">ยังไม่พร้อม</div></div>
  </div>`));
  if(free.length){
    driverPanel.appendChild(el(`<div class="field-note" style="margin-bottom:6px;">ว่างพร้อมรับงาน</div>`));
    driverPanel.appendChild(el(`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
      ${free.map(d=>`<span class="badge ok">${d.full_name || d.employee_id} · ${d.vehicle_code}</span>`).join("")}
    </div>`));
  }
  if(busy.length){
    // The missing half of the answer: a status badge said "Busy" but never
    // said for how long or on what, so there was no way to judge who would
    // free up next.
    driverPanel.appendChild(el(`<div class="field-note" style="margin-bottom:6px;">ติดงานอยู่</div>`));
    driverPanel.appendChild(el(`<div style="font-size:12px;line-height:1.8;margin-bottom:12px;">
      ${busy.map(d=>{
        const m = minsSince(d.busy_since);
        const eta = d.estimated_arrival ? ` · คาดเสร็จ ${fmtClock(new Date(d.estimated_arrival))}` : "";
        return `<div style="display:flex;justify-content:space-between;gap:10px;">
          <span>${d.full_name || d.employee_id}${d.vehicle_code ? " · " + d.vehicle_code : ""}</span>
          <span style="color:var(--ink-dim);">${d.current_task_code || "-"}${m !== null ? " · " + m + " นาที" : ""}${eta}</span>
        </div>`;
      }).join("")}
    </div>`));
  }
  if(out.length){
    driverPanel.appendChild(el(`<div class="field-note">ยังไม่พร้อม: ${out.map(d=>
      `${d.full_name || d.employee_id} (${d.vehicle_code ? (DRIVER_STATUS_LABEL[d.driver_status]||d.driver_status) : "ยังไม่เช็คอินรถ"})`
    ).join(", ")}</div>`));
  }

  // ---- the queue ----
  queueTitle.textContent = `คิวงานที่รอมอบหมาย (${board.queue.length})`;
  queueBox.innerHTML = "";
  if(!board.queue.length){
    queueBox.appendChild(el(`<div class="empty">ไม่มีงานที่รอมอบหมาย</div>`));
    return;
  }

  board.queue.forEach(entry=>{
    const t = entry.task;
    const mins = minsSince(t.created_at);
    const eligible = entry.eligible.map(e=> byEmp[e]).filter(Boolean);
    const card = el(`<div class="card" data-dp-task="${t.id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div>
          <div style="font-weight:800;">${t.task_code}</div>
          <div style="font-size:12px;color:var(--ink-dim);margin-top:2px;">
            ${t.from_location} → ${t.to_location} · ${t.pallet_qty} พาเลท
          </div>
          <div style="font-size:12px;color:var(--ink-dim);">ผู้ขอ: ${t.requester_name || t.requester_employee_id || "-"}</div>
        </div>
        <div style="text-align:right;flex:none;">
          ${waitBadge(mins)}
          ${t.priority && t.priority !== "Normal" ? `<div style="margin-top:4px;"><span class="badge bad">${t.priority}</span></div>` : ""}
        </div>
      </div>
      <div class="dp-pickers" style="margin-top:10px;"></div>
    </div>`);
    const pickers = card.querySelector(".dp-pickers");

    if(!eligible.length){
      // Say exactly why nobody can take it — otherwise an empty row looks
      // like a bug and the admin has no idea what to fix.
      const reasons = {};
      Object.values(entry.blocked).flat().forEach(r=> reasons[r] = (reasons[r]||0) + 1);
      const top = Object.entries(reasons).sort((a,b)=> b[1]-a[1]).slice(0,3)
        .map(([r,n])=> `${r} (${n} คน)`).join(" · ");
      pickers.appendChild(el(`<div class="field-note" style="color:var(--warn);">
        ยังไม่มีคนขับที่ทำงานนี้ได้ — ${top || "ไม่มีคนขับพร้อมใช้งาน"}
      </div>`));
      const anyway = el(`<button class="btn" style="width:100%;margin-top:8px;">เลือกเองทั้งที่ไม่ตรงเงื่อนไข</button>`);
      anyway.onclick = ()=> openAssignSheet(t.id, false);
      pickers.appendChild(anyway);
      queueBox.appendChild(card);
      return;
    }

    pickers.appendChild(el(`<div class="field-note" style="margin-bottom:6px;">
      มอบหมายให้ (${eligible.length} คนที่ทำงานนี้ได้)</div>`));
    const row = el(`<div style="display:flex;flex-wrap:wrap;gap:6px;"></div>`);
    eligible.forEach(d=>{
      // One tap = assigned. The old path was: open sheet, scroll past ETA and
      // reason fields, search, tap select, tap confirm, sheet closes.
      const b = el(`<button class="btn amber" style="flex:1 1 auto;min-width:46%;">
        ${d.full_name || d.employee_id}<br><span style="font-size:11px;opacity:.8;">${d.vehicle_code} · ${d.vehicle_type}</span>
      </button>`);
      b.onclick = ()=> dispatchAssign(t, d, b, card);
      row.appendChild(b);
    });
    pickers.appendChild(row);

    const more = el(`<button class="btn" style="width:100%;margin-top:8px;">ตัวเลือกเพิ่มเติม (ETA / เหตุผล / คนอื่น)</button>`);
    more.onclick = ()=> openAssignSheet(t.id, false);
    pickers.appendChild(more);
    queueBox.appendChild(card);
  });
}

async function dispatchAssign(task, driver, btn, card){
  const lock = `dispatch:${task.id}`;
  if(_inFlightActions.has(lock)) return;
  _inFlightActions.add(lock);
  card.querySelectorAll("button").forEach(b=> b.disabled = true);
  btn.textContent = "กำลังมอบหมาย...";
  try{
    await api(`/tasks/${task.id}/assign`, {method:"POST",
      body: JSON.stringify({driver_employee_id: driver.employee_id, force: false})});
    toast(`มอบหมาย ${task.task_code} ให้ ${driver.full_name || driver.employee_id} แล้ว`);
    // Stay on the board and keep going — the card for this job disappears and
    // the next one moves up, so a run of assignments never leaves this screen.
    card.remove();
    await refreshDispatchBoard();
  }catch(e){
    card.querySelectorAll("button").forEach(b=> b.disabled = false);
    btn.innerHTML = `${driver.full_name || driver.employee_id}<br><span style="font-size:11px;opacity:.8;">${driver.vehicle_code} · ${driver.vehicle_type}</span>`;
    toast(e.message || "มอบหมายไม่สำเร็จ");
    // Someone else almost certainly changed something — reload the board so
    // the admin isn't choosing from a stale picture.
    await refreshDispatchBoard();
  }finally{
    _inFlightActions.delete(lock);
  }
}

async function refreshDispatchBoard(){
  if(state.tab !== "operation" || state.subtab !== "dispatch") return;
  const panel = document.getElementById("dp-drivers");
  const box = document.getElementById("dp-queue");
  const title = document.getElementById("dp-queue-title");
  if(!panel || !box || !title) return;
  try{
    const board = await api("/dispatch/board", {background:true});
    state.dispatchBoard = board;
    paintDispatch(board, panel, box, title);
  }catch(e){ /* keep the last good board on screen */ }
}

function renderOperationJobs(main){
  if(!state.opsJobFilter) state.opsJobFilter = {status:"", overdue:false};

  const activeTasks = state.tasks.filter(t=> !["Completed","Cancelled"].includes(t.status));
  const overdueCount = activeTasks.filter(t=>{
    const now = Date.now();
    if(t.status === "Waiting") return (now - new Date(t.created_at).getTime()) > 15*60*1000;
    if(t.status === "In Progress") return t.started_at && (now - new Date(t.started_at).getTime()) > 60*60*1000;
    return false;
  }).length;
  const summary = el(`<div class="stat-grid" style="margin-bottom:14px;">
    <div class="stat"><div class="n">${state.tasks.filter(t=>t.status==='Waiting').length}</div><div class="l">รอดำเนินการ</div></div>
    <div class="stat"><div class="n">${activeTasks.length - state.tasks.filter(t=>t.status==='Waiting').length}</div><div class="l">กำลังดำเนินการ</div></div>
    <div class="stat"><div class="n">${overdueCount}</div><div class="l">ค้างนาน (Overdue)</div></div>
  </div>`);
  main.appendChild(summary);

  const filterBar = el(`<div class="card">
    <div class="grid2">
      <div><label>สถานะ</label><select id="oj-status">
        <option value="">ทั้งหมด</option>
        <option value="Waiting">รอดำเนินการ</option>
        <option value="Assigned">มอบหมายแล้ว</option>
        <option value="In Progress">กำลังทำ</option>
        <option value="Pause">หยุดชั่วคราว</option>
        <option value="Completed">เสร็จสิ้น</option>
        <option value="Cancelled">ยกเลิก</option>
      </select></div>
      <div><label>&nbsp;</label><label style="display:flex;align-items:center;gap:8px;padding:11px 0;">
        <input type="checkbox" id="oj-overdue" style="width:auto;" /> เฉพาะงานค้าง (Overdue)
      </label></div>
    </div>
  </div>`);
  main.appendChild(filterBar);
  filterBar.querySelector("#oj-status").value = state.opsJobFilter.status;
  filterBar.querySelector("#oj-overdue").checked = state.opsJobFilter.overdue;
  filterBar.querySelector("#oj-status").onchange = (e)=>{ state.opsJobFilter.status = e.target.value; renderContent(); };
  filterBar.querySelector("#oj-overdue").onchange = (e)=>{ state.opsJobFilter.overdue = e.target.checked; renderContent(); };

  const now = Date.now();
  let tasks = state.tasks.slice();
  if(state.opsJobFilter.status) tasks = tasks.filter(t=> t.status === state.opsJobFilter.status);
  if(state.opsJobFilter.overdue){
    tasks = tasks.filter(t=>{
      if(t.status === "Waiting") return (now - new Date(t.created_at).getTime()) > 15*60*1000;
      if(t.status === "In Progress") return t.started_at && (now - new Date(t.started_at).getTime()) > 60*60*1000;
      return false;
    });
  }
  main.appendChild(el(`<div class="section-title">งาน (${tasks.length})</div>`));
  if(tasks.length === 0) main.appendChild(el(`<div class="empty">ไม่พบงานตามตัวกรอง</div>`));
  tasks.forEach(t=>{
    let actions = `<button class="btn" data-chat="${t.id}">💬 แชท</button>`;
    if(t.status === "Waiting"){
      actions = `<button class="btn amber" data-assign="${t.id}">มอบหมายงาน</button>
        <button class="btn" data-sendback="${t.id}">ตีกลับ</button>${actions}`;
    } else if(["Assigned","In Progress","Pause"].includes(t.status)){
      actions = `<button class="btn blue" data-reassign="${t.id}">มอบหมายใหม่</button>
        <button class="btn green" data-add-driver="${t.id}">+ เพิ่มคนขับ</button>
        <button class="btn purple" data-priority="${t.id}">ความสำคัญ</button>${actions}
        ${t.status !== "Assigned" ? `<button class="btn green" data-admin-complete="${t.id}">ทำเครื่องหมายเสร็จ</button>` : ""}
        <button class="btn red" data-action="cancel">ยกเลิก</button>`;
    }
    main.appendChild(el(taskCard(t, actions, {showRequester:true})));
  });
  main.querySelectorAll("[data-assign]").forEach(b=> b.onclick = ()=> openAssignSheet(b.dataset.assign, false));
  main.querySelectorAll("[data-reassign]").forEach(b=> b.onclick = ()=> openAssignSheet(b.dataset.reassign, true));
  main.querySelectorAll("[data-add-driver]").forEach(b=> b.onclick = ()=> openAddDriverSheet(b.dataset.addDriver));
  main.querySelectorAll("[data-admin-complete]").forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm("ยืนยันทำเครื่องหมายว่างานนี้เสร็จแล้ว? ใช้สำหรับงานที่ค้างผิดปกติเท่านั้น")) return;
      try{ await api(`/tasks/${b.dataset.adminComplete}/admin-complete`, {method:"POST"}); toast("ทำเครื่องหมายเสร็จแล้ว"); await refreshAll(); }
      catch(e){ toast(e.message); }
    };
  });
  main.querySelectorAll("[data-priority]").forEach(b=> b.onclick = ()=> openPrioritySheet(b.dataset.priority));
  main.querySelectorAll("[data-sendback]").forEach(b=> b.onclick = ()=> openSendBackSheet(b.dataset.sendback));
  bindCardActions(main);
  bindCardClickToDetail(main);
}

function openAddDriverSheet(taskId){
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>เพิ่มคนขับเข้างาน #${taskId}</h2><button id="sh-close">✕</button></div>
        <div class="field-note">คนขับที่เพิ่มจะเข้ามาช่วยทำงานนี้พร้อมกัน (ไม่ได้แทนที่คนขับเดิม) ใช้รถที่เช็คอินไว้อัตโนมัติ</div>
        <div class="suggest-box" id="ad-driver-list">
          ${state.drivers.map(d=>{
            const dv = state.vehicles.find(v=> v.id === d.checked_in_vehicle_id);
            const badgeClass = d.driver_status === "Available" ? "ok" : d.driver_status === "Breakdown" ? "bad" : "warn";
            return `<div class="suggest-item">
              <span>${d.full_name || d.employee_id} <span class="badge ${badgeClass}">${DRIVER_STATUS_LABEL[d.driver_status]||d.driver_status}</span><br/>
              <span style="color:var(--ink-dim)">สิทธิ์: ${d.license_types||'-'} ${dv ? '· รถ: '+dv.code : '· ยังไม่ได้เช็คอินรถ'}</span></span>
              <button class="btn use-btn" data-pick-driver="${d.employee_id}" ${!dv ? "disabled" : ""}>เพิ่ม</button>
            </div>`;
          }).join("")}
        </div>
        <div id="ad-err"></div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector("#sh-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  overlay.querySelectorAll("[data-pick-driver]").forEach(b=>{

      try{
        await api(`/tasks/${taskId}/add-driver`, {method:"POST", body: JSON.stringify({driver_employee_id: b.dataset.pickDriver})});

        toast("เพิ่มคนขับแล้ว");

      }catch(e){
        overlay.querySelector("#ad-err").innerHTML = "";

      }
    };

async function openAssignSheet(taskId, isReassign){
  let selectedDriver = null;
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>${isReassign ? "มอบหมายใหม่" : "มอบหมายงาน"} #${taskId}</h2><button id="sh-close">✕</button></div>
        <div class="field-note">รถจะใช้คันที่คนขับเช็คอินไว้โดยอัตโนมัติ ไม่ต้องเลือกเอง</div>
        <div id="as-selected" class="info" style="display:none;"></div>
        <label>ETA (นาทีจากนี้ ไม่บังคับ)</label>
        <input id="as-eta" type="number" min="1" placeholder="เช่น 20" />
        <label>เหตุผล ${isReassign ? "(ระบุบริบท เช่น รถเสีย)" : "(ไม่บังคับ)"}</label>
        <textarea id="as-reason" rows="2" placeholder="เช่น คนขับเดิมแจ้งรถขัดข้อง"></textarea>
        <label>ค้นหาคนขับ</label>
        <input id="as-driver-search" placeholder="พิมพ์ชื่อหรือรหัสพนักงาน..." />
        <div class="suggest-box" id="as-driver-list"><b>คนขับทั้งหมด (เลือกได้แม้ไม่ว่าง)</b>
          ${state.drivers.map(d=>{
            const dv = state.vehicles.find(v=> v.id === d.checked_in_vehicle_id);
            const badgeClass = d.driver_status === "Available" ? "ok" : d.driver_status === "Breakdown" ? "bad" : "warn";
            return `<div class="suggest-item" data-driver-name="${(d.full_name||d.employee_id).toLowerCase()} ${d.employee_id.toLowerCase()}">
              <span>${d.full_name || d.employee_id} <span class="badge ${badgeClass}">${DRIVER_STATUS_LABEL[d.driver_status]||d.driver_status}</span><br/>
              <span style="color:var(--ink-dim)">สิทธิ์: ${d.license_types||'-'} ${dv ? '· รถ: '+dv.code : '· ยังไม่ได้เช็คอินรถ'}</span></span>
              <button class="btn use-btn" data-pick-driver="${d.employee_id}" ${!dv ? "disabled" : ""}>เลือก</button>
            </div>`;
          }).join("")}
        </div>
        <div id="as-eligibility"></div>
        <button class="primary" id="as-submit">${isReassign ? "ยืนยันมอบหมายใหม่" : "ยืนยันมอบหมาย"}</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector("#sh-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };

  function pickDriver(empId){
    const d = state.drivers.find(x=> x.employee_id === empId);
    const dv = d && state.vehicles.find(v=> v.id === d.checked_in_vehicle_id);
    if(!dv){ toast("คนขับคนนี้ยังไม่ได้เช็คอินรถ"); return; }
    selectedDriver = empId;
    const box = overlay.querySelector("#as-selected");
    box.style.display = "block";
    box.textContent = `เลือกแล้ว: ${d.full_name || d.employee_id} · รถ ${dv.code}`;
  }
  overlay.querySelectorAll("[data-pick-driver]").forEach(b=> b.onclick = ()=> pickDriver(b.dataset.pickDriver));
  overlay.querySelector("#as-driver-search").addEventListener("input", (e)=>{
    const q = e.target.value.trim().toLowerCase();
    overlay.querySelectorAll("#as-driver-list [data-driver-name]").forEach(row=>{
      row.style.display = row.dataset.driverName.includes(q) ? "" : "none";
    });
  });

  async function submit(force){
    if(!selectedDriver){ toast("กรุณาเลือกคนขับก่อน"); return; }
    const body = {
      driver_employee_id: selectedDriver,
      reason: overlay.querySelector("#as-reason").value.trim(),
      force: !!force,
    };
    const etaVal = overlay.querySelector("#as-eta").value;
    if(etaVal) body.estimated_minutes = parseInt(etaVal);
    try{
      await api(`/tasks/${taskId}/${isReassign ? "reassign" : "assign"}`, {method:"POST", body: JSON.stringify(body)});
      closeSheet(overlay);
      toast(isReassign ? "มอบหมายใหม่แล้ว" : "มอบหมายแล้ว");
      await refreshAll();
    }catch(e){
      if(e.status === 409){
        const box = overlay.querySelector("#as-eligibility");
        box.innerHTML = "";
        box.appendChild(el(`<div class="err">${e.message}</div>`));
        const overrideBtn = el(`<button class="btn amber" style="width:100%;margin-top:8px;" id="as-force">ยืนยันมอบหมายทั้งที่ไม่ตรงเงื่อนไข</button>`);
        overrideBtn.onclick = ()=> submit(true);
        box.appendChild(overrideBtn);
      } else {
        toast(e.message);
      }
    }
  }
  overlay.querySelector("#as-submit").onclick = ()=> submit(false);
}

          <div class="l-sub">${u.role==='DRIVER' ? 'สิทธิ์: '+(driverInfo && driverInfo.license_types || '-') : (u.contact||'-')}${u.email ? ' · '+u.email : ''}</div></div>

      </div>`));
    });
    listWrap.appendChild(list);
    list.querySelectorAll("[data-edit-user]").forEach(b=> b.onclick = ()=> openUserEditSheet(b.dataset.editUser));
  }
  renderPeopleList();

          ${b.resolution_note ? `<div class="l-sub" style="color:var(--green);">แก้ไขโดย: ${b.resolution_note}</div>` : ""}</div>
        <span class="badge ${b.status==='Open' ? 'bad' : 'ok'}">${b.status === 'Open' ? 'ยังไม่แก้ไข' : 'แก้ไขแล้ว'}</span>

  });

function openUserEditSheet(userId){

  if(!u) return;
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>แก้ไข: ${u.full_name || u.employee_id}</h2><button id="sh-close">✕</button></div>

        <label>อีเมล @central.co.th</label><input id="ue-email" type="email" value="${u.email || ''}" placeholder="somchai@central.co.th" />
        <label>เบอร์ติดต่อ</label><input id="ue-contact" value="${u.contact || ''}" />
        <label>Cost Center (เฉพาะ USER)</label><input id="ue-cc" value="${u.cost_center || ''}" maxlength="5" />
        <label>สิทธิ์การใช้งาน (Role)</label>
        <select id="ue-role">
          ${["USER","DRIVER","ADMIN"].map(r=>`<option value="${r}" ${r===u.role?"selected":""}>${r}</option>`).join("")}
        </select>
        <button class="primary" id="ue-submit">บันทึก</button>
        <div class="grid2" style="margin-top:10px;">
          <button class="btn amber" id="ue-reset-pw" style="width:100%;">รีเซ็ตรหัสผ่าน</button>
          <button class="btn red" id="ue-delete" style="width:100%;">ลบผู้ใช้นี้</button>
        </div>
        <div id="ue-license-section" style="margin-top:20px;${u.role==='DRIVER'?'':'display:none;'}">
          <div class="section-title" style="margin-top:0;">ใบอนุญาตขับรถ</div>
          <div id="ue-license-list" class="card"><div class="empty">กำลังโหลด...</div></div>
          <div class="card">
            <div class="grid2">
              <div><label>ประเภทรถ</label><select id="ul-type">${state.vehicleTypes.map(vt=>`<option value="${vt.type_key}">${vt.type_name_th}</option>`).join("")}</select></div>
              <div><label>วันหมดอายุ</label><input id="ul-expiry" type="date" /></div>
            </div>
            <label style="display:flex;align-items:center;gap:8px;margin-top:10px;">
              <input type="checkbox" id="ul-permanent" style="width:auto;" checked /> ถาวร (ไม่มีวันหมดอายุ)
            </label>
            <button class="btn amber" id="ul-submit" style="width:100%;margin-top:10px;">เพิ่ม/แก้ไขใบอนุญาต</button>
          </div>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector("#sh-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };

  overlay.querySelector("#ue-role").onchange = (e)=>{
    overlay.querySelector("#ue-license-section").style.display = e.target.value === "DRIVER" ? "block" : "none";
  };
  overlay.querySelector("#ul-permanent").onchange = (e)=>{
    overlay.querySelector("#ul-expiry").disabled = e.target.checked;
  };
  overlay.querySelector("#ul-expiry").disabled = true;

  async function loadLicenses(){
    const box = overlay.querySelector("#ue-license-list");
    if(!box) return;
    try{
      const licenses = await api(`/admin/users/${userId}/licenses`);
      box.innerHTML = "";
      if(licenses.length === 0){ box.appendChild(el(`<div class="empty">ยังไม่มีใบอนุญาต</div>`)); return; }
      licenses.forEach(l=>{
        const expired = l.expiry_date && l.expiry_date < new Date().toISOString().slice(0,10);
        box.appendChild(el(`<div class="list-row">
          <span>${l.vehicle_type} ${l.expiry_date ? '· หมดอายุ '+l.expiry_date : '· ถาวร'} ${expired ? '<span class="badge bad">หมดอายุแล้ว</span>' : ''}</span>
          <button class="btn sm red" data-del-license="${l.vehicle_type}">ลบ</button>
        </div>`));
      });
      box.querySelectorAll("[data-del-license]").forEach(b=>{
        b.onclick = async ()=>{
          if(!confirm("ยืนยันลบใบอนุญาตนี้?")) return;
          try{ await api(`/admin/users/${userId}/licenses/${b.dataset.delLicense}`, {method:"DELETE"}); toast("ลบใบอนุญาตแล้ว"); await loadLicenses(); await refreshAll(); }
          catch(e){ toast(e.message); }
        };
      });
    }catch(e){ box.innerHTML=""; box.appendChild(el(`<div class="empty">โหลดไม่สำเร็จ</div>`)); }
  }
  if(u.role === "DRIVER") loadLicenses();

  overlay.querySelector("#ul-submit").onclick = async ()=>{
    const permanent = overlay.querySelector("#ul-permanent").checked;
    try{
      await api(`/admin/users/${userId}/licenses`, {method:"POST", body: JSON.stringify({
        vehicle_type: overlay.querySelector("#ul-type").value,
        expiry_date: permanent ? null : overlay.querySelector("#ul-expiry").value,
      })});
      toast("บันทึกใบอนุญาตแล้ว");
      await loadLicenses();
      await refreshAll();
    }catch(e){ toast(e.message); }
  };

  overlay.querySelector("#ue-submit").onclick = async ()=>{
    try{
      await api(`/admin/users/${userId}`, {method:"PUT", body: JSON.stringify({
        full_name: overlay.querySelector("#ue-name").value.trim(),
        email: overlay.querySelector("#ue-email").value.trim() || null,
        contact: overlay.querySelector("#ue-contact").value.trim(),
        cost_center: overlay.querySelector("#ue-cc").value.trim() || null,
        role: overlay.querySelector("#ue-role").value,
      })});
      toast("บันทึกแล้ว");
      closeSheet(overlay);
      await refreshAll();
    }catch(e){ toast(e.message); }
  };

  overlay.querySelector("#ue-reset-pw").onclick = async ()=>{
    if(!confirm(`ยืนยันรีเซ็ตรหัสผ่านของ ${u.full_name || u.employee_id}? บัญชีนี้จะถูกออกจากระบบทันที และต้องตั้งรหัสผ่านใหม่ตอนล็อกอินครั้งถัดไป`)) return;
    try{
      await api(`/admin/users/${userId}/reset-password`, {method:"POST"});
      toast("รีเซ็ตรหัสผ่านแล้ว — แจ้งพนักงานให้ล็อกอินใหม่เพื่อตั้งรหัสผ่าน");
    }catch(e){ toast(e.message); }
  };

  overlay.querySelector("#ue-delete").onclick = async ()=>{
    if(!confirm(`ยืนยันลบผู้ใช้ ${u.full_name || u.employee_id}? บัญชีจะเข้าระบบไม่ได้อีก (ประวัติงาน/แชทเดิมยังเก็บไว้ตามปกติ)`)) return;
    try{
      await api(`/admin/users/${userId}`, {method:"DELETE"});
      toast("ลบผู้ใช้แล้ว");
      closeSheet(overlay);
      await refreshAll();
    }catch(e){ toast(e.message); }
  };
}

function buildTaskDetailActions(t){
  const isChat = `<button class="btn" data-chat="${t.id}">💬 แชท</button>`;
  const dupBtn = `<button class="btn" data-duplicate="${t.id}">สร้างงานจากงานนี้</button>`;
  if(state.role === "USER"){
    if(t.status === "Waiting") return `<button class="btn" data-edit="${t.id}">แก้ไข</button><button class="btn" data-photo="${t.id}">เพิ่มรูป</button>${isChat}<button class="btn red" data-action="cancel">ยกเลิก</button>${dupBtn}`;
    if(t.status === "Assigned") return `${isChat}<button class="btn red" data-action="cancel">ยกเลิก</button>${dupBtn}`;
    if(t.status === "Completed" && !t.rating) return `<button class="btn amber" data-rate="${t.id}">ให้คะแนน</button>${isChat}${dupBtn}`;
    return isChat + dupBtn;
  }
  if(state.role === "DRIVER"){
    const mine = (t.drivers||[]).some(d=> d.employee_id === state.employee_id);
    const amPrimary = t.driver_employee_id === state.employee_id;
    const leaveBtn = ["Assigned","In Progress","Pause"].includes(t.status) ? `<button class="btn red" data-leave="${t.id}">ออกจากงาน</button>` : "";
    if(mine){
      if(t.status === "Assigned" && amPrimary && !t.accepted_at) return `<button class="btn amber" data-accept="${t.id}">รับงาน</button>${isChat}${leaveBtn}`;
      if(t.status === "Assigned" && amPrimary && t.accepted_at) return `<button class="btn green" data-action="start">เริ่มงาน</button>${isChat}${leaveBtn}`;
      if(t.status === "In Progress") return `<button class="btn green" data-action="complete">เสร็จงาน</button><button class="btn" data-pause="${t.id}">หยุดชั่วคราว</button>${isChat}${leaveBtn}`;
      if(t.status === "Pause") return `<button class="btn amber" data-action="resume">ทำงานต่อ</button>${isChat}${leaveBtn}`;
      return `${isChat}${leaveBtn}`;
    }
    if(t.status === "Waiting") return `<button class="btn amber" data-self-assign="${t.id}">รับงานนี้</button>`;
    if(["Assigned","In Progress","Pause"].includes(t.status)) return `<button class="btn green" data-join="${t.id}">เข้าร่วม</button><button class="btn blue" data-take-over="${t.id}">รับช่วงแทน</button>`;
    return "";
  }
  if(state.role === "ADMIN"){
    if(t.status === "Waiting") return `<button class="btn amber" data-assign="${t.id}">มอบหมายงาน</button>`;
    if(["Assigned","In Progress","Pause"].includes(t.status)) return `<button class="btn blue" data-reassign="${t.id}">มอบหมายใหม่</button><button class="btn green" data-add-driver="${t.id}">+ เพิ่มคนขับ</button><button class="btn purple" data-priority="${t.id}">ความสำคัญ</button>${isChat}${t.status !== "Assigned" ? `<button class="btn green" data-admin-complete="${t.id}">ทำเครื่องหมายเสร็จ</button>` : ""}<button class="btn red" data-action="cancel">ยกเลิก</button>`;
    return isChat;
  }
  return "";
}

function relTime(iso){
  const d = new Date(iso);
  const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
  if(diffMin < 1) return "เมื่อสักครู่";
  if(diffMin < 60) return `${diffMin} นาทีที่แล้ว`;
  const diffHr = Math.floor(diffMin / 60);
  if(diffHr < 24) return `${diffHr} ชั่วโมงที่แล้ว`;
  return fmtTime(iso);
}
function notifDayGroup(iso){
  const d = new Date(iso);
  const now = new Date();
  const sameDay = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
  if(sameDay(d, now)) return "วันนี้";
  if(sameDay(d, yesterday)) return "เมื่อวาน";
  return "ก่อนหน้านี้";
}
function notifIcon(n){
  if(n.kind === "chat") return {cls:"chat", emoji:"💬"};
  if(n.kind === "team_chat") return {cls:"chat", emoji:"👥"};
  if(n.message && n.message.startsWith("[Admin]")) return {cls:"admin", emoji:"📢"};
  if(n.message && n.message.includes("ได้รับการแก้ไขแล้ว")) return {cls:"warn", emoji:"⚠️"};
  return {cls:"task", emoji:"📦"};
}

// ---------------- Data refresh (simple polling = "real-time enough") ----------------
// Cheap non-cryptographic hash, just to tell "same payload" from "changed".
function _sig(s){
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return h + ":" + s.length;
}

// Even with identical data, repaint occasionally so elapsed-time labels
// ("รอมา 12 นาที", "ติดงานมา 30 นาที") don't freeze on screen.
const FORCE_RENDER_AFTER_MS = 120000;

let _refreshAbort = null;
async function refreshAll(opts={}){
  // One combined request instead of ~14 separate ones. The scope tells the
  // server exactly how much to send based on which tab is open (#4: don't
  // fetch admin operation data while sitting on the dashboard, etc.), and it
  // all comes back in a single round-trip (#2), so a refresh is one network
  // hit instead of fourteen.
  let scope = "core";
  if(state.role === "DRIVER") scope = "driver";
  else if(state.role === "ADMIN"){
    scope = (state.tab === "dashboard") ? "admin_dash" : "admin_ops";
  }
  // Only one refresh in flight at a time. A manual tap, a push-triggered
  // refresh and the background timer can all fire close together; without
  // this, a slow earlier response could land after a newer one and overwrite
  // fresh data with stale data.
  if(_refreshAbort) _refreshAbort.abort();
  const ctrl = new AbortController();
  _refreshAbort = ctrl;
  try{
    const d = await api("/app-data?scope=" + scope, {background: !opts.visible, signal: ctrl.signal});
    // Merge returned keys into state (only overwrites what the scope included,
    // so data from another tab stays cached until you go back to it).
    Object.assign(state, d);
    state.consecutiveFailures = 0;
    state.lastUpdated = new Date();
    state._payloadSig = _sig(JSON.stringify(d));
    hideConnBanner();
  }catch(e){
    // Superseded by a newer refresh — not a failure, and the newer one owns
    // the outcome. Must not count towards the failure/backoff counter.
    if(e.name === "AbortError" || ctrl.signal.aborted) return;
    state.consecutiveFailures = (state.consecutiveFailures || 0) + 1;
    if(state.consecutiveFailures >= 2) showConnBanner();
    updateRefreshBar();
    // don't re-render on a failed poll — keep showing the last good data
    return;
  }finally{
    if(_refreshAbort === ctrl) _refreshAbort = null;
  }
  try{
    // Bug fix: skip re-rendering the tab body while the user is typing into a
    // form inside it, so a poll never blanks out unsaved input. Also skip it
    // for the Admin dashboard specifically — its KPI/chart cards load
    // asynchronously and rebuilding them every cycle caused a visible flicker
    // even though the underlying numbers rarely change that often. The
    // dashboard reloads when opened, when the period changes, or via its own
    // manual/pull-to-refresh.
    const onAdminDashboard = state.role === "ADMIN" && state.tab === "dashboard";
    // Third condition, and the important one for how the app FEELS: if the
    // payload is byte-identical to the last one we rendered, there is nothing
    // to repaint. Most polls return unchanged data, and rebuilding the whole
    // tab body anyway was both the jank and the cause of the extra requests —
    // several tab renderers fetch their own data as part of rendering, so a
    // pointless repaint also meant a pointless round-trip with the loading bar
    // switched on. A manual refresh always repaints; so does a screen that has
    // gone stale enough for its elapsed-time labels to be wrong.
    const unchanged = state._payloadSig && state._payloadSig === state._renderedSig;
    const stale = !state._lastRenderAt || (Date.now() - state._lastRenderAt) > FORCE_RENDER_AFTER_MS;
    if(!userIsTypingInMain() && !onAdminDashboard && (opts.visible || !unchanged || stale)){
      renderContent();
      state._renderedSig = state._payloadSig;
      state._lastRenderAt = Date.now();
    }
    const bell = document.getElementById("bell");
    if(bell){
      const unread = state.notifications.filter(n=>!n.is_read).length;
      bell.innerHTML = `🔔${unread ? '<span class="bell-dot"></span>' : ''}`;
    }
    updateHeaderFromState();
    updateRefreshBar();
  }catch(e){ /* render error shouldn't break the poll loop */ }
}

function updateHeaderFromState(){

  // without a full page reload — patched here (not rebuilt via renderShell,

  const brandB = document.querySelector("#brand-btn b");
  if(brandB && state.me){

let pollTimer = null;
async function bootstrap(){
  try{
    state.me = await api("/me");
  }catch(e){ logout(); return; }
  // /me is the source of truth for role/employee_id — trust it over the
  // localStorage copy, which can be stale, missing, or the literal string
  // "null" (e.g. saved before login completed, or cleared out of sync). If
  // we skip this, state.role can stay null even though the account loaded
  // fine, and then tabsDef[state.role] is undefined → the tab bar crashes
  // and the whole page renders blank with a "null" role pill.
  if(state.me && state.me.role){
    state.role = state.me.role;
    state.employee_id = state.me.employee_id;
    localStorage.setItem("scdc_role", state.me.role);
    localStorage.setItem("scdc_emp", state.me.employee_id);
  }
  if(!state.role){
    // No usable role even after /me — the session is broken; send them back
    // to a clean login rather than a dead blank screen.
    logout();
    return;
  }
  if(state.role === "DRIVER" && !state.me.checked_in_vehicle_id){
    renderForcedCheckin();
    return;
  }
  renderShell();
  await refreshAll();
  startPolling();
  maybeAutoPromptNotifications(); // fire-and-forget; never blocks app usage
}

// Refresh strategy.
//
// Push is the primary signal now: the service worker forwards every push to
// the open page, which refreshes immediately, so new work still lands within
// seconds of being created. The timer below is a SAFETY NET, not the main
// mechanism — it exists because Web Push is not guaranteed (iOS only delivers
// to a home-screen-installed PWA, Android battery saver can delay or drop
// messages, and a driver may simply have declined the permission). Going
// push-only would mean a missed push is a missed job, which is not an
// acceptable trade for a dispatch system.
//
// Net effect vs the old fixed 5s poll: roughly 6x fewer requests while the
// app is open, and zero while it is in the background.
const POLL_INTERVAL_MS = 30000;
// On repeated failure, back off instead of hammering a struggling server.
const POLL_BACKOFF_MS = [30000, 60000, 120000];

function nextPollDelay(){
  const fails = state.consecutiveFailures || 0;
  if(!fails) return POLL_INTERVAL_MS;
  return POLL_BACKOFF_MS[Math.min(fails - 1, POLL_BACKOFF_MS.length - 1)];
}

// Self-scheduling poll instead of setInterval: each cycle only schedules the
// next one AFTER it finishes, so slow cycles (serverless latency) never pile
// up on top of each other the way a fixed interval would.
function startPolling(){
  stopPolling();
  const tick = async ()=>{
    if(!state.token) return;
    // Never poll a backgrounded tab. A driver leaves this app open all shift;
    // polling behind a locked screen burns their battery and our quota for a
    // screen nobody is looking at. visibilitychange re-syncs on return.
    if(!document.hidden) await refreshAll();
    if(state.token) pollTimer = setTimeout(tick, nextPollDelay());
  };
  pollTimer = setTimeout(tick, nextPollDelay());
}
function stopPolling(){
  if(pollTimer){ clearTimeout(pollTimer); pollTimer = null; }
}

// Keep the "อัปเดต N นาทีที่แล้ว" label honest between refreshes. This is a
// local clock tick only — it never touches the network.
setInterval(updateRefreshBar, 10000);

// Coming back to the app is the moment stale data is most likely and most
// visible, so always re-sync straight away rather than waiting for the timer.
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) return;
  if(state.token){ refreshAll(); startPolling(); }
});
window.addEventListener("online", ()=>{
  if(state.token){ refreshAll(); startPolling(); }
});

// A push means something actually changed — refresh immediately instead of
// waiting up to 30s for the next tick. This is what lets the poll interval be
// as long as it is.
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", (e)=>{
    if(e.data && e.data.type === "scdc-refresh" && state.token) refreshAll();
  });
}

function render(){
  stopPolling();
  if(state.token){ bootstrap(); } else { renderLogin(); }
}

render();
</script>
</body>
</html>
