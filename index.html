<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" id="viewport-meta" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>SCDC · ระบบจัดการงานรถ Handling</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f5f6f8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --panel-2:#eef0f3; --line:#dde1e6;
    --ink:#1a1f26; --ink-dim:#6b7280; --amber:#2563eb; --amber-dim:#dbe6fc;
    --blue:#0d9488; --green:#15803d; --red:#dc2626; --purple:#7c3aed; --slate:#64748b;
    --warn:#b45309; --warn-dim:#fef3c7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Noto Sans Thai','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  code,.mono{font-family:'JetBrains Mono',monospace;}
  ::selection{background:var(--amber-dim);}

  /* Stop the browser's native pull-to-refresh from reloading the whole
     document. A reload throws away scroll position and in-flight UI state;
     the app wires its own pull handler below that refetches data in place. */
  html,body{overscroll-behavior-y:contain;}
  #pull-indicator{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--ink-dim);background:var(--panel-2);transition:height .15s ease;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg); position:relative; border-left:1px solid var(--line); border-right:1px solid var(--line);}
  header.topbar{position:sticky;top:0;z-index:5;background:var(--bg);
    border-bottom:1px solid var(--line); padding:14px 16px; display:flex; align-items:center; justify-content:space-between;}
  /* Manual refresh strip. Sticks directly under the header so "how fresh is
     this?" and "refresh it" are always one glance / one tap away, which is
     what makes a 30s poll interval acceptable. */
  #notif-banner{display:flex;gap:12px;align-items:center;padding:12px 16px;
    background:var(--warn-dim);color:var(--warn);border-bottom:1px solid var(--line);}
  #refresh-bar{position:sticky;top:57px;z-index:4;background:var(--panel);
    border-bottom:1px solid var(--line); padding:7px 16px; cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:12px;color:var(--ink-dim);user-select:none;
    -webkit-tap-highlight-color:transparent;}
  #refresh-bar:active{background:var(--panel-2);}
  #refresh-bar-icon{font-size:13px;line-height:1;display:inline-block;}
  #refresh-bar-icon.spin{animation:scdc-spin .8s linear infinite;}
  @keyframes scdc-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){
    #refresh-bar-icon.spin{animation:none;opacity:.5;}
  }

  .brand{display:flex;align-items:center;gap:10px;}
  .logo-mark{width:28px;height:28px;border-radius:8px;background:var(--amber);display:flex;
    align-items:center;justify-content:center;flex:none;}
  .logo-mark svg{width:16px;height:16px;display:block;}
  .brand b{letter-spacing:.02em;}
  .brand small{display:block;color:var(--ink-dim);font-size:11px;letter-spacing:.03em;}
  .role-pill{font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim);
    letter-spacing:.03em;}
  main{flex:1;padding:16px;padding-bottom:90px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:28px 24px;}
  .login-card .mark{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .login-card .mark .logo-mark{width:36px;height:36px;border-radius:10px;}
  .login-card .mark .logo-mark svg{width:21px;height:21px;}
  .login-card h1{font-size:19px;margin:2px 0 2px;letter-spacing:.01em;}
  .login-card p.sub{color:var(--ink-dim);font-size:13px;margin:0 0 20px;}
  label{display:block;font-size:12px;color:var(--ink-dim);margin:14px 0 6px;}
  input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:11px 12px;font-size:14px;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;
    background:var(--panel-2);border:1px solid var(--line);outline:none;padding:0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
    background:var(--amber);cursor:pointer;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--amber);}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--amber);
    cursor:pointer;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--amber);}
  .battery-row{display:flex;align-items:center;gap:12px;}
  .battery-row input[type=range]{flex:1;}
  .battery-val{min-width:48px;text-align:right;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--amber);}
  .slider-num-input{width:64px;flex:none;text-align:center;font-weight:700;color:var(--amber);padding:8px 4px;}
  button.primary{width:100%;margin-top:20px;background:var(--amber);color:#ffffff;border:none;
    padding:12px;border-radius:8px;font-weight:700;font-size:14px;letter-spacing:.01em;cursor:pointer;}
  button.primary:active{transform:translateY(1px);}
  button.ghost{width:100%;margin-top:10px;background:transparent;color:var(--ink-dim);border:1px solid var(--line);
    padding:11px;border-radius:8px;font-size:13px;cursor:pointer;}
  .err{background:#fee2e2;border:1px solid #fca5a5;color:var(--red);font-size:12.5px;padding:8px 10px;
    border-radius:6px;margin-top:12px;}
  .info{background:#ccfbf1;border:1px solid #5eead4;color:var(--blue);font-size:12.5px;padding:8px 10px;
    border-radius:6px;margin-top:12px;}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);
    max-width:520px;margin:0 auto;display:flex;padding:6px;gap:4px;z-index:6;overflow-x:auto;}
  nav.tabs button{flex:1 0 auto;min-width:60px;background:none;border:none;color:var(--ink-dim);padding:10px 4px;border-radius:8px;
    font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
  nav.tabs button.active{background:var(--panel-2);color:var(--amber);}

  .section-title{font-size:12px;color:var(--ink-dim);
    margin:18px 0 10px;display:flex;align-items:center;justify-content:space-between;font-weight:600;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 14px 12px;margin-bottom:12px;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
  .card.st-waiting::before{background:var(--slate);}
  .card.st-assigned::before{background:var(--blue);}
  .card.st-progress::before{background:var(--amber);}
  .card.st-pause::before{background:var(--purple);}
  .card.st-completed::before{background:var(--green);}
  .card.st-cancelled::before{background:var(--red);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
  .task-code{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;letter-spacing:.02em;}
  .status-chip{font-size:11px;font-weight:700;
    padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .status-chip .dot{width:6px;height:6px;border-radius:50%;}
  .st-waiting .status-chip{background:#eef0f3;color:var(--slate);}
  .st-waiting .dot{background:var(--slate);}
  .st-assigned .status-chip{background:#ccfbf1;color:var(--blue);}
  .st-assigned .dot{background:var(--blue);}
  .st-progress .status-chip{background:#dbeafe;color:var(--amber);}
  .st-progress .dot{background:var(--amber);box-shadow:0 0 6px var(--amber);animation:pulse 1.4s infinite;}
  .st-pause .status-chip{background:#ede9fe;color:var(--purple);}
  .st-pause .dot{background:var(--purple);}
  .st-completed .status-chip{background:#dcfce7;color:var(--green);}
  .st-completed .dot{background:var(--green);}
  .st-cancelled .status-chip{background:#fee2e2;color:var(--red);}
  .st-cancelled .dot{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .accepted-badge{display:inline-block;font-size:10px;color:var(--green);border:1px solid #86efac;
    background:#dcfce7;padding:2px 7px;border-radius:999px;margin-left:6px;}
  .blocked-banner{background:var(--warn-dim);border:1px solid var(--warn);color:var(--warn);font-size:12.5px;
    padding:8px 10px;border-radius:8px;margin-bottom:10px;}
  .route{font-size:14px;font-weight:600;margin:2px 0 6px;}
  .route .arrow{color:var(--ink-dim);margin:0 6px;}
  .meta-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-dim);margin-bottom:10px;}
  .meta-row b{color:var(--ink);font-weight:600;}
  .priority-High{color:var(--red);}
  .priority-Normal{color:var(--ink-dim);}
  .priority-Low{color:var(--slate);}
  .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:12.5px;font-weight:600;
    padding:8px 12px;border-radius:7px;cursor:pointer;}
  .btn.amber{background:var(--amber);color:#ffffff;border-color:var(--amber);}
  .btn.green{background:var(--green);color:#ffffff;border-color:var(--green);}
  .btn.red{background:transparent;color:var(--red);border-color:#fca5a5;}
  .btn.blue{background:var(--blue);color:#ffffff;border-color:var(--blue);}
  .btn.purple{background:var(--purple);color:#ffffff;border-color:var(--purple);}
  .btn.sm{padding:8px 12px;font-size:11px;min-height:32px;}
  .empty{color:var(--ink-dim);font-size:13px;text-align:center;padding:40px 10px;border:1px dashed var(--line);
    border-radius:var(--radius);}
  .thumb{width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin:8px 0;display:block;border:1px solid var(--line);}

  .fab{position:fixed;right:calc(50% - 260px + 16px);bottom:76px;background:var(--amber);color:#ffffff;
    width:52px;height:52px;border-radius:50%;border:none;font-size:26px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 18px rgba(37,99,235,.3);z-index:7;}
  @media (max-width:560px){.fab{right:16px;}}

  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;
    justify-content:center;}
  .sheet{width:100%;max-width:520px;background:var(--panel);border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;padding:18px 18px 26px;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;}
  .sheet h2{font-size:16px;margin:0 0 4px;}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .sheet-head button{background:none;border:none;color:var(--ink-dim);font-size:20px;cursor:pointer;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .field-note{font-size:11.5px;color:var(--ink-dim);margin-top:4px;}
  .suggest-box{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px;
    font-size:12.5px;margin-top:10px;max-height:280px;overflow-y:auto;}
  .suggest-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
    border-bottom:1px solid var(--line);}
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item .use-btn{font-size:11px;padding:5px 9px;}

  .bell-btn{position:relative;background:none;border:none;color:var(--ink-dim);font-size:18px;cursor:pointer;}
  .bell-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--red);border-radius:50%;}

  .notif-row{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);position:relative;cursor:pointer;}
  .notif-row:last-child{border-bottom:none;}
  .notif-row.unread{background:var(--amber-dim);margin:0 -18px;padding:10px 18px;}
  .notif-row.unread::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);}
  .notif-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:14px;flex:none;}
  .notif-icon.task{background:#dcfce7;}
  .notif-icon.chat{background:var(--amber-dim);}
  .notif-icon.warn{background:var(--warn-dim);}
  .notif-icon.admin{background:#ede9fe;}
  .notif-body{flex:1;min-width:0;}
  .notif-msg{font-size:13px;line-height:1.5;color:var(--ink);}
  .notif-row.unread .notif-msg{font-weight:600;}
  .notif-time{font-size:11px;color:var(--ink-dim);margin-top:3px;}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;}
  .stat .n{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;}
  .stat .l{font-size:10.5px;color:var(--ink-dim);margin-top:2px;}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--panel-2);
    border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:8px;font-size:12.5px;
    z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:90%;text-align:center;}

  /* Global loading bar — thin animated strip pinned to the very top */
  #global-loader{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;background:var(--amber-dim);overflow:hidden;}
  #global-loader .global-loader-fill{position:absolute;top:0;left:0;height:100%;width:40%;
    background:var(--amber);border-radius:0 2px 2px 0;animation:loaderslide 1.1s ease-in-out infinite;}
  @keyframes loaderslide{
    0%{left:-40%;width:40%;}
    50%{width:55%;}
    100%{left:100%;width:40%;}
  }
  /* Inline spinner for buttons/sections */
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);
    border-top-color:var(--amber);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .subtabs button{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);
    padding:7px 12px;border-radius:999px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .subtabs button.active{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);}
  .list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);
    font-size:13px;gap:8px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .l-main{font-weight:600;}
  .list-row .l-sub{color:var(--ink-dim);font-size:11.5px;}
  .badge{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);}
  .badge.ok{color:var(--green);border-color:#86efac;}
  .badge.warn{color:var(--warn);border-color:var(--warn);}
  .badge.bad{color:var(--red);border-color:#fca5a5;}

  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .chip{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);padding:6px 10px;
    border-radius:999px;font-size:12px;cursor:pointer;}
  .chip.active{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);}

  .chat-log{flex:1;overflow-y:auto;max-height:44vh;margin:10px 0;padding:4px 2px;}
  .chat-msg{max-width:80%;margin-bottom:8px;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.4;}
  .chat-msg.mine{background:var(--amber-dim);color:var(--amber);margin-left:auto;border-bottom-right-radius:3px;}
  .chat-msg.theirs{background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:3px;}
  .chat-msg .who{font-size:10.5px;color:var(--ink-dim);margin-bottom:3px;font-weight:600;}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row input{flex:1;}

  .driver-status-pill{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
    color:var(--ink-dim);white-space:nowrap;}
  .driver-status-pill.on{color:var(--green);border-color:#86efac;}
  .driver-status-pill.off{color:var(--ink-dim);}
  .driver-status-pill.busy{color:var(--warn);border-color:var(--warn);}
  .driver-status-pill.bad{color:var(--red);border-color:#fca5a5;}
  .task-chip-btn{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber);
    font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;cursor:pointer;font-family:'JetBrains Mono',monospace;}

  .vehicle-pick-list{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
  .vehicle-pick-item{display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;}
  .vehicle-pick-item.selected{border-color:var(--amber);background:var(--amber-dim);}
  .vehicle-pick-item .vp-main{font-weight:700;font-family:'JetBrains Mono',monospace;}
  .vehicle-pick-item .vp-sub{font-size:11.5px;color:var(--ink-dim);}

  /* ---------------- Desktop / larger screens ---------------- */
  @media (min-width:900px){
    body{ }
    #app.app-full{max-width:none;border:none;display:block;}
    #app:not(.app-full){
      max-width:1080px;
      display:grid;
      grid-template-columns:230px 1fr;
      grid-template-rows:auto 1fr;
      grid-template-areas:
        "sidebar header"
        "sidebar main";
      border:1px solid var(--line);
      border-radius:14px;
      margin:28px auto;
      min-height:calc(100vh - 56px);
      overflow:hidden;
      box-shadow:0 8px 32px rgba(0,0,0,.1);
    }
    #app:not(.app-full) header.topbar{grid-area:header;position:sticky;top:0;}
    #app:not(.app-full) nav.tabs{
      grid-area:sidebar;position:static;flex-direction:column;max-width:none;
      border-top:none;border-right:1px solid var(--line);height:100%;
      padding:18px 10px;overflow-x:visible;gap:2px;
    }
    #app:not(.app-full) nav.tabs button{
      flex:none;width:100%;text-align:left;padding:11px 14px;font-size:13px;
    }
    #app:not(.app-full) main{grid-area:main;padding-bottom:24px;max-width:760px;}
    .fab{right:calc(50% - 540px + 40px) !important;bottom:40px !important;}
    .sheet-overlay{align-items:center;}
    .sheet{max-width:560px;border-radius:16px;max-height:82vh;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const API = "";
const MIN_PASSWORD_LENGTH = 6;

// Live-formats a phone input as xxx-xxx-xxxx while typing, and exposes a
// matching validator so the same 9-10 digit rule the backend enforces can be
// checked client-side before submitting.
function wirePhoneAutoFormat(inputEl){
  inputEl.addEventListener("input", ()=>{
    let digits = inputEl.value.replace(/\D/g, "").slice(0, 10);
    let formatted = digits;
    if(digits.length > 6) formatted = digits.slice(0,3) + "-" + digits.slice(3,6) + "-" + digits.slice(6);
    else if(digits.length > 3) formatted = digits.slice(0,3) + "-" + digits.slice(3);
    inputEl.value = formatted;
  });
}
function isValidThaiPhoneJS(value){
  const digits = (value || "").replace(/\D/g, "");
  return /^0\d{8,9}$/.test(digits);
}

// Pinch/double-tap zoom preference — a per-device setting (not per-account),
// so it deliberately lives in its own localStorage key that logout() never
// touches: it survives logging out and back in on the same phone/browser,
// but won't follow the person to a different device (same as most browser-
// level display preferences).
const ZOOM_PREF_KEY = "scdc_zoom_enabled";
function isZoomEnabled(){
  // DISABLED by default: this is used one-handed on a moving vehicle, where an
  // accidental pinch or double-tap zoom is far more likely than a deliberate
  // one. Anyone who needs to zoom can turn it on in Profile, and that choice
  // sticks on their device.
  return localStorage.getItem(ZOOM_PREF_KEY) === "true";
}
function setZoomEnabled(enabled){
  localStorage.setItem(ZOOM_PREF_KEY, enabled ? "true" : "false");
  applyZoomPreference();
}
function applyZoomPreference(){
  const meta = document.getElementById("viewport-meta");
  if(!meta) return;
  meta.content = isZoomEnabled()
    ? "width=device-width, initial-scale=1, viewport-fit=cover"
    : "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";
}
applyZoomPreference();

// Marks that the person has been shown the notification banner AND answered
// it, so they aren't nagged on every launch. Written only on an explicit
// dismissal — see maybeAutoPromptNotifications() for why a failed attempt must
// never set it.
const NOTIF_PROMPTED_KEY = "scdc_notif_prompted";

// iOS only delivers Web Push to a PWA that has been installed to the home
// screen AND opened from that icon. Permission granted in Safari does not
// carry over to the installed app — it is a separate context with its own
// permission state and its own storage. This is the single most common reason
// notifications "just don't work" on iPhone.
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent || "")
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function isStandalone(){
  return window.navigator.standalone === true
    || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
}
function pushSupported(){
  return ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
}
// Notifications are opt-in through a visible banner, NOT an automatic prompt.
//
// The previous version called Notification.requestPermission() straight out of
// bootstrap(). Two things went wrong with that:
//   1. iOS requires the permission request to come from a user gesture. Called
//      on page load it is refused outright, which silently burns the request.
//   2. It wrote the "already prompted" flag BEFORE attempting, and swallowed
//      every error, so a failed attempt permanently stopped the app from ever
//      asking again — with no visible trace anywhere in the UI.
// Together those meant a driver could install the app, be asked nothing, and
// never receive a single notification.
//
// Now: a banner explains what they'd get and waits for a tap. The flag is only
// written when the person actually dismisses it.
async function maybeAutoPromptNotifications(){
  if(localStorage.getItem(NOTIF_PROMPTED_KEY)) return;
  if(!pushSupported()) return;
  if(location.protocol !== "https:" && location.hostname !== "localhost") return;
  if(Notification.permission !== "default") return;  // already decided at the browser level
  // On iOS there is no point asking until the app is installed — the request
  // cannot succeed from a Safari tab. Point them at the real first step.
  if(isIOS() && !isStandalone()){ showNotifBanner("ios-install"); return; }
  try{
    const status = await api("/push/status");
    if(!status.available || status.subscribed) return;
    showNotifBanner("enable");
  }catch(e){ /* Profile page still offers the manual toggle + test */ }
}

function showNotifBanner(mode){
  if(document.getElementById("notif-banner")) return;
  const isInstallHint = mode === "ios-install";
  const body = isInstallHint
    ? `แตะปุ่มแชร์ แล้วเลือก "เพิ่มลงในหน้าจอโฮม" จากนั้นเปิดแอปจากไอคอนนั้น จึงจะเปิดแจ้งเตือนได้`
    : `เปิดแจ้งเตือนเพื่อรับงานใหม่และข้อความทันที แม้ไม่ได้เปิดแอปค้างไว้`;
  const banner = el(`<div id="notif-banner">
    <div style="flex:1;">
      <div style="font-weight:700;margin-bottom:3px;">🔔 การแจ้งเตือน</div>
      <div style="font-size:12px;line-height:1.5;">${body}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:none;">
      ${isInstallHint ? "" : `<button class="btn amber" id="nb-enable" style="padding:8px 12px;">เปิด</button>`}
      <button class="btn" id="nb-dismiss" style="padding:8px 12px;">ไม่ใช่ตอนนี้</button>
    </div>
  </div>`);
  const anchor = document.getElementById("main");
  if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(banner, anchor);
  else document.body.appendChild(banner);

  banner.querySelector("#nb-dismiss").onclick = ()=>{
    // Only NOW do we record that they were asked — a dismissal is a real answer.
    try{ localStorage.setItem(NOTIF_PROMPTED_KEY, "true"); }catch(e){}
    banner.remove();
  };
  const enableBtn = banner.querySelector("#nb-enable");
  if(enableBtn){
    enableBtn.onclick = async ()=>{
      enableBtn.disabled = true;
      enableBtn.textContent = "กำลังเปิด...";
      try{
        // Runs inside the click handler, which is what iOS requires.
        await subscribeToPush();
        banner.remove();
        toast("เปิดการแจ้งเตือนแล้ว");
        try{ await api("/push/test", {method:"POST"}); }catch(e){}
      }catch(e){
        enableBtn.disabled = false;
        enableBtn.textContent = "เปิด";
        toast(e.message || "เปิดการแจ้งเตือนไม่สำเร็จ");
      }
    };
  }
}

// Dual input: slider for quick adjustment, editable number box for exact
// values — dragging a slider makes it hard to land on an exact number (e.g.
// "23 pallets" precisely), so both stay in sync and either one works.
function dualSliderHTML(id, defaultVal, min, max, unit){
  return `<div class="battery-row">
    <input id="${id}" type="range" min="${min}" max="${max}" value="${defaultVal}" />
    <input id="${id}-num" type="number" min="${min}" max="${max}" value="${defaultVal}" class="slider-num-input" />
    ${unit ? `<span class="field-note" style="white-space:nowrap;">${unit}</span>` : ""}
  </div>`;
}
function wireDualSlider(container, id, min, max){
  const slider = container.querySelector(`#${id}`);
  const num = container.querySelector(`#${id}-num`);
  if(!slider || !num) return;
  slider.oninput = ()=>{ num.value = slider.value; };
  num.oninput = ()=>{
    let v = parseInt(num.value, 10);
    if(isNaN(v)) return;
    v = Math.max(min, Math.min(max, v));
    slider.value = v;
  };
  num.onblur = ()=>{
    let v = parseInt(num.value, 10);
    if(isNaN(v)) v = min;
    v = Math.max(min, Math.min(max, v));
    num.value = v;
    slider.value = v;
  };
}
function fmtTime(iso){ if(!iso) return "-"; const d=new Date(iso); return d.toLocaleString('th-TH',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}); }
function fmtClock(date){ return date ? date.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : "-"; }

// Generic pull-to-refresh: only engages when the page is already scrolled to
// the very top (so it never fights with normal scrolling further down), and
// only while pulling DOWN past a threshold. Shows a small indicator that
// grows with the pull, then calls onRefresh() and animates back to closed.
function wirePullToRefresh(container, indicatorEl, onRefresh){
  let startY = null, pulling = false;
  const MAX_PULL = 70, THRESHOLD = 50;
  container.addEventListener("touchstart", (e)=>{
    if(window.scrollY <= 0){ startY = e.touches[0].clientY; pulling = true; }
  }, {passive: true});
  container.addEventListener("touchmove", (e)=>{
    if(!pulling || startY === null) return;
    const dy = e.touches[0].clientY - startY;
    if(dy > 0){
      const h = Math.min(MAX_PULL, dy * 0.5);
      indicatorEl.style.height = h + "px";
      indicatorEl.textContent = h >= THRESHOLD ? "ปล่อยเพื่อรีเฟรช" : "ดึงลงเพื่อรีเฟรช";
    }
  }, {passive: true});
  container.addEventListener("touchend", ()=>{
    if(pulling && parseInt(indicatorEl.style.height || "0") >= THRESHOLD){
      indicatorEl.textContent = "กำลังรีเฟรช...";
      onRefresh();
    }
    indicatorEl.style.height = "0";
    pulling = false; startY = null;
  });
}

function updateRefreshBar(){
  const txt = document.getElementById("refresh-bar-text");
  if(!txt) return;
  if(state.consecutiveFailures){
    txt.textContent = "เชื่อมต่อไม่ได้ · แตะเพื่อลองใหม่";
    return;
  }
  if(!state.lastUpdated){ txt.textContent = "กำลังโหลด..."; return; }
  const secs = Math.round((Date.now() - state.lastUpdated.getTime()) / 1000);
  const ago = secs < 10 ? "เมื่อสักครู่"
    : secs < 60 ? `${secs} วินาทีที่แล้ว`
    : secs < 3600 ? `${Math.floor(secs/60)} นาทีที่แล้ว`
    : fmtClock(state.lastUpdated);
  txt.textContent = "อัปเดต " + ago;
}

// Global loading indicator. The app polls every 3s in the background, so we
// must not flash the loader on those — callers pass {background:true} to stay
// silent. A short delay before showing means fast calls never flash a bar;
// only genuinely slow requests (the "web is processing" case) surface it.
let _activeRequests = 0;
let _loaderTimer = null;
function showLoader(){
  _activeRequests++;
  if(_loaderTimer || document.getElementById("global-loader")) return;
  _loaderTimer = setTimeout(()=>{
    if(_activeRequests <= 0) return;
    const bar = el(`<div id="global-loader"><div class="global-loader-fill"></div></div>`);
    document.body.appendChild(bar);
  }, 250); // only show if the request takes longer than 250ms
}
function hideLoader(){
  _activeRequests = Math.max(0, _activeRequests - 1);
  if(_activeRequests > 0) return;
  if(_loaderTimer){ clearTimeout(_loaderTimer); _loaderTimer = null; }
  const bar = document.getElementById("global-loader");
  if(bar) bar.remove();
}

async function api(path, opts={}){
  const headers = opts.headers || {};
  if(state.token) headers["Authorization"] = "Bearer " + state.token;
  if(opts.body && !(opts.body instanceof FormData)) headers["Content-Type"] = "application/json";
  const silent = opts.background === true;
  if(!silent) showLoader();
  try{
    const res = await fetch(API + path, {...opts, headers});
    if(res.status === 401){ logout(); throw new Error("เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่"); }
    if(res.status === 304){ const e = new Error("not modified"); e.notModified = true; throw e; }
    const data = await res.json().catch(()=>({}));
    if(!res.ok){ const e = new Error(data.detail || "การเชื่อมต่อผิดพลาด"); e.status = res.status; throw e; }
    return data;
  } finally {
    if(!silent) hideLoader();
  }
}

// Manual refresh: same data path as the poll, but visible — the icon spins and
// the loader bar is allowed to appear, so a deliberate tap always shows that
// something happened even when the data comes back unchanged.
let _refreshing = false;
async function refreshNow(){
  if(_refreshing) return;
  _refreshing = true;
  const icon = document.getElementById("refresh-bar-icon");
  if(icon) icon.classList.add("spin");
  try{
    await refreshAll({visible:true});
  } finally {
    _refreshing = false;
    if(icon) icon.classList.remove("spin");
    updateRefreshBar();
  }
}

// Bug fix: don't wipe out a form the user is actively typing in when the 3s
// poll refresh fires. We only skip re-rendering #main (data is still fetched);
// once the field loses focus the next poll will render normally.
function userIsTypingInMain(){
  const ae = document.activeElement;
  if(!ae) return false;
  const tag = ae.tagName;
  if(tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") return false;
  const main = document.getElementById("main");
  return !!(main && main.contains(ae));
}

    const errBox = wrap.querySelector("#rg-contact-err");

      ? `<div class="err">เบอร์ติดต่อไม่ถูกต้อง (ต้องเป็นเบอร์ไทย 9-10 หลัก ขึ้นต้นด้วย 0)</div>` : "";
  });
  wrap.querySelector("#rg-back").onclick = ()=> renderLogin();
  wrap.querySelector("#rg-submit").onclick = async ()=>{

    const password = wrap.querySelector("#rg-pass").value;
    const contact = wrap.querySelector("#rg-contact").value;
    const email = wrap.querySelector("#rg-email").value.trim();

      return;
    }
    if(contact && !isValidThaiPhoneJS(contact)){
      errBox.appendChild(el(`<div class="err">เบอร์ติดต่อไม่ถูกต้อง (ต้องเป็นเบอร์ไทย 9-10 หลัก ขึ้นต้นด้วย 0)</div>`));
      return;
    }
    if(email && !email.toLowerCase().endsWith("@central.co.th")){

// ---------------- Shell ----------------
function renderShell(){
  const app = document.getElementById("app");
  app.classList.remove("app-full");
  app.innerHTML = "";
  const unread = state.notifications.filter(n=>!n.is_read).length;
  const isDriver = state.role === "DRIVER";

  let brandInner;
  if(isDriver){
    const meVehicle = (state.vehicles || []).find(v=> v.id === (state.me && state.me.checked_in_vehicle_id));
    const sub = ["DRIVER", meVehicle ? meVehicle.code : null].filter(Boolean).join(" · ");
    brandInner = `<b>${(state.me && state.me.full_name) || state.employee_id}</b><small>${sub}</small>`;
  } else {
    brandInner = `<b>${(state.me && state.me.full_name) || "SCDC Dispatch"}</b><small>${state.role}</small>`;
  }

  let rightIcons;
  if(isDriver){
    const st = state.me && state.me.driver_status;
    const stClass = st === "Available" ? "on" : st === "Breakdown" ? "bad" : st === "Busy" ? "busy" : "off";
    rightIcons = `
      <button class="driver-status-pill ${stClass}" id="hdr-status-btn" style="cursor:pointer;background:none;">${DRIVER_STATUS_LABEL[st] || '-'}</button>
      <button class="bell-btn" id="chat-menu-btn">💬</button>
      <button class="bell-btn" id="bell">🔔${unread ? '<span class="bell-dot"></span>' : ''}</button>
    `;
  } else {
    rightIcons = `
      ${state.role === "ADMIN" ? `<button class="bell-btn" id="admin-search-btn">🔍</button>` : ""}
      <span class="role-pill">${state.role}</span>
      <button class="bell-btn" id="bell">🔔${unread ? '<span class="bell-dot"></span>' : ''}</button>
    `;
  }

  const header = el(`
    <header class="topbar">
      <div class="brand" id="brand-btn" ${isDriver ? 'style="cursor:pointer;"' : ''}>
        <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 15h7v2H2z" fill="#fff"/><rect x="9" y="5" width="1.6" height="12" fill="#fff"/><rect x="12.5" y="5" width="1.6" height="12" fill="#fff"/><rect x="10.5" y="10" width="9" height="6" rx="1" fill="#fff"/><circle cx="13" cy="18.5" r="1.8" fill="#fff"/><circle cx="18" cy="18.5" r="1.8" fill="#fff"/></svg></div>
        <div>${brandInner}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
        ${rightIcons}
      </div>
    </header>
  `);
  header.querySelector("#bell").onclick = ()=> openNotifications();
  if(isDriver){
    header.querySelector("#brand-btn").onclick = ()=>{ setTab("profile"); renderContent(); };
    header.querySelector("#chat-menu-btn").onclick = ()=> openChatMenuSheet();
    header.querySelector("#hdr-status-btn").onclick = ()=> openDriverStatusSheet();
  }
  if(state.role === "ADMIN"){
    header.querySelector("#admin-search-btn").onclick = ()=> openAdminSearchSheet();
  }
  app.appendChild(header);

  // Manual refresh lives here rather than as another header icon — the header
  // is already crowded on a phone, and a full-width strip is a bigger tap
  // target for someone wearing gloves.
  const bar = el(refreshBarHTML());
  const doManualRefresh = ()=> refreshNow();
  bar.onclick = doManualRefresh;
  bar.addEventListener("keydown", (e)=>{ if(e.key === "Enter" || e.key === " ") doManualRefresh(); });
  app.appendChild(bar);

  const pullIndicator = el(`<div id="pull-indicator"></div>`);
  app.appendChild(pullIndicator);

  const main = el(`<main id="main"></main>`);
  app.appendChild(main);
  updateRefreshBar();

  // Wired ONCE here, on the <main> element, which survives every re-render.
  // It used to be wired inside the admin dashboard renderer, which re-ran on
  // every poll and stacked a fresh set of touch listeners on <main> each time.
  wirePullToRefresh(main, pullIndicator, ()=>{
    if(state.role === "ADMIN" && state.tab === "dashboard" && typeof loadDashboardNow === "function"){
      return loadDashboardNow();
    }
    return refreshNow();
  });

  const tabsDef = {
    USER: [["tasks","งานของฉัน"], ["history","ประวัติ"], ["profile","โปรไฟล์"]],
    DRIVER: [["available","งานของฉัน"], ["history","ประวัติ"], ["profile","โปรไฟล์"]],
    ADMIN: [["dashboard","แดชบอร์ด"], ["operation","ปฏิบัติการ"], ["settings","ตั้งค่า"], ["profile","โปรไฟล์"]],
  }[state.role];

  if(!tabsDef){
    // Unknown/blank role — don't render a broken shell (that's the blank-page
    // symptom). Bounce to a clean login instead.
    logout();
    return;
  }

  const tabs = el(`<nav class="tabs">${tabsDef.map(([k,l])=>`<button data-tab="${k}">${l}</button>`).join("")}
    <button data-tab="logout" style="color:var(--red)">ออกจากระบบ</button></nav>`);
  tabs.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.tab === "logout"){ logout(); return; }
      setTab(b.dataset.tab, "");
      renderContent();
      // Switching tabs may need a different data scope (e.g. dashboard vs
      // operation) — refresh right away so the new tab isn't stuck showing
      // stale/empty data until the next poll tick.
      refreshAll();
    };
  });
  app.appendChild(tabs);
  if(!tabsDef.find(([k])=>k===state.tab)) setTab(tabsDef[0][0], "");
  renderContent();

  if(state.role === "USER"){
    const fab = el(`<button class="fab" id="fab-add">+</button>`);
    fab.onclick = ()=> openCreateTask();
    app.appendChild(fab);
  }
}

function setTab(tab, subtab){
  state.tab = tab;
  state.subtab = subtab || "";
  // Force the next renderContent() to actually run: the payload hasn't
  // changed, but the screen must.
  state._renderedSig = null;
  try{
    localStorage.setItem("scdc_tab", state.tab);
    localStorage.setItem("scdc_subtab", state.subtab);
  }catch(e){ /* private mode — navigation still works, it just won't persist */ }
}

function markActiveTab(){
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === state.tab);
  });
}

async function renderContent(){
  markActiveTab();
  const main = document.getElementById("main");
  const scrollY = window.scrollY;
  main.innerHTML = "";
  if(state.role === "USER") renderUserTab(main);
  else if(state.role === "DRIVER") renderDriverTab(main);
  else if(state.role === "ADMIN") renderAdminTab(main);
  // Restore scroll position so the 3s auto-refresh poll doesn't yank the user
  // back to the top of a long list they were scrolled through. The page itself
  // scrolls (header uses position:sticky), not #main, so this targets window.
  window.scrollTo(0, scrollY);
}

// ---------------- Optimistic task actions ----------------
// Applies the expected result to local state and re-renders BEFORE the request
// completes, then reconciles against the server. On a warehouse mobile
// connection this is the difference between a button that feels instant and
// one that feels broken.
const _inFlightActions = new Set();

function findTask(id){ return (state.tasks || []).find(t => String(t.id) === String(id)); }

// Server-side rejections that mean "someone else got there first". These are
// normal in a shared queue, not errors the driver did anything wrong — so they
// get a plain explanation rather than a scary failure message.
function isRaceLoss(err){
  return err && (err.status === 409 || err.status === 400);
}

async function taskAction({id, key, run, patch, successMsg, btn}){
  const lock = `${id}:${key}`;
  if(_inFlightActions.has(lock)) return;   // double-tap / impatient re-tap guard
  _inFlightActions.add(lock);

  const target = findTask(id);
  // Shallow snapshot for rollback. Patches must return NEW arrays rather than
  // mutating in place, or this snapshot would be rolled back into itself.
  const snapshot = target ? {...target} : null;
  let btnLabel = null;
  if(target && patch){
    Object.assign(target, patch(target));
    renderContent();
  } else if(btn){
    // No safe prediction for this action's outcome, so give feedback on the
    // button itself instead of guessing at the card's new state.
    btnLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "กำลังส่ง...";
  }

  try{
    await run();
    toast(successMsg || "สำเร็จ");
    await refreshAll();
  }catch(err){
    if(snapshot){
      const current = findTask(id);
      if(current) Object.assign(current, snapshot);
      renderContent();
    }
    toast(isRaceLoss(err) ? (err.message || "ทำรายการไม่สำเร็จ")
                          : (err.message || "เชื่อมต่อไม่ได้ กรุณาลองใหม่"));
    // Whatever went wrong, our picture of this task is now suspect — the usual
    // cause is that someone else changed it. Pull the truth back down.
    await refreshAll();
  }finally{
    _inFlightActions.delete(lock);
    if(btn && btnLabel !== null){ btn.disabled = false; btn.textContent = btnLabel; }
  }
}

// What each action is expected to do, so the UI can show it immediately.
// Deliberately only covers actions whose result is unambiguous; join and
// take-over depend on server-side eligibility checks, so they show button-level
// feedback instead of a predicted card state.
const OPTIMISTIC_PATCH = {
  "start":    () => ({status: "In Progress"}),
  "complete": () => ({status: "Completed"}),
  "resume":   () => ({status: "In Progress"}),
  "cancel":   () => ({status: "Cancelled"}),
  "accept":   () => ({accepted_at: new Date().toISOString()}),
  "self-assign": (t) => ({
    status: "Assigned",
    accepted_at: new Date().toISOString(),
    driver_employee_id: state.employee_id,
    driver_name: (state.me && state.me.full_name) || state.employee_id,
    drivers: [...(t.drivers || []), {
      employee_id: state.employee_id,
      full_name: (state.me && state.me.full_name) || state.employee_id,
      vehicle_code: null,
    }],
  }),
};

function bindCardActions(container){
  container.querySelectorAll("[data-duplicate]").forEach(b=> b.onclick = async (e)=>{
    e.stopPropagation();
    try{
      const t = await api(`/tasks/${b.dataset.duplicate}`);
      const sheetOverlay = b.closest(".sheet-overlay");
      if(sheetOverlay) closeSheet(sheetOverlay);
      openCreateTask(t);
    }catch(err){ toast(err.message); }
  });
  container.querySelectorAll("[data-action]").forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const id = btn.closest(".card").dataset.id;
      const action = btn.dataset.action;
      let url = `/tasks/${id}/${action}`;
      if(action === "cancel"){
        if(!confirm("ยืนยันยกเลิกงานนี้ใช่หรือไม่? การกระทำนี้ย้อนกลับไม่ได้")) return;
        const reason = prompt("เหตุผลในการยกเลิก (ถ้ามี):");
        if(reason === null) return; // user pressed Cancel on the prompt itself
        url = `/tasks/${id}/cancel?reason=${encodeURIComponent(reason)}`;
      }
      await taskAction({
        id, key: action, btn,
        patch: OPTIMISTIC_PATCH[action],
        run: ()=> api(url, {method:"POST"}),
        successMsg: "อัปเดตแล้ว",
      });
    };
  });
  container.querySelectorAll("[data-chat]").forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); openChatSheet(btn.dataset.chat); };
  });
}

// ---------------- USER ----------------
function renderUserTab(main){
  if(state.tab === "tasks"){
    const active = state.tasks.filter(t=>!["Completed","Cancelled"].includes(t.status));
    main.appendChild(el(`<div class="section-title">งานที่กำลังดำเนินการ (${active.length})</div>`));
    if(active.length === 0){ main.appendChild(el(`<div class="empty">ยังไม่มีงาน กดปุ่ม + เพื่อสร้างงานใหม่</div>`)); }
    active.forEach(t=>{
      let actions = `<button class="btn" data-chat="${t.id}">💬 แชท</button>`;
      if(t.status === "Waiting"){
        actions = `<button class="btn" data-edit="${t.id}">แก้ไข</button>
          <button class="btn" data-photo="${t.id}">เพิ่มรูป</button>
          ${t.blocked_reason ? `<button class="btn amber" data-resubmit="${t.id}">ส่งใหม่</button>` : ""}
          ${actions}
          <button class="btn red" data-action="cancel">ยกเลิก</button>`;
      } else if(t.status === "Assigned"){
        actions = `${actions}<button class="btn red" data-action="cancel">ยกเลิก</button>`;
      }
      main.appendChild(el(taskCard(t, actions)));
    });
    bindCardActions(main);
    main.querySelectorAll("[data-edit]").forEach(b=> b.onclick = ()=> openEditTask(b.dataset.edit));
    main.querySelectorAll("[data-photo]").forEach(b=> b.onclick = ()=> openPhotoUpload(b.dataset.photo));
    main.querySelectorAll("[data-resubmit]").forEach(b=>{
      b.onclick = async ()=>{
        try{ await api(`/tasks/${b.dataset.resubmit}/resubmit`, {method:"POST"}); toast("ส่งงานใหม่แล้ว"); await refreshAll(); }
        catch(e){ toast(e.message); }
      };
    });
    bindCardClickToDetail(main);

    const awaitingReview = state.tasks.filter(t=> t.status === "Completed" && !t.rating);
    main.appendChild(el(`<div class="section-title">งานที่รอรีวิว (${awaitingReview.length})</div>`));
    const reviewWrap = el(`<div></div>`);
    main.appendChild(reviewWrap);
    if(awaitingReview.length === 0){
      reviewWrap.appendChild(el(`<div class="empty">ไม่มีงานที่รอให้คะแนน</div>`));
    } else {
      awaitingReview.forEach(t=>{
        const actions = `<button class="btn amber" data-rate="${t.id}">ให้คะแนน</button><button class="btn" data-chat="${t.id}">💬 แชท</button>`;
        reviewWrap.appendChild(el(taskCard(t, actions)));
      });
    }
    bindCardActions(reviewWrap);
    reviewWrap.querySelectorAll("[data-rate]").forEach(b=> b.onclick = ()=> openRatingSheet(b.dataset.rate));
    bindCardClickToDetail(reviewWrap);
  } else if(state.tab === "history"){
    const done = state.tasks.filter(t=>["Completed","Cancelled"].includes(t.status));
    main.appendChild(el(`<div class="section-title">ประวัติ (${done.length})</div>`));
    if(done.length === 0) main.appendChild(el(`<div class="empty">ยังไม่มีงานที่เสร็จสิ้น</div>`));
    done.forEach(t=>{
      let actions = `<button class="btn" data-chat="${t.id}">💬 แชท</button>`;
      if(t.status === "Completed"){
        actions = (t.rating ? `<span style="font-size:14px;">${"★".repeat(t.rating)}${"☆".repeat(5-t.rating)}</span>` : `<button class="btn amber" data-rate="${t.id}">ให้คะแนน</button>`) + actions;
      }
      main.appendChild(el(taskCard(t, actions)));
    });
    bindCardActions(main);
    main.querySelectorAll("[data-rate]").forEach(b=> b.onclick = ()=> openRatingSheet(b.dataset.rate));

function locationPatternRegex(zone){
  try{ return new RegExp(zone.code_pattern, "i"); }catch(e){ return /.*/; }
}

// Renders a zone-select + zone-specific sub-picker into `container`.
// The 6 known zone_keys get a hand-built picker matching their real layout;
// any other zone (added later by Admin) falls back to a generic
// pattern-validated text field, with chip-based multi-add if allow_multiple.
function buildLocationPicker(container, zones, initial){
  let currentZone = (initial && zones.find(z=> z.zone_key === initial.zone)) || zones[0];
  let chips = [];
  let singleValue = "";
  if(initial && currentZone){
    if(currentZone.allow_multiple) chips = (initial.value || "").split(",").filter(Boolean);
    else singleValue = initial.value || "";
  }

  container.innerHTML = "";
  const wrap = el(`<div>
    <select class="zp-zone"></select>
    <div class="zp-body" style="margin-top:8px;"></div>
    <div class="zp-err field-note" style="color:var(--red);"></div>
  </div>`);
  container.appendChild(wrap);
  const zoneSel = wrap.querySelector(".zp-zone");
  zones.forEach(z=> zoneSel.appendChild(el(`<option value="${z.zone_key}" ${currentZone.zone_key===z.zone_key?"selected":""}>${z.zone_name_th}</option>`)));

  container.getLocationValue = ()=> ({ zone: currentZone.zone_key, value: currentZone.allow_multiple ? chips.join(",") : singleValue });

  function renderBody(){
    const body = wrap.querySelector(".zp-body");
    body.innerHTML = "";
    wrap.querySelector(".zp-err").textContent = "";
    const zk = currentZone.zone_key;
    if(zk === "CONCRETE_YARD"){
      const sel = el("<select></select>");
      for(let i=1;i<=7;i++) sel.appendChild(new Option("ลานปูน-"+i, i));
      const m = singleValue.match(/-(\d+)$/);
      if(m) sel.value = m[1];
      const upd = ()=>{ singleValue = "ลานปูน-"+sel.value; };
      sel.onchange = upd; upd();
      body.appendChild(sel);
    } else if(zk === "GATE"){
      // Multiple gates allowed now — same numeric-entry UX as before (with the
      // ขาเข้า/ขาออก hint), just building up a list of chips instead of one value.
      const row = el(`<div style="display:flex;gap:8px;"><input type="number" min="1" max="85" placeholder="1-85" /><button type="button" class="btn amber">เพิ่ม</button></div>`);
      const hint = el(`<div class="field-note"></div>`);
      const chipRow = el(`<div class="chip-row" style="margin-top:8px;"></div>`);
      function drawChips(){
        chipRow.innerHTML = "";
        chips.forEach((c,i)=>{
          const chip = el(`<span class="chip active" style="cursor:default;">${c} <span style="cursor:pointer;margin-left:4px;">✕</span></span>`);
          chip.querySelector("span").onclick = ()=>{ chips.splice(i,1); drawChips(); };
          chipRow.appendChild(chip);
        });
      }
      row.querySelector("input").oninput = (e)=>{
        const n = parseInt(e.target.value||0);
        hint.textContent = (n>=1 && n<=85) ? (n<=58 ? "ขาเข้า (In)" : "ขาออก (Out)") : "กรอกเลข 1-85";
      };
      row.querySelector("button").onclick = ()=>{
        const inp = row.querySelector("input");
        const n = parseInt(inp.value||0);
        if(n<1||n>85){ wrap.querySelector(".zp-err").textContent = "กรอกเลข 1-85"; return; }
        const v = "ประตู-"+n;
        if(chips.includes(v)){ wrap.querySelector(".zp-err").textContent = "ประตูนี้ถูกเพิ่มไปแล้ว"; return; }
        chips.push(v);
        wrap.querySelector(".zp-err").textContent = "";
        inp.value = ""; hint.textContent = ""; drawChips();
      };
      drawChips();
      body.appendChild(row); body.appendChild(hint); body.appendChild(chipRow);
    } else if(zk === "SORT_YARD"){
      singleValue = "ลาน Sort";
      body.appendChild(el(`<div class="field-note">จุดเดียว ไม่ต้องเลือกเพิ่ม</div>`));
    } else if(zk === "MEZZANINE"){
      const s1 = el("<select></select>");
      for(let i=1;i<=4;i++) s1.appendChild(new Option("ชั้น "+i, i));
      const s2 = el(`<select style="margin-top:8px;"><option value="ซ้าย (Cross dock)">ซ้าย (Cross dock)</option><option value="ขวา (Double Deep)">ขวา (Double Deep)</option></select>`);
      const fm = singleValue.match(/^Mezzanine-(\d)-(.+)$/);
      if(fm){ s1.value = fm[1]; s2.value = fm[2]; }
      const upd = ()=>{ singleValue = "Mezzanine-"+s1.value+"-"+s2.value; };
      s1.onchange = upd; s2.onchange = upd; upd();
      body.appendChild(s1); body.appendChild(s2);
    } else if(currentZone.free_text){
      // Free-text zones (e.g. "พาเลทเปล่า") skip pattern validation entirely —
      // any non-empty description is accepted, so no ✕/toUpperCase gymnastics.
      if(currentZone.allow_multiple){
        const row = el(`<div style="display:flex;gap:8px;"><input placeholder="พิมพ์รายละเอียด แล้วกดเพิ่ม" /><button type="button" class="btn amber">เพิ่ม</button></div>`);
        const chipRow = el(`<div class="chip-row" style="margin-top:8px;"></div>`);
        function drawChips(){
          chipRow.innerHTML = "";
          chips.forEach((c,i)=>{
            const chip = el(`<span class="chip active" style="cursor:default;">${c} <span style="cursor:pointer;margin-left:4px;">✕</span></span>`);
            chip.querySelector("span").onclick = ()=>{ chips.splice(i,1); drawChips(); };
            chipRow.appendChild(chip);
          });
        }
        row.querySelector("button").onclick = ()=>{
          const inp = row.querySelector("input");
          const v = inp.value.trim();
          if(!v) return;
          if(chips.includes(v)){ wrap.querySelector(".zp-err").textContent = "รายการนี้ถูกเพิ่มไปแล้ว"; return; }
          chips.push(v);
          wrap.querySelector(".zp-err").textContent = "";
          inp.value = ""; drawChips();
        };
        drawChips();
        body.appendChild(row); body.appendChild(chipRow);
      } else {
        const inp = el(`<textarea rows="2" placeholder="${currentZone.example_code||'พิมพ์รายละเอียด'}">${singleValue}</textarea>`);
        inp.oninput = ()=>{ singleValue = inp.value.trim(); };
        body.appendChild(inp);
      }
    } else if(currentZone.allow_multiple){
      const row = el(`<div style="display:flex;gap:8px;"><input placeholder="${currentZone.example_code||''} (วางจาก Excel ได้)" /><button type="button" class="btn amber">เพิ่ม</button></div>`);
      const chipRow = el(`<div class="chip-row"></div>`);
      function drawChips(){
        chipRow.innerHTML = "";
        chips.forEach((c,i)=>{
          const chip = el(`<span class="chip active" style="cursor:default;">${c} <span style="cursor:pointer;margin-left:4px;">✕</span></span>`);
          chip.querySelector("span").onclick = ()=>{ chips.splice(i,1); drawChips(); };
          chipRow.appendChild(chip);
        });
      }
      function tryAdd(v){
        if(!locationPatternRegex(currentZone).test(v)) return "invalid";
        if(chips.includes(v)) return "dup";
        chips.push(v);
        return "ok";
      }
      row.querySelector("button").onclick = ()=>{
        const inp = row.querySelector("input");
        const v = inp.value.trim().toUpperCase();
        if(!v) return;
        const result = tryAdd(v);
        if(result === "invalid"){ wrap.querySelector(".zp-err").textContent = "รูปแบบไม่ถูกต้อง ตัวอย่าง: "+currentZone.example_code; return; }
        if(result === "dup"){ wrap.querySelector(".zp-err").textContent = "รายการนี้ถูกเพิ่มไปแล้ว"; return; }
        wrap.querySelector(".zp-err").textContent = "";
        inp.value = ""; drawChips();
      };
      // Support pasting a list copied from Excel (newline/tab/comma separated).
      row.querySelector("input").addEventListener("paste", (e)=>{
        const text = (e.clipboardData || window.clipboardData).getData("text");
        if(!text || !/[\n\r\t,]/.test(text)) return; // single value: let default paste behavior handle it
        e.preventDefault();
        const tokens = text.split(/[\n\r\t,]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
        let added=0, dup=0, invalid=0;
        tokens.forEach(v=>{
          const r = tryAdd(v);
          if(r==="ok") added++; else if(r==="dup") dup++; else invalid++;
        });
        drawChips();
        const msgs = [];
        if(added) msgs.push(`เพิ่ม ${added} รายการ`);
        if(dup) msgs.push(`ข้ามรายการซ้ำ ${dup}`);
        if(invalid) msgs.push(`รูปแบบผิด ${invalid} รายการ`);
        wrap.querySelector(".zp-err").textContent = msgs.join(" · ");
        wrap.querySelector(".zp-err").style.color = invalid || dup ? "var(--amber)" : "var(--green)";
      });
      drawChips();
      body.appendChild(row); body.appendChild(chipRow);
    } else {
      const inp = el(`<input placeholder="${currentZone.example_code||''}" value="${singleValue}" />`);
      inp.oninput = ()=>{ singleValue = inp.value.trim().toUpperCase(); };
      body.appendChild(inp);
    }
  }
  zoneSel.onchange = ()=>{
    currentZone = zones.find(z=> z.zone_key === zoneSel.value);
    chips = []; singleValue = "";
    renderBody();
  };
  renderBody();
}

function displayZoneValue(zones, val){
  if(!val || !val.value) return null;
  const z = zones.find(x=> x.zone_key === val.zone);
  return `${z ? z.zone_name_th : val.zone}: ${val.value}`;
}

function openLocationPickerPopup(title, zones, initial, onConfirm){
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>${title}</h2><button id="sh-close">✕</button></div>
        <div id="lp-picker-wrap"></div>
        <button class="primary" id="lp-confirm">ยืนยันจุดนี้</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector("#sh-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  const wrap = overlay.querySelector("#lp-picker-wrap");
  buildLocationPicker(wrap, zones, initial);
  overlay.querySelector("#lp-confirm").onclick = ()=>{
    const val = wrap.getLocationValue && wrap.getLocationValue();

    onConfirm(val);
    closeSheet(overlay);
  };
}

function openPhotoUpload(taskId){
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>เพิ่มรูปภาพ</h2><button id="sh-close">✕</button></div>
        <input type="file" id="ph-file" accept="image/*" />
        <button class="primary" id="ph-submit">อัปโหลด</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector("#sh-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  overlay.querySelector("#ph-submit").onclick = async ()=>{
    const file = overlay.querySelector("#ph-file").files[0];
    if(!file){ toast("กรุณาเลือกไฟล์ก่อน"); return; }
    try{
      const fd = new FormData();
      fd.append("file", file);
      await api(`/tasks/${taskId}/photo`, {method:"POST", body: fd});
      closeSheet(overlay);
      toast("อัปโหลดรูปสำเร็จ");
      await refreshAll();
    }catch(e){ toast(e.message); }
  };
}

// Every failure mode below used to surface as the same silence. Each state is
// now named explicitly, with the specific next step for that state, because
// "notifications don't work" is otherwise undebuggable from the driver's side.
function pushDiagnosticsHTML(status){
  const rows = [
    ["ติดตั้งลงหน้าจอโฮม", isStandalone() ? "✅ ใช่" : (isIOS() ? "❌ ยัง (จำเป็นบน iPhone)" : "— ไม่จำเป็น")],
    ["สิทธิ์แจ้งเตือน", ("Notification" in window)
      ? ({granted:"✅ อนุญาตแล้ว", denied:"❌ ถูกปฏิเสธ", default:"⚠️ ยังไม่ได้ถาม"}[Notification.permission] || Notification.permission)
      : "❌ เบราว์เซอร์ไม่รองรับ"],
    ["ลงทะเบียนกับเซิร์ฟเวอร์", status && status.subscribed ? "✅ แล้ว" : "❌ ยัง"],
    ["เซิร์ฟเวอร์พร้อมส่ง", status && status.available ? "✅ พร้อม" : "❌ ไม่พร้อม"],
  ];
  return `<div style="font-size:12px;line-height:1.9;margin-bottom:10px;">
    ${rows.map(([k,v])=>`<div style="display:flex;justify-content:space-between;gap:10px;">
      <span style="color:var(--ink-dim);">${k}</span><span>${v}</span></div>`).join("")}
  </div>`;
}

async function renderPushSection(pushCard){
  pushCard.innerHTML = "";
  if(!pushSupported()){
    pushCard.appendChild(el(`<div class="field-note">เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือนแบบ Push</div>`));
    if(isIOS()){
      pushCard.appendChild(el(`<div class="field-note">บน iPhone ต้องใช้ Safari และต้อง "เพิ่มลงในหน้าจอโฮม" ก่อน แล้วเปิดแอปจากไอคอนนั้น</div>`));
    }
    return;
  }
  if(location.protocol !== "https:" && location.hostname !== "localhost"){
    pushCard.appendChild(el(`<div class="field-note">ต้องเปิดผ่าน HTTPS ถึงจะเปิดแจ้งเตือนได้ (ตอนนี้เปิดผ่าน HTTP ธรรมดา) — ถ้าเครื่อง Server ตั้งค่า HTTPS ไว้แล้ว ลองเข้าผ่านลิงก์ https:// แทน</div>`));
    return;
  }
  let status;
  try{ status = await api("/push/status", {background:true}); }catch(e){ status = {available:false, subscribed:false}; }

  pushCard.appendChild(el(pushDiagnosticsHTML(status)));

  if(!status.available){
    pushCard.appendChild(el(`<div class="field-note">เซิร์ฟเวอร์ยังไม่ได้ตั้งค่า Web Push</div>`));
    return;
  }
  // iOS: a Safari tab can never subscribe. Say so plainly instead of showing a
  // button that is guaranteed to fail.
  if(isIOS() && !isStandalone()){
    pushCard.appendChild(el(`<div class="field-note" style="color:var(--warn);">
      บน iPhone ต้อง "เพิ่มลงในหน้าจอโฮม" ก่อน แล้ว<b>เปิดแอปจากไอคอนบนหน้าจอโฮม</b> จึงจะเปิดแจ้งเตือนได้<br>
      (สิทธิ์ที่เคยกดอนุญาตใน Safari จะไม่ถูกนำมาใช้ ต้องกดอนุญาตใหม่ในแอปที่ติดตั้งแล้ว)
    </div>`));
    return;
  }
  const perm = Notification.permission;
  if(perm === "denied"){
    pushCard.appendChild(el(`<div class="field-note">คุณเคยปฏิเสธการแจ้งเตือนไว้ — ต้องไปเปิดเองในตั้งค่าเครื่อง/เบราว์เซอร์ (Settings → Notifications) แล้วกลับมาเปิดใหม่ที่นี่</div>`));
    return;
  }
  const btn = el(`<button class="btn ${status.subscribed ? 'red' : 'amber'}" style="width:100%;">
    ${status.subscribed ? 'ปิดการแจ้งเตือน' : 'เปิดการแจ้งเตือน'}
  </button>`);
  pushCard.appendChild(el(`<div class="field-note" style="margin-bottom:10px;">รับแจ้งเตือนแม้ปิดแอปอยู่ (มือถือ iOS ต้อง "เพิ่มลงหน้าจอโฮม" ก่อนถึงจะใช้ได้)</div>`));
  pushCard.appendChild(btn);
  const resultBox = el(`<div id="push-test-result" style="margin-top:10px;"></div>`);
  if(status.subscribed){
    // Subscribing successfully is not proof that delivery works — an expired
    // VAPID signature or a revoked subscription both look identical from here
    // until an actual send is attempted.
    const testBtn = el(`<button class="btn" style="width:100%;margin-top:8px;">ทดสอบส่งแจ้งเตือน</button>`);
    testBtn.onclick = ()=> testPushAndShowResult(resultBox);
    pushCard.appendChild(testBtn);
  }
  pushCard.appendChild(resultBox);
  btn.onclick = async ()=>{
    resultBox.innerHTML = "";
    try{
      if(status.subscribed){
        await unsubscribeFromPush();
        localStorage.setItem(NOTIF_PROMPTED_KEY, "true"); // don't auto-prompt again after an explicit opt-out
        await renderPushSection(pushCard);
        toast("ปิดการแจ้งเตือนแล้ว");
      } else {
        await subscribeToPush();
        await renderPushSection(pushCard);
        await testPushAndShowResult(document.getElementById("push-test-result"));
      }
    }catch(e){ toast(e.message || "ไม่สำเร็จ"); }
  };
}

// Sends a real test push right after subscribing and shows the honest result
// inline — "enabled" alone doesn't prove delivery actually works, and the
// BadJwtToken issue this app has hit before would otherwise stay invisible
// until someone noticed they never got a real notification.
async function testPushAndShowResult(container){
  if(!container) return;
  container.innerHTML = `<div class="field-note">กำลังทดสอบส่งการแจ้งเตือน...</div>`;
  try{
    await api("/push/test", {method:"POST"});
    container.innerHTML = `<div class="field-note" style="color:var(--green);">✅ ทดสอบสำเร็จ! คุณควรเห็นการแจ้งเตือนขึ้นมาแล้ว (เช็คที่แถบแจ้งเตือนของเครื่อง/เบราว์เซอร์)</div>`;
  }catch(e){
    container.innerHTML = `<div class="field-note" style="color:var(--red);">⚠️ เปิดใช้งานแล้ว แต่ทดสอบส่งไม่สำเร็จ: ${e.message}</div>`;
  }
}

function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c=> c.charCodeAt(0)));
}

async function subscribeToPush(){
  const reg = await navigator.serviceWorker.ready;
  const perm = await Notification.requestPermission();
  if(perm !== "granted") throw new Error("ไม่ได้รับอนุญาตให้แจ้งเตือน");
  const { publicKey } = await api("/push/vapid-public-key");
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(publicKey),
  });
  const json = sub.toJSON();
  await api("/push/subscribe", {method:"POST", body: JSON.stringify({endpoint: json.endpoint, keys: json.keys})});
}

async function unsubscribeFromPush(){
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if(sub){
    await api("/push/unsubscribe", {method:"POST", body: JSON.stringify({endpoint: sub.endpoint})});
    await sub.unsubscribe();
  }
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("/service-worker.js").catch(()=>{ /* non-fatal */ });
  });
}

// ---------------- DRIVER ----------------
function renderDriverTab(main){
  if(state.tab === "available"){
    const isMine = (t)=> (t.drivers||[]).some(d=> d.employee_id === state.employee_id);
    const mine = state.tasks.filter(t=> isMine(t) && !["Completed","Cancelled"].includes(t.status));

    // ---- Hero: current task (Grab-style "active trip"), or tasks I can take if none ----
    if(mine.length > 0){
      main.appendChild(el(`<div class="section-title">งานที่กำลังทำอยู่</div>`));
      mine.forEach(t=>{
        const amPrimary = t.driver_employee_id === state.employee_id;
        let actions = `<button class="btn" data-chat="${t.id}">💬 แชท</button>`;
        if(t.status === "Assigned" && amPrimary && !t.accepted_at) actions = `<button class="btn amber" data-accept="${t.id}">รับงาน</button>` + actions;
        else if(t.status === "Assigned" && amPrimary && t.accepted_at) actions = `<button class="btn green" data-action="start">เริ่มงาน</button>` + actions;
        else if(t.status === "In Progress") actions = `<button class="btn green" data-action="complete">เสร็จงาน</button>
          <button class="btn" data-pause="${t.id}">หยุดชั่วคราว</button>` + actions;
        else if(t.status === "Pause") actions = `<button class="btn amber" data-action="resume">ทำงานต่อ</button>` + actions;
        if(["Assigned","In Progress","Pause"].includes(t.status)) actions += `<button class="btn red" data-leave="${t.id}">ออกจากงาน</button>`;
        main.appendChild(el(taskCard(t, actions)));
      });
      bindCardActions(main);
      main.querySelectorAll("[data-accept]").forEach(b=> b.onclick = ()=> openBatterySheet(b.dataset.accept, "accept"));
      main.querySelectorAll("[data-pause]").forEach(b=> b.onclick = ()=> openPauseSheet(b.dataset.pause));
      main.querySelectorAll("[data-leave]").forEach(b=>{
        b.onclick = async ()=>{
          if(!confirm("ยืนยันออกจากงานนี้ใช่หรือไม่?")) return;
          await taskAction({
            id: b.dataset.leave, key: "leave", btn: b,
            run: ()=> api(`/tasks/${b.dataset.leave}/leave`, {method:"POST"}),
            successMsg: "ออกจากงานแล้ว",
          });
        };
      });
    } else {
      // Oldest first: /tasks comes back newest-first (right for history), but
      // a queue of unclaimed work should be served front-to-back so the job
      // that has been waiting longest is the one a driver sees at the top.
      const avail = state.tasks
        .filter(t=>t.status === "Waiting")
        .slice()
        .sort((a,b)=> String(a.created_at||"").localeCompare(String(b.created_at||"")));
      main.appendChild(el(`<div class="section-title">งานที่รับได้ (${avail.length})</div>`));
      main.appendChild(el(`<div class="field-note" style="margin-bottom:10px;">กดรับงานได้ทันทีด้วยรถที่คุณเช็คอินไว้</div>`));
      if(avail.length===0) main.appendChild(el(`<div class="empty">ยังไม่มีงานว่างในขณะนี้</div>`));
      avail.forEach(t=>{
        const card = el(taskCard(t, `<button class="btn amber" data-self-assign="${t.id}">รับงานนี้</button>`, {showRequester:true}));
        main.appendChild(card);
      });
      main.querySelectorAll("[data-self-assign]").forEach(b=> b.onclick = ()=> openBatterySheet(b.dataset.selfAssign, "self-assign"));

      const others = state.tasks.filter(t=> ["Assigned","In Progress","Pause"].includes(t.status) && !isMine(t) && (t.drivers||[]).length > 0);
      main.appendChild(el(`<div class="section-title">งานที่คนอื่นกำลังทำ (${others.length})</div>`));
      main.appendChild(el(`<div class="field-note" style="margin-bottom:10px;">"เข้าร่วม" = ช่วยทำไปพร้อมกัน · "รับช่วงแทน" = แทนที่คนขับเดิม</div>`));
      if(others.length===0) main.appendChild(el(`<div class="empty">ไม่มีงานของคนอื่นในขณะนี้</div>`));
      others.forEach(t=>{
        const card = el(taskCard(t, `<button class="btn green" data-join="${t.id}">เข้าร่วม</button>
          <button class="btn blue" data-take-over="${t.id}">รับช่วงแทน</button>`, {showRequester:true}));
        main.appendChild(card);
      });
      main.querySelectorAll("[data-join]").forEach(b=> b.onclick = ()=> openBatterySheet(b.dataset.join, "join"));
      main.querySelectorAll("[data-take-over]").forEach(b=> b.onclick = ()=> openBatterySheet(b.dataset.takeOver, "take-over"));
    }
    bindCardClickToDetail(main);

    // ---- Status / Vehicle pill row (Grab-style "Online" bar) ----
    const meVehicle = state.vehicles.find(v=> v.id === (state.me && state.me.checked_in_vehicle_id));
    const st = state.me && state.me.driver_status;
    const stClass = st === "Available" ? "on" : st === "Breakdown" ? "bad" : st === "Busy" ? "busy" : "off";
    const pillRow = el(`<div class="card" style="display:flex;gap:10px;align-items:center;">
      <button class="driver-status-pill ${stClass}" id="status-pill-btn" style="cursor:pointer;font-size:13px;padding:9px 14px;background:var(--panel-2);">
        ● ${DRIVER_STATUS_LABEL[st] || '-'}
      </button>
      <button class="btn" id="vehicle-pill-btn" style="flex:1;">
        🚗 ${meVehicle ? meVehicle.code : 'แตะเพื่อเช็คอินรถ'}
      </button>
    </div>`);
    main.appendChild(pillRow);
    pillRow.querySelector("#status-pill-btn").onclick = ()=> openDriverStatusSheet();
    pillRow.querySelector("#vehicle-pill-btn").onclick = ()=> openVehicleCheckSheet();

    // ---- Today's stats (tap -> ประวัติ) ----
    const statsCard = el(`<div class="card" id="today-stats-card" style="cursor:pointer;">
      <div class="section-title" style="margin:0 0 8px;">งานของฉันวันนี้ <span style="color:var(--ink-dim);">›</span></div>
      <div class="stat-grid" id="today-stats-grid"><div class="empty">กำลังโหลด...</div></div>
    </div>`);
    main.appendChild(statsCard);
    statsCard.onclick = ()=>{ setTab("history"); renderContent(); };
    (async ()=>{
      try{
        const s = await api("/drivers/me/stats?period=day");
        statsCard.querySelector("#today-stats-grid").outerHTML = `<div class="stat-grid" id="today-stats-grid">
          <div class="stat"><div class="n">${s.task_count}</div><div class="l">งานเสร็จวันนี้</div></div>
          <div class="stat"><div class="n">${s.pallet_total}</div><div class="l">พาเลทวันนี้</div></div>
        </div>`;
      }catch(e){ /* ignore */ }
    })();

    // ---- Report a problem (further down, per request) ----
    main.appendChild(el(`<div class="section-title">แจ้งปัญหา/ขัดข้อง</div>`));
    const bd = el(`<div class="card">
      <button class="btn red" id="bd-self" style="width:100%;">แจ้งปัญหาของตัวเอง</button>
      <div class="grid2" style="margin-top:10px;">
        <div><label>รหัสรถ</label><input id="bd-vehicle" placeholder="RT-001" /></div>
        <div><label>&nbsp;</label><button class="btn red" id="bd-vehicle-submit" style="width:100%;">แจ้งปัญหารถ</button></div>
      </div>
      <label>รายละเอียด</label><textarea id="bd-desc" rows="2" placeholder="เกิดอะไรขึ้น?"></textarea>
    </div>`);
    bd.querySelector("#bd-self").onclick = async ()=>{
      try{
        await api("/breakdowns", {method:"POST", body: JSON.stringify({target_type:"driver", description: bd.querySelector("#bd-desc").value})});
        toast("แจ้งปัญหาแล้ว"); await refreshAll();
      }catch(e){ toast(e.message); }
    };
    bd.querySelector("#bd-vehicle-submit").onclick = async ()=>{
      try{
        await api("/breakdowns", {method:"POST", body: JSON.stringify({
          target_type:"vehicle", vehicle_code: bd.querySelector("#bd-vehicle").value.trim(),
          description: bd.querySelector("#bd-desc").value})});
        toast("แจ้งปัญหาแล้ว"); await refreshAll();

function openAdminSearchSheet(){

  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  const input = overlay.querySelector("#admin-search-input");
  const results = overlay.querySelector("#admin-search-results");

  function goToTask(taskId){ closeSheet(overlay); openTaskDetailSheet(taskId); }
  function goToPerson(userId){
    closeSheet(overlay);
    setTab("operation", "people"); renderContent();
    openUserEditSheet(userId);
  }
  function goToVehicle(vehicleId){
    closeSheet(overlay);
    setTab("operation", "vehicles"); renderContent();
    openVehicleEditSheet(vehicleId);
  }

  function runSearch(){
    const q = input.value.trim().toLowerCase();
    results.innerHTML = "";
    if(!q){ return; }
    const taskMatches = state.tasks.filter(t=>
      t.task_code.toLowerCase().includes(q) ||
      (t.from_location||"").toLowerCase().includes(q) ||
      (t.to_location||"").toLowerCase().includes(q)
    ).slice(0, 8);
    const peopleMatches = state.allUsers.filter(u=>
      u.employee_id.toLowerCase().includes(q) || (u.full_name||"").toLowerCase().includes(q)
    ).slice(0, 8);
    const vehicleMatches = state.vehicles.filter(v=> v.code.toLowerCase().includes(q)).slice(0, 8);

    if(taskMatches.length === 0 && peopleMatches.length === 0 && vehicleMatches.length === 0){
      results.appendChild(el(`<div class="empty">ไม่พบผลลัพธ์</div>`));
      return;
    }
    if(taskMatches.length){
      results.appendChild(el(`<div class="section-title">งาน</div>`));
      const card = el(`<div class="card"></div>`);
      taskMatches.forEach(t=>{
        const row = el(`<div class="list-row" style="cursor:pointer;"><span class="mono">${t.task_code}</span><span class="field-note">${t.from_location} → ${t.to_location} · ${STATUS_LABEL[t.status]||t.status}</span></div>`);
        row.onclick = ()=> goToTask(t.id);
        card.appendChild(row);
      });
      results.appendChild(card);
    }
    if(peopleMatches.length){
      results.appendChild(el(`<div class="section-title">พนักงาน</div>`));
      const card = el(`<div class="card"></div>`);
      peopleMatches.forEach(u=>{
        const row = el(`<div class="list-row" style="cursor:pointer;"><span>${u.full_name || u.employee_id}</span><span class="field-note">${u.employee_id} · ${u.role}</span></div>`);
        row.onclick = ()=> goToPerson(u.id);
        card.appendChild(row);
      });
      results.appendChild(card);
    }
    if(vehicleMatches.length){
      results.appendChild(el(`<div class="section-title">รถ</div>`));
      const card = el(`<div class="card"></div>`);
      vehicleMatches.forEach(v=>{
        const row = el(`<div class="list-row" style="cursor:pointer;"><span class="mono">${v.code}</span><span class="field-note">${v.vehicle_type} · ${v.status}</span></div>`);
        row.onclick = ()=> goToVehicle(v.id);
        card.appendChild(row);
      });
      results.appendChild(card);
    }
  }
  input.addEventListener("input", runSearch);
}

  main.appendChild(el(`<div class="section-title">สรุปผลงาน</div>`));
  const today = new Date();
  const dayDefault = today.toISOString().slice(0,10);
  const monthDefault = today.toISOString().slice(0,7);

    <div class="subtabs">

    </div>
  </div>`);
  main.appendChild(statCard);

  let period = "day";
  async function loadStats(){
    const dateVal = statCard.querySelector("#dh-date").value;

      const res = await api(`/drivers/me/stats?period=${period}&date=${dateVal}`, {background:true});
      statCard.querySelector("#dh-count").textContent = res.task_count;
      statCard.querySelector("#dh-pallet").textContent = res.pallet_total;
    }catch(e){ toast(e.message); }
  }
  statCard.querySelectorAll("[data-period]").forEach(b=>{

      period = b.dataset.period;
      statCard.querySelectorAll("[data-period]").forEach(x=> x.classList.toggle("active", x===b));
      const dateInput = statCard.querySelector("#dh-date");
      dateInput.type = period === "day" ? "date" : "month";
      dateInput.value = period === "day" ? dayDefault : monthDefault;
      loadStats();
    };
  });
  statCard.querySelector("#dh-date").onchange = loadStats;
  loadStats();

  const done = state.tasks.filter(t=> t.driver_employee_id === state.employee_id && ["Completed","Cancelled"].includes(t.status));
  main.appendChild(el(`<div class="section-title">ประวัติงาน</div>`));

  done.forEach(t=> main.appendChild(el(taskCard(t, `<button class="btn" data-chat="${t.id}">💬 แชท</button>`))));
  bindCardActions(main);
  bindCardClickToDetail(main);
}

function openBatterySheet(taskId, mode){
  const title = mode === "self-assign" ? "รับงานด้วยตัวเอง" : mode === "take-over" ? "รับช่วงงานนี้"
    : mode === "join" ? "เข้าร่วมงานนี้" : "รับงาน (Accept)";
  const overlay = el(`
    <div class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>${title}</h2><button id="sh-close">✕</button></div>
        <div class="field-note">กรุณาระบุระดับแบตเตอรี่ปัจจุบันของรถ</div>
        <label>แบตเตอรี่ %</label>
        ${batterySliderHTML("bt-battery", 80)}
        <button class="primary" id="bt-submit">ยืนยัน</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  wireBatterySlider(overlay, "bt-battery");
  overlay.querySelector("#sh-close").onclick = ()=> closeSheet(overlay);
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(overlay); };
  overlay.querySelector("#bt-submit").onclick = async ()=>{
    const battery_level = parseInt(overlay.querySelector("#bt-battery").value || "0");
    const endpoint = mode === "self-assign" ? `/tasks/${taskId}/self-assign`
      : mode === "take-over" ? `/tasks/${taskId}/take-over`
      : mode === "join" ? `/tasks/${taskId}/join` : `/tasks/${taskId}/accept`;
    // Close the sheet first: the driver has committed, and leaving it up while
    // the network call runs is what made this feel slow. taskAction then shows
    // the result on the card underneath, and rolls it back if the server says
    // no (most often because another driver claimed it a moment earlier).
    closeSheet(overlay);
    await taskAction({
      id: taskId,
      key: mode,
      patch: OPTIMISTIC_PATCH[mode],
      run: ()=> api(endpoint, {method:"POST", body: JSON.stringify({battery_level})}),
      successMsg: mode === "self-assign" ? "รับงานแล้ว" : "สำเร็จ",
    });
  };
}

      <button class="btn" data-export="today">วันนี้</button>

  const PERF_KEYS = ["avg_process_time_minutes", "qty_per_hour", "people_utilization", "vehicle_utilization"];

  function buildKpiGrid(ov, keys){
    const grid = el(`<div class="stat-grid"></div>`);
    keys.forEach(k=>{
      const v = ov.kpi[k];
      const trend = ov.trend[k];
      let trendHtml = "";

        const up = trend >= 0;
