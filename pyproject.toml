[project]
name = "scdc-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "pywebpush>=2.0",
    "cryptography>=42.0",
    "openpyxl>=3.1",
    "psycopg2-binary>=2.9",
]

[tool.vercel]
entrypoint = "backend.main:app"
